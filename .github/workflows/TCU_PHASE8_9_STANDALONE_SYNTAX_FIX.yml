name: THE CALL-UP Phase 8-9 Standalone Import Syntax Repair and Fresh Release Gate

on:
  push:
    paths:
      - '.github/workflows/TCU_PHASE8_9_STANDALONE_SYNTAX_FIX.yml'
  workflow_dispatch:

permissions:
  contents: write

