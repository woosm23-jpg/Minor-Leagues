            reconcileCurrentMlbServiceDate(session, nextStartDate);
            session.lastProgress = null;'''
          after='''  session.playerStateDate = nextStartDate;
            reconcileCurrentMlbServiceDate(session, nextStartDate);
            // The 2028 opening-day service credit can change a known player's
            // free-agency eligibility. Re-evaluate the market against the same
            // authoritative contract data before save, rather than mutating it
            // only when a saved career is restored later.
            session.contractMarketStates = normalizeContractMarketStatesForFixture(
              session.fixture, session.contractStates, session.contractMarketStates,
              { currentDate: nextStartDate }
            );
            session.lastProgress = null;'''
          if s.count(before)!=1:
              raise RuntimeError(f'opening-day contract-market sync anchor mismatch: {s.count(before)}')
          p.write_text(s.replace(before,after,1),encoding='utf8')
          print('Opening-day contract and agent market service days synchronized before save')
          TCU_OPENING_MARKET_CLOCK
          python3 - <<'TCU_STANDALONE_ALIAS_FIX'
          from pathlib import Path
          p = Path('scripts/build-standalone.mjs')
          s = p.read_text(encoding='utf8')
          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1: raise RuntimeError(f'{label}: expected one exact bundler anchor; found {n}')
              s = s.replace(old, new, 1)
          
          helper = r"""function parseImportBindings(names) {
            // ESM `import { publicName as localName }` is not valid object destructuring.
            // Standalone CommonJS-style wrappers require `{ publicName: localName }`.
            const parts = names.split(',').map((part) => part.trim()).filter(Boolean);
            if (!parts.length) throw new Error('standalone named import list is empty');
            return parts.map((part) => {
              const match = part.match(/^([A-Za-z_$][\w$]*)(?:\s+as\s+([A-Za-z_$][\w$]*))?$/);
              if (!match) throw new Error(`Unsupported standalone named import: ${part}`);
              return match[2] ? `${match[1]}: ${match[2]}` : match[1];
            }).join(', ');
          }
          
          """
          once('function transform(mod) {', helper + 'function transform(mod) {', 'import alias parser')
          once('${names.trim()}', '${parseImportBindings(names)}', 'import alias transformation')
          old = r""".map((mod)=>`__modules[${JSON.stringify(mod.id)}] = function(module, exports, __require) {\n${transform(mod)}\n};`).join("\n");"""
          new = r""".map((mod) => {
              const compiled = transform(mod);
              try {
                // This catches invalid JS before Chromium tries to boot a 100MB+ HTML.
                new Function('module', 'exports', '__require', compiled);
              } catch (error) {
                throw new SyntaxError(`standalone module syntax ${mod.id}: ${error.message}`);
              }
              return `__modules[${JSON.stringify(mod.id)}] = function(module, exports, __require) {\n${compiled}\n};`;
            }).join("\n");"""
          once(old, new, 'per-module syntax verification')
          p.write_text(s, encoding='utf8')
          print('Standalone module aliases + per-module JS compile checks installed')
          TCU_STANDALONE_ALIAS_FIX
          node --check scripts/build-standalone.mjs
          node --check src/api/seasonApi.js
          node --check scripts/verify-phase8-fresh-v3-two-year.mjs
          python3 -m py_compile scripts/browser-phase9-rc-smoke.py
          git diff --check
