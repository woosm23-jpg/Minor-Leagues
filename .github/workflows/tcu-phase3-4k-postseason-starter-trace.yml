name: THE CALL-UP Phase 3 4K Full Postseason Starter Trace

on:
  push:
    paths:
      - '.github/workflows/tcu-phase3-4k-postseason-starter-trace.yml'
  workflow_dispatch:

permissions:
  contents: write

