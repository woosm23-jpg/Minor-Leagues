name: THE CALL-UP v57 Draft International Bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v57-draft-international-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v57:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v56 baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/src/api/seasonApi.js)" = "b0208805364c5842d155dd24280f907abec958aa"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "8505d4ac37ec1226371f7c3ba79127693a88b403"
          test "$(git hash-object work/src/services/productionOffseasonEcology.js)" = "f630e8372f0a044d3f90cef669de98bda2861642"
          test "$(git hash-object work/src/ui/seasonRender.js)" = "ed45fd3eca546ab920e32132d9c42e6a22f6f4e8"
          test "$(git hash-object work/src/app/seasonApp.js)" = "836fb0d8224d57fb5dff7e9f90ed9409fad48892"
          test "$(git hash-object work/README_KO.md)" = "13e3b90a220f8590a585896c6c27818c40008eb1"
          test "$(git hash-object work/reports/v56-postseason-awards-history-checkpoint.json)" = "3d68eacfaf5ac228173526a5dcd5f8854f866050"

      - name: Apply v57 Draft International implementation
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/src/engine/career work/scripts work/reports
          echo '' | base64 -d > work/src/engine/career/amateurAcquisition.js
          echo '' | base64 -d > work/scripts/verify-v57-draft-international.mjs
          echo '' | base64 -d > work/scripts/browser-v57-draft-international.py
          echo '' | base64 -d > /tmp/patch-v57.py
          python3 /tmp/patch-v57.py
          node --check work/src/engine/career/amateurAcquisition.js
          node --check work/src/services/seasonSerialization.js
          node --check work/src/services/productionOffseasonEcology.js
          node --check work/src/api/seasonApi.js
          node --check work/src/ui/seasonRender.js
          node --check work/src/app/seasonApp.js
          node --check work/scripts/verify-v57-draft-international.mjs
          python3 -m py_compile work/scripts/browser-v57-draft-international.py
          grep -q 'full_career_draft_international_v57' work/src/api/seasonApi.js
          grep -q 'ruleset_2026_rule4_draft' work/src/engine/career/amateurAcquisition.js
          grep -q 'Snapshot protected' work/src/ui/seasonRender.js

      - name: v57 focused gate
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v57-draft-international.mjs
          cat reports/v57-draft-international-gate.json

      - name: v56 postseason awards history regression
        id: v56
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v56-postseason-awards-history.mjs

      - name: v55 full offseason regression
        id: v55
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v55-full-offseason.mjs

      - name: v55.1 performance regression
        id: perf
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v55-1-performance.mjs
          cat reports/v55-1-performance-gate.json

      - name: Build v57 Production standalone
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs --output=dist/THE_CALL_UP_SEASON_STANDALONE_v57_PRODUCTION.html --master-snapshot=/tmp/tcu-production-v2.json
          python3 - <<'PY2'
          from pathlib import Path
          p=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v57_PRODUCTION.html")
          s=p.read_text(encoding="utf-8")
          for old in ["Season v56","Season v55.1 PERFORMANCE","Season v55","Season v49"]:
              s=s.replace(old,"Season v57")
          p.write_text(s,encoding="utf-8")
          assert p.stat().st_size > 1_000_000
          for needle in ["full_career_draft_international_v57","data-league-section=\"AMATEUR\"","ruleset_2026_rule4_draft","Snapshot protected"]:
              assert needle in s, needle
          PY2

      - name: Install isolated Playwright
        id: playwright
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-v57-browser
          source /tmp/tcu-v57-browser/bin/activate
          python -m pip install --upgrade pip
          pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: v57 mobile browser and interaction performance
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tcu-v57-browser/bin/activate
          cd work
          python scripts/browser-v57-draft-international.py
          cat reports/v57-browser-smoke.json

      - name: v57 checkpoint report
        id: checkpoint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY2'
          import hashlib,json
          from pathlib import Path
          focused=json.loads(Path("reports/v57-draft-international-gate.json").read_text())
          browser=json.loads(Path("reports/v57-browser-smoke.json").read_text())
          perf=json.loads(Path("reports/v55-1-performance-gate.json").read_text())
          assert focused["pass"] and browser["pass"] and perf["pass"]
          html=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v57_PRODUCTION.html")
          data=html.read_bytes()
          report={
            "schema":"THE_CALL_UP_V57_DRAFT_INTERNATIONAL_CHECKPOINT",
            "pass":True,
            "rules":focused["rules"],
            "snapshotProtection":focused["snapshotProtection"],
            "features":{
              "draftClassPreparedAheadOfEvent":True,
              "twentyRoundBaseDraft":True,
              "sixPickLotteryShape":True,
              "official2026OpeningOrder":True,
              "teamSpecificScoutingNoise":True,
              "draftSlotRatingsInvariant":True,
              "signability":True,
              "internationalSigningWindow":True,
              "clubBonusPoolTiers2026":True,
              "originNoAbilityModifier":True,
              "boundedDevelopmentReserve":True,
              "retirementVacancyBackfill":True,
              "populationStable":True,
              "saveRestore":True,
              "mobileAmateurUi":True
            },
            "explicitAbstractions":{
              "competitiveBalanceAndCompensationPicks":"ABSTRACTED_V57",
              "futureLotteryRevenueSharingEligibility":"DEFERRED_NO_FINANCE_DATA",
              "internationalPoolTrading":"DEFERRED_V57",
              "rookieComplexLeagues":"DEVELOPMENT_RESERVE"
            },
            "performance":{
              "getSeasonWarmAverageMs":perf["timingsMs"]["getSeasonWarmAverage"],
              "browserInteractionMs":browser["timingsMs"]
            },
            "regression":{"v56PostseasonAwardsHistory":True,"v55FullOffseason":True,"v55_1Performance":True},
            "standalone":{"filename":html.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()},
            "next":"v58 Retirement / Hall of Fame"
          }
          Path("reports/v57-draft-international-checkpoint.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY2

      - name: Aggregate v57 validation outcomes
        id: aggregate
        if: always()
        shell: bash
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          V56: ${{ steps.v56.outcome }}
          V55: ${{ steps.v55.outcome }}
          PERF: ${{ steps.perf.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          CHECKPOINT: ${{ steps.checkpoint.outcome }}
        run: |
          set -euo pipefail
          printf '%-14s %s\n' BASELINE "$BASELINE" PATCH "$PATCH" FOCUSED "$FOCUSED" V56 "$V56" V55 "$V55" PERF "$PERF" BUILD "$BUILD" PLAYWRIGHT "$PLAYWRIGHT" BROWSER "$BROWSER" CHECKPOINT "$CHECKPOINT"
          for value in "$BASELINE" "$PATCH" "$FOCUSED" "$V56" "$V55" "$PERF" "$BUILD" "$PLAYWRIGHT" "$BROWSER" "$CHECKPOINT"; do
            test "$value" = "success"
          done

      - name: Commit verified v57
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            work/src/engine/career/amateurAcquisition.js \
            work/src/services/seasonSerialization.js \
            work/src/services/productionOffseasonEcology.js \
            work/src/api/seasonApi.js \
            work/src/ui/seasonRender.js \
            work/src/app/seasonApp.js \
            work/scripts/verify-v57-draft-international.mjs \
            work/scripts/browser-v57-draft-international.py \
            work/README_KO.md \
            work/reports/v57-draft-international-gate.json \
            work/reports/v57-browser-smoke.json \
            work/reports/v57-draft-international-checkpoint.json
          git rm -f .github/workflows/tcu-v57-draft-international-bundle.yml
          git commit -m "v57: add draft and international amateur pipeline [skip ci]"
          git push origin HEAD:main

      - name: Upload v57 checkpoint artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v57_DRAFT_INTERNATIONAL
          path: |
            work/dist/THE_CALL_UP_SEASON_STANDALONE_v57_PRODUCTION.html
            work/reports/v57-draft-international-gate.json
            work/reports/v57-browser-smoke.json
            work/reports/v57-draft-international-checkpoint.json
            work/reports/v55-1-performance-gate.json
            work/README_KO.md
          if-no-files-found: ignore
          compression-level: 0
