name: THE CALL-UP Phase 3 4P Automatic MLB Injury Call-up and Return

on:
  push:
    paths:
      - '.github/workflows/tcu-phase3-4p-automatic-injury-callup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  automatic-injury-callup-return:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify installed 4O primitives and exact source baseline
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("reports/phase3-emergency-callup-primitives-4o-v1.json","utf8"));if(r.pass!==true||r.snapshotHash!=="fnv1a32:f7b34713"||r.pending.automaticInjuryTrigger!==false)process.exit(1);console.log("4O prerequisite PASS");'
          test -f src/api/seasonApi.js
          test -f src/engine/career/rosterControlState.js
