name: THE CALL-UP v56 Postseason Awards History Bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v56-postseason-awards-history-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v56-postseason-awards-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Verify v55.1 baseline
        run: |
          set -euo pipefail
          test "$(git hash-object work/reports/v55-1-performance-checkpoint.json)" = "eef0abcb35368a9a4b52f155ac27eba7ce94d899"
          test "$(git hash-object work/src/api/seasonApi.js)" = "569b0654e9139b2889505bf16c593591bd6d20dc"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "9fd23d8974662a05908a14bf1afd08cd2b1c175f"
          test "$(git hash-object work/src/engine/career/offseasonPipeline.js)" = "9b66a0d44a5f8be8f99022142eb6fe8d407eff1b"
          test "$(git hash-object work/src/ui/seasonRender.js)" = "cc671b7a49944f8eff551d5acf93bdb64597984a"
          test "$(git hash-object work/src/app/seasonApp.js)" = "c74db497e7651775401ac9ce5ad7950e41ea17d5"
          test "$(git hash-object work/src/engine/season/seasonState.js)" = "c2631bf5a6038a5f51116513e304d0b395ccdc59"

      - name: Install v56 Postseason Awards History
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/src/engine/career/postseasonHistory.js
          echo '' | base64 -d > work/scripts/verify-v56-postseason-awards-history.mjs
          echo '' | base64 -d > work/scripts/browser-v56-postseason-history.py
          echo '' | base64 -d > work/README_KO.md
          echo '' | base64 -d > /tmp/patch-v56.py
          python3 /tmp/patch-v56.py
          node --check work/src/engine/career/postseasonHistory.js
          node --check work/src/engine/career/careerEvents.js
          node --check work/src/services/seasonSerialization.js
          node --check work/src/api/seasonApi.js
          node --check work/src/ui/seasonRender.js
          node --check work/src/app/seasonApp.js
          node --check work/scripts/verify-v56-postseason-awards-history.mjs
          python3 -m py_compile work/scripts/browser-v56-postseason-history.py

      - name: v56 cross-contract preflight
        id: preflight
        continue-on-error: true
        run: |
          set -euo pipefail
          grep -q 'ruleset_2026_postseason' work/src/engine/career/postseasonHistory.js
          grep -q 'POSTSEASON_ROSTER' work/src/engine/career/careerEvents.js
          grep -q 'postseasonState: session.postseasonState' work/src/services/seasonSerialization.js
          grep -q 'historyState: session.historyState' work/src/services/seasonSerialization.js
          grep -q 'START_POSTSEASON' work/src/ui/seasonRender.js
          grep -q 'POSTSEASON_NEXT' work/src/app/seasonApp.js
          grep -q 'DEFERRED_FIELDING_EVENT_TOTALS_REQUIRED' work/src/api/seasonApi.js
          grep -q 'full_career_postseason_awards_history_v56' work/src/api/seasonApi.js

      - name: v56 focused Postseason Awards History gate
        id: focused
        continue-on-error: true
        run: cd work && node scripts/verify-v56-postseason-awards-history.mjs

      - name: Re-run v55.1 performance gate
        id: perf
        continue-on-error: true
        run: cd work && node scripts/verify-v55-1-performance.mjs

      - name: Re-run v55 Full Offseason gate
        id: reg_v55
        continue-on-error: true
        run: cd work && node scripts/verify-v55-full-offseason.mjs

      - name: Re-run v54 Trade System gate
        id: reg_v54
        continue-on-error: true
        run: cd work && node scripts/verify-v54-trade-system.mjs

      - name: Re-run v54 Trade Rollover gate
        id: reg_v54_roll
        continue-on-error: true
        run: cd work && node scripts/verify-v54-trade-rollover.mjs

      - name: Re-run current MVP regression
        id: mvp
        continue-on-error: true
        run: cd work && node scripts/verify-v50-1g-current-mvp.mjs --verify --output=reports/v56-current-mvp-regression.json

      - name: Re-run Production runtime
        id: runtime
        continue-on-error: true
        run: cd work && node scripts/verify-v50-2a-production-data-runtime.mjs --verify --output=reports/v56-production-runtime-regression.json

      - name: Build v56 Production standalone
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs --output=dist/THE_CALL_UP_SEASON_STANDALONE_v56_PRODUCTION.html --master-snapshot=/tmp/tcu-production-v2.json
          python3 - <<'PY2'
          from pathlib import Path
          p=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v56_PRODUCTION.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("Season v49","Season v56").replace("Season v55.1 PERFORMANCE","Season v56").replace("Season v55","Season v56")
          p.write_text(s,encoding="utf-8")
          assert p.stat().st_size>1_000_000
          for needle in ["START_POSTSEASON","POSTSEASON_NEXT","League History","full_career_postseason_awards_history_v56"]:
              assert needle in s, needle
          PY2

      - name: Install isolated Playwright
        id: playwright
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-v56-browser
          source /tmp/tcu-v56-browser/bin/activate
          python -m pip install --upgrade pip
          pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: v56 mobile browser smoke
        id: browser
        continue-on-error: true
        run: |
          set -euo pipefail
          source /tmp/tcu-v56-browser/bin/activate
          cd work
          python scripts/browser-v56-postseason-history.py

      - name: Re-run v55.1 mobile performance smoke on v56 HTML
        id: perf_browser
        continue-on-error: true
        run: |
          set -euo pipefail
          source /tmp/tcu-v56-browser/bin/activate
          cd work
          cp dist/THE_CALL_UP_SEASON_STANDALONE_v56_PRODUCTION.html dist/THE_CALL_UP_SEASON_STANDALONE_v55_1_PERFORMANCE.html
          python scripts/browser-v55-1-performance.py

      - name: v56 checkpoint report
        id: checkpoint
        continue-on-error: true
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY2'
          import hashlib,json
          from pathlib import Path
          focused=json.loads(Path("reports/v56-postseason-awards-history-gate.json").read_text())
          browser=json.loads(Path("reports/v56-browser-smoke.json").read_text())
          perf=json.loads(Path("reports/v55-1-performance-gate.json").read_text())
          perf_browser=json.loads(Path("reports/v55-1-browser-performance.json").read_text())
          mvp=json.loads(Path("reports/v56-current-mvp-regression.json").read_text())
          runtime=json.loads(Path("reports/v56-production-runtime-regression.json").read_text())
          assert all(x["pass"] for x in [focused,browser,perf,perf_browser,mvp,runtime])
          html=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v56_PRODUCTION.html");data=html.read_bytes()
          report={
            "schema":"THE_CALL_UP_V56_POSTSEASON_AWARDS_HISTORY_CHECKPOINT","pass":True,
            "ruleset":{"id":"ruleset_2026_postseason","officialFormatVerified":"2026-09-22","teams":12,"rosterSize":26},
            "features":{"postseasonField":True,"official2026SeedingShape":True,"tiebreakChain":True,"roundRosters":True,"separatePostseasonStats":True,"championFinalization":True,"worldSeriesMvp":True,"mvp":True,"cyYoung":True,"silverSlugger":True,"goldGloveDeferredUntilFieldingValueStore":True,"annualHistoryArchive":True,"championshipParticipationDistinction":True,"careerEvents":True,"midPostseasonSaveRestore":True,"legacyOffseasonAutoBridge":True,"mobileHistoryUi":True},
            "performance":{"getSeasonWarmAverageMs":perf["timingsMs"]["getSeasonWarmAverage"],"browserTabTimingsMs":perf_browser["timingsMs"]},
            "regression":{"v55_1Performance":True,"v55FullOffseason":True,"v54TradeSystem":True,"v54TradeRollover":True,"v50_1CurrentMvp":True,"v50_2ProductionRuntime":True},
            "standalone":{"filename":html.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()},
            "next":"v57 Draft / International"
          }
          Path("reports/v56-postseason-awards-history-checkpoint.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY2

      - name: Aggregate v56 validation outcomes
        id: aggregate
        if: always()
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          PERF: ${{ steps.perf.outcome }}
          V55: ${{ steps.reg_v55.outcome }}
          V54: ${{ steps.reg_v54.outcome }}
          V54ROLL: ${{ steps.reg_v54_roll.outcome }}
          MVP: ${{ steps.mvp.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          PERF_BROWSER: ${{ steps.perf_browser.outcome }}
          CHECKPOINT: ${{ steps.checkpoint.outcome }}
        run: |
          set -euo pipefail
          printf '%-14s %s\n' PREFLIGHT "$PREFLIGHT" FOCUSED "$FOCUSED" PERF "$PERF" V55 "$V55" V54 "$V54" V54ROLL "$V54ROLL" MVP "$MVP" RUNTIME "$RUNTIME" BUILD "$BUILD" PLAYWRIGHT "$PLAYWRIGHT" BROWSER "$BROWSER" PERF_BROWSER "$PERF_BROWSER" CHECKPOINT "$CHECKPOINT"
          failed=0
          for value in "$PREFLIGHT" "$FOCUSED" "$PERF" "$V55" "$V54" "$V54ROLL" "$MVP" "$RUNTIME" "$BUILD" "$PLAYWRIGHT" "$BROWSER" "$PERF_BROWSER" "$CHECKPOINT"; do
            if [ "$value" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi

      - name: Commit verified v56
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            work/src/engine/career/postseasonHistory.js \
            work/src/engine/career/careerEvents.js \
            work/src/services/seasonSerialization.js \
            work/src/api/seasonApi.js \
            work/src/ui/seasonRender.js \
            work/src/app/seasonApp.js \
            work/scripts/verify-v56-postseason-awards-history.mjs \
            work/scripts/browser-v56-postseason-history.py \
            work/README_KO.md \
            work/reports/v56-postseason-awards-history-gate.json \
            work/reports/v56-browser-smoke.json \
            work/reports/v56-current-mvp-regression.json \
            work/reports/v56-production-runtime-regression.json \
            work/reports/v56-postseason-awards-history-checkpoint.json
          git rm -f .github/workflows/tcu-v56-postseason-awards-history-bundle.yml
          git commit -m "v56: add postseason awards and annual history archive [skip ci]"
          git push origin HEAD:main

      - name: Upload v56 checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v56_POSTSEASON_AWARDS_HISTORY
          path: |
            work/dist/THE_CALL_UP_SEASON_STANDALONE_v56_PRODUCTION.html
            work/reports/v56-postseason-awards-history-gate.json
            work/reports/v56-browser-smoke.json
            work/reports/v56-postseason-awards-history-checkpoint.json
            work/README_KO.md
          if-no-files-found: ignore
          compression-level: 0
