name: THE CALL-UP Phase 3 4D Recovery 3

on:
  push:
    paths:
      - '.github/workflows/tcu-phase3-4d-recovery3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-4d:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover Phase 3 Bundle 4D
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/tcu_4d_recovery3.py <<'PY'
          from pathlib import Path
          import base64
          import subprocess

          ROOT = Path.cwd()
          SOURCE = ROOT / ".github/workflows/tcu-phase3-4d-late-game-bench.yml"

          workflow = SOURCE.read_text(encoding="utf-8")

          prefix = "echo '"
          suffix = "' | base64 -d > /tmp/tcu_phase3_4d.py"

          if prefix not in workflow or suffix not in workflow:
              raise RuntimeError("원본 4D installer 줄을 찾지 못했습니다.")

          encoded = workflow.split(prefix, 1)[1].split(suffix, 1)[0]
          installer = base64.b64decode(encoded).decode("utf-8")

          patch_code = """
          # 4D Fix 2A: protect backup catcher at PINCH_BAT role classification.
          p = WORK / "src/engine/game/benchUsageAI.js"
          source = p.read_text(encoding="utf-8")
          old_classify = base64.b64decode("").decode("utf-8")
          new_classify = base64.b64decode("").decode("utf-8")

          if "const nonCatcherPinchBatPool = rows.filter(" not in source:
              if old_classify not in source:
                  raise RuntimeError("PINCH_BAT classifier anchor missing")
              source = source.replace(old_classify, new_classify, 1)

          # 4D Fix 2B: force-install the tactical pinch-hitter function.
          choose_hitter = base64.b64decode("").decode("utf-8")
          start = source.find("function choosePinchHitter({")
          end = source.find("function chooseDefensiveReplacement({", start)

          if start < 0 or end < 0:
              raise RuntimeError("choosePinchHitter boundaries missing")

          source = source[:start] + choose_hitter + source[end:]
          p.write_text(source, encoding="utf-8")

          run(["node", "--check", "src/engine/game/benchUsageAI.js"])
          """

          needle = 'verifier = dec("'
          if needle not in installer:
              raise RuntimeError("4D verifier insertion anchor missing")

          installer = installer.replace(
              needle,
              patch_code + "\n" + needle,
              1
          )

          target = Path("/tmp/tcu_phase3_4d_recovered3.py")
          target.write_text(installer, encoding="utf-8")

          subprocess.run(
              ["python3", "-m", "py_compile", str(target)],
              check=True
          )
          subprocess.run(
              ["python3", str(target)],
              cwd=ROOT,
              check=True
          )

          PY
          python3 -m py_compile /tmp/tcu_4d_recovery3.py
          python3 /tmp/tcu_4d_recovery3.py
