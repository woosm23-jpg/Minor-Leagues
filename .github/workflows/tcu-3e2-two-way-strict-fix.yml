name: THE CALL-UP 3E2 Two Way Strict Fix

on:
  push:
    paths:
      - '.github/workflows/tcu-3e2-two-way-strict-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tighten two-way qualification
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/tcu_3e2_fix.py
          python3 -m py_compile /tmp/tcu_3e2_fix.py
          python3 /tmp/tcu_3e2_fix.py
