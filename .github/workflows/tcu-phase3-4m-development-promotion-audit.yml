name: THE CALL-UP Phase 3 4M Development and Promotion Audit

on:
  push:
    paths:
      - '.github/workflows/tcu-phase3-4m-development-promotion-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  development-promotion-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 4L baseline and legacy promotion evaluator
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          node -e 'const r=JSON.parse(require("node:fs").readFileSync("reports/phase3-full-postseason-rotation-gate-4l-v1.json","utf8"));if(r.pass!==true||r.gates.fullPostseasonCompleted!==true||r.snapshotHash!=="fnv1a32:f7b34713")process.exit(1);console.log("4L full postseason baseline PASS");'
          node scripts/verify-season-promotion-ai-v22.js --verify --output=reports/.phase3-4m-promotion-v50.json
          node -e 'const r=JSON.parse(require("node:fs").readFileSync("reports/.phase3-4m-promotion-v50.json","utf8"));if(!r.pass||!r.verified||r.evaluatorRows.length!==4||r.movementRows.length!==4)process.exit(1);console.log("Four adjacent-level promotion/swap checks PASS");'
