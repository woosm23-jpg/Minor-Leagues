      - name: Full unit suite and previously repaired Phase 8 integrity gate
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          npm test
          node scripts/verify-phase8-save-integrity.mjs
          node --input-type=module <<'TCU_PHASE8_PRIOR'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('reports/phase8-save-integrity-bundle.json','utf8'));
          assert.equal(p.pass,true);
          assert.equal(p.fullSaveRestoreDeterministic,true);
          console.log('Latest Phase 8 integrity gate PASS');
          TCU_PHASE8_PRIOR
      - name: Fresh 2026 and 2027 Production v3 full seasons, playoffs and boundary replay
        shell: bash
        working-directory: work
        timeout-minutes: 85
        run: |
          set -euo pipefail
          node --expose-gc --max-old-space-size=4096 scripts/verify-phase8-fresh-v3-two-year.mjs
          node --input-type=module <<'TCU_PHASE8_FRESH_GATE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('reports/phase8-fresh-v3-two-year.json','utf8'));
          assert.equal(p.pass,true);
          assert.equal(p.completedSeasons,2);
          assert.equal(p.worldGames,21420);
          assert.equal(p.replay2027,true);
          assert.equal(p.results[1].historySeasons,2);
          console.log('Phase 8 two-year current-world save gate PASS');
          TCU_PHASE8_FRESH_GATE
      - name: Production v3 full 2026 world regression after fresh long save
        shell: bash
        working-directory: work
        timeout-minutes: 35
        run: |
          set -euo pipefail
          node scripts/verify-phase3-integration-4r.mjs
          node --input-type=module <<'TCU_RC_WORLD'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('reports/phase3-integrated-regression-4r-v1.json','utf8'));
          assert.equal(r.pass,true);
          assert.equal(r.regularSeason.worldGames,10710);
          assert.ok(r.postseason.championTeamId);
          assert.ok(Object.values(r.gates).every(Boolean));
          console.log('Latest Production v3 2026 world and postseason PASS');
          TCU_RC_WORLD
      - name: Build the latest single-file Korean Production v3 HTML release candidate
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          node scripts/build-standalone.mjs --output=dist/THE_CALL_UP_COMPLETE_EDITION_RC.html --master-snapshot=data/the_call_up_snapshot_v3/mlb-milb-2026-production-v3.json.gz
          node --input-type=module <<'TCU_RC_HTML'
          import assert from 'node:assert/strict';
          import {readFileSync,statSync} from 'node:fs';
          const p='dist/THE_CALL_UP_COMPLETE_EDITION_RC.html';
          const html=readFileSync(p,'utf8');
          assert.ok(statSync(p).size>1_000_000,'Unexpectedly small standalone HTML');
          assert.match(html,/<html lang="ko">/);
          assert.match(html,/__THE_CALL_UP_MASTER_SNAPSHOT__/);
          assert.match(html,/THE CALL-UP/);
          assert.match(html,/phase8-current-v3-two-year|complete_edition_v1_0/);
          console.log('Latest production standalone RC bundle structural checks PASS');
          TCU_RC_HTML
      - name: Run Chromium smoke at three phone widths
        shell: bash
        working-directory: work
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/browser-phase9-rc-smoke.py
      - name: Write source-bound release candidate report and SHA-256
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          sha256sum dist/THE_CALL_UP_COMPLETE_EDITION_RC.html data/the_call_up_snapshot_v3/mlb-milb-2026-production-v3.json.gz > dist/RELEASE_CANDIDATE_SHA256.txt
          node --input-type=module <<'TCU_RC_REPORT'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,statSync} from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const read=f=>JSON.parse(readFileSync(f,'utf8'));
          const long=read('reports/phase8-fresh-v3-two-year.json');
          const smoke=read('reports/phase9-rc-mobile-browser.json');
          const world=read('reports/phase3-integrated-regression-4r-v1.json');
          assert.equal(long.pass,true);assert.equal(smoke.pass,true);assert.equal(world.pass,true);
          const data=readFileSync('data/the_call_up_snapshot_v3/mlb-milb-2026-production-v3.json.gz');
          const html=readFileSync('dist/THE_CALL_UP_COMPLETE_EDITION_RC.html');
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const report={schema:'THE_CALL_UP_PHASE8_9_RELEASE_CANDIDATE_V1',pass:true,
            sourceCommit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),
            dataSha256:sha(data),htmlSha256:sha(html),htmlBytes:statSync('dist/THE_CALL_UP_COMPLETE_EDITION_RC.html').size,
            freshWorldYears:long.completedSeasons,freshWorldGames:long.worldGames,
            worldRegression2026Games:world.regularSeason.worldGames,
            mobileBrowser:smoke.checks,limitations:['Release candidate, not final COMPLETE','Historical 20-year v59 is not fresh-current-code validation','Chromium smoke is not physical-phone timing']};
          writeFileSync('reports/phase8-9-release-candidate.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          TCU_RC_REPORT
          git diff --check
      - name: Commit verified scripts and reports from the tested source
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git add src/api/seasonApi.js scripts/verify-phase8-fresh-v3-two-year.mjs scripts/browser-phase9-rc-smoke.py reports/phase8-fresh-v3-two-year.json reports/phase9-rc-mobile-browser.json reports/phase8-9-release-candidate.json reports/phase3-integrated-regression-4r-v1.json reports/phase8-save-integrity-bundle.json
