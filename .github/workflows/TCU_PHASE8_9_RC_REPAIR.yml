name: THE CALL-UP Phase 8-9 Rollover Save Repair and Release Candidate

on:
  push:
    paths:
      - '.github/workflows/TCU_PHASE8_9_RC_REPAIR.yml'
  workflow_dispatch:

permissions:
  contents: write

