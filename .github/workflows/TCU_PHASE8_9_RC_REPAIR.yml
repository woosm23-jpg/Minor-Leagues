          s=p.read_text(encoding='utf8')
          before='''  const reset = resetSeasonStatesForNewYear({ playerStates: ecology.playerStates, pitcherStates: ecology.pitcherStates, roleStates: session.roleStates, startDate: nextStartDate });
            session.playerStates = reset.playerStates;
            session.pitcherStates = reset.pitcherStates;'''
          after='''  const reset = resetSeasonStatesForNewYear({ playerStates: ecology.playerStates, pitcherStates: ecology.pitcherStates, roleStates: session.roleStates, startDate: nextStartDate });
            // The new roster is authoritative. Remove out-of-roster state left by old
            // assignments during rollover, not only when a save is later restored.
            // Both paths must produce the same active-player map and development data.
            session.playerStates = normalizePlayerStates(session.fixture, reset.playerStates);
            session.pitcherStates = normalizePitcherStates(session.fixture, reset.pitcherStates);'''
          if s.count(before)!=1:
              raise RuntimeError(f'2027 active-roster normalization anchor mismatch: {s.count(before)}')
          p.write_text(s.replace(before,after,1),encoding='utf8')
          print('2027 rollover: active roster and save/restore state normalization synchronized')
