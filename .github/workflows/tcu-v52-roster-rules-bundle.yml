name: THE CALL-UP v52 Roster Rules Bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v52-roster-rules-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v52-roster-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v51 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/reports/v51-contracts-service-checkpoint.json)" = "211509ebceca125a6a1c50db280a2651615fe8f6"
          test "$(git hash-object work/src/engine/career/contractRules.js)" = "d16861699636f750efb16cb572a40cdd49466070"
          test "$(git hash-object work/src/engine/career/contractState.js)" = "fafefd7fb9b53316962d9e471a7331fe65098def"
          test "$(git hash-object work/src/api/seasonApi.js)" = "80c0c22d28260d8a08a48342c95939c58d2e1f2a"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "924c7f05276c0123b341da9a1977226673d174d6"
          test "$(git hash-object work/src/services/organizationRosterService.js)" = "851910bba811237b7f3d73efca75c484cca38e06"
          test "$(git hash-object work/src/engine/season/promotionAI.js)" = "a2240daf96aeebdc39eb6b2128d6c303c4f44f30"
          test "$(git hash-object work/src/ui/seasonRender.js)" = "e2c0072ea31a7549d974b1a82a4ffc2775c23352"
          test "$(git hash-object work/src/app/seasonApp.js)" = "b4527965080d22002b66c60b47c26cf66b188eb3"
          test "$(git hash-object work/README_KO.md)" = "5ab29deaa49276fa0a62eba5fe4858ef2f77acf6"

      - name: Install v52 roster rules engine integration and UI
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/src/engine/career/rosterRules.js
          echo '' | base64 -d > work/src/engine/career/rosterControlState.js
          echo '' | base64 -d > work/scripts/verify-v52-roster-rules.mjs
          echo '' | base64 -d > work/scripts/verify-v52-roster-rollover.mjs
          echo '' | base64 -d > work/scripts/browser-roster-v52.py
          echo '' | base64 -d > work/README_KO.md
          echo '' | base64 -d > /tmp/patch-v52.py
          python3 /tmp/patch-v52.py
          node --check work/src/engine/career/rosterRules.js
          node --check work/src/engine/career/rosterControlState.js
          node --check work/src/api/seasonApi.js
          node --check work/src/services/seasonSerialization.js
          node --check work/src/ui/seasonRender.js
          node --check work/scripts/verify-v52-roster-rules.mjs
          node --check work/scripts/verify-v52-roster-rollover.mjs
          python3 -m py_compile work/scripts/browser-roster-v52.py

      - name: v52 focused 40-man options DFA waiver gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v52-roster-rules.mjs
          cat reports/v52-roster-rules-gate.json

      - name: Re-run v51 contract service gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v51-contract-service.mjs

      - name: Re-run current MVP regression
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v50-1g-current-mvp.mjs --verify --output=reports/v52-current-mvp-regression.json

      - name: Re-run Production data runtime gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v50-2a-production-data-runtime.mjs --verify --output=reports/v52-production-data-runtime-regression.json

      - name: Full 2026 to 2027 roster-rule rollover
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v52-roster-rollover.mjs
          cat reports/v52-roster-rollover-gate.json

      - name: Build v52 Production standalone
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs             --output=dist/THE_CALL_UP_SEASON_STANDALONE_v52_PRODUCTION.html             --master-snapshot=/tmp/tcu-production-v2.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v52_PRODUCTION.html")
          s=p.read_text(encoding="utf-8").replace("Season v49","Season v52").replace("Season v51","Season v52")
          p.write_text(s,encoding="utf-8")
          assert p.stat().st_size>1_000_000
          assert "40-man" in s and "DFA / Waivers" in s and "full_career_roster_rules_v52" in s
          PY

      - name: Install isolated Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-v52-browser
          source /tmp/tcu-v52-browser/bin/activate
          python -m pip install --upgrade pip
          pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: v52 mobile roster browser smoke
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tcu-v52-browser/bin/activate
          cd work
          python scripts/browser-roster-v52.py
          cat reports/v52-roster-browser-smoke.json

      - name: v52 checkpoint report
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text(encoding="utf-8"))
          focused=load("reports/v52-roster-rules-gate.json")
          rollover=load("reports/v52-roster-rollover-gate.json")
          browser=load("reports/v52-roster-browser-smoke.json")
          current=load("reports/v52-current-mvp-regression.json")
          runtime=load("reports/v52-production-data-runtime-regression.json")
          assert focused["pass"] and rollover["pass"] and browser["pass"] and current["pass"] and runtime["pass"]
          html=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v52_PRODUCTION.html")
          data=html.read_bytes()
          report={
            "schema":"THE_CALL_UP_V52_ROSTER_RULES_CHECKPOINT",
            "pass":True,
            "version":"v52",
            "ruleset":"ruleset_2026",
            "features":{
              "fortyMan":True,"options":True,"option20DayUse":True,
              "fiveAssignmentsPerSeason":True,"dfa":True,"outrightWaivers":True,
              "promotionConstraintIntegration":True,"saveRestore":True,
              "seasonRollover":True,"playerUi":True
            },
            "regression":{"v51ContractService":True,"v50_1CurrentMvp":True,"v50_2ProductionDataRuntime":True},
            "standalone":{"filename":html.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()},
            "next":"v53 arbitration / free agency"
          }
          Path("reports/v52-roster-rules-checkpoint.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit verified v52 bundle
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             work/src/engine/career/rosterRules.js             work/src/engine/career/rosterControlState.js             work/src/api/seasonApi.js             work/src/services/seasonSerialization.js             work/src/ui/seasonRender.js             work/scripts/verify-v52-roster-rules.mjs             work/scripts/verify-v52-roster-rollover.mjs             work/scripts/browser-roster-v52.py             work/README_KO.md             work/reports/v52-roster-rules-gate.json             work/reports/v52-roster-rollover-gate.json             work/reports/v52-roster-browser-smoke.json             work/reports/v52-current-mvp-regression.json             work/reports/v52-production-data-runtime-regression.json             work/reports/v52-roster-rules-checkpoint.json
          git rm .github/workflows/tcu-v52-roster-rules-bundle.yml
          git commit -m "v52: add 40-man options DFA and waiver foundation [skip ci]"
          git push origin HEAD:main

      - name: Upload v52 Production checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v52_ROSTER_RULES
          path: |
            work/dist/THE_CALL_UP_SEASON_STANDALONE_v52_PRODUCTION.html
            work/reports/v52-roster-rules-gate.json
            work/reports/v52-roster-rollover-gate.json
            work/reports/v52-roster-browser-smoke.json
            work/reports/v52-roster-rules-checkpoint.json
            work/README_KO.md
          if-no-files-found: ignore
          compression-level: 0
