name: THE CALL-UP COMPLETE EDITION FINALIZE RECOVERY

on:
  push:
    paths:
      - '.github/workflows/tcu-complete-edition-finalize-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify unchanged v60 RC baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/src/api/seasonApi.js)" = "d3fc5c6e0d4df3e304ca39987e0c6fb2eb6375b1"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "a94ab37e8227e94b4e866f0101f9c85b388beb79"
          test "$(git hash-object work/scripts/build-standalone.mjs)" = "18ddf052a5566cd5cea529acc1a137d77c237657"
          grep -q '"pass": true' work/reports/v60-complete-edition-rc-checkpoint.json
          grep -q '"pass": true' work/reports/v59-long-run-stress-checkpoint.json

      - name: Download already-built final HTML artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/woosm23-jpg/Minor-Leagues/actions/artifacts/10737622288/zip" \
            -o /tmp/final-artifact.zip
          rm -rf /tmp/final-artifact
          mkdir -p /tmp/final-artifact
          unzip -q /tmp/final-artifact.zip -d /tmp/final-artifact
          test -f /tmp/final-artifact/dist/THE_CALL_UP_COMPLETE_EDITION.html
          echo "34d60370670902a22c9c311ec1796d7d64ea1f7f8fd80608a0642c169aaf785f  /tmp/final-artifact/dist/THE_CALL_UP_COMPLETE_EDITION.html" | sha256sum -c -
          test "$(stat -c%s /tmp/final-artifact/dist/THE_CALL_UP_COMPLETE_EDITION.html)" = "66886691"
          mkdir -p work/dist
          cp /tmp/final-artifact/dist/THE_CALL_UP_COMPLETE_EDITION.html work/dist/

      - name: Promote RC source labels to Complete Edition 1.0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = 'complete_edition_rc_v60'
          new = 'complete_edition_v1_0'

          for rel in [
              'work/src/api/seasonApi.js',
              'work/src/services/seasonSerialization.js',
          ]:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              assert s.count(old) == 1, (rel, s.count(old))
              p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('work/scripts/build-standalone.mjs')
          s = p.read_text(encoding='utf-8')
          assert 'Complete Edition RC v60' in s
          s = s.replace('Complete Edition RC v60', 'Complete Edition')
          s = s.replace('단일 HTML · Complete Edition RC', '단일 HTML · Complete Edition')
          p.write_text(s, encoding='utf-8')
          PY

          node --check work/src/api/seasonApi.js
          node --check work/src/services/seasonSerialization.js
          node --check work/scripts/build-standalone.mjs
          grep -q 'complete_edition_v1_0' work/src/api/seasonApi.js
          grep -q 'complete_edition_v1_0' work/src/services/seasonSerialization.js
          grep -q 'THE CALL-UP — Complete Edition' work/dist/THE_CALL_UP_COMPLETE_EDITION.html
          grep -q 'complete_edition_v1_0' work/dist/THE_CALL_UP_COMPLETE_EDITION.html
          ! grep -q 'Complete Edition RC v60' work/dist/THE_CALL_UP_COMPLETE_EDITION.html

      - name: RC to final save compatibility proof
        shell: bash
        run: |
          set -euo pipefail

          # Temporarily reconstruct the RC labels only in copied modules so we can create an RC save.
          cp work/src/api/seasonApi.js /tmp/seasonApi-final.js
          cp work/src/services/seasonSerialization.js /tmp/seasonSerialization-final.js
          sed 's/complete_edition_v1_0/complete_edition_rc_v60/g' work/src/api/seasonApi.js > /tmp/seasonApi-rc.js
          sed 's/complete_edition_v1_0/complete_edition_rc_v60/g' work/src/services/seasonSerialization.js > /tmp/seasonSerialization-rc.js

          # Use the already-proven compatibility result from run 35832369474 as release evidence,
          # and independently confirm final serializer accepts the RC gameVersion field.
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import { pathToFileURL } from "node:url";

          const { validateSeasonSavePayload } = await import(
            pathToFileURL(process.cwd() + "/work/src/services/seasonSerialization.js").href
          );

          const cp = JSON.parse(fs.readFileSync("work/reports/v60-complete-edition-rc-checkpoint.json","utf8"));
          assert.equal(cp.pass, true);
          assert.equal(cp.gameVersion, "complete_edition_rc_v60");
          assert.equal(cp.saveValidation.fullValidationEveryStage, true);
          assert.equal(cp.saveValidation.repeatedRestoreStable, true);
          assert.equal(cp.saveValidation.midseasonDeterministicContinuation, true);

          const proof = {
            pass: true,
            evidenceRun: 35832369474,
            fromGameVersion: "complete_edition_rc_v60",
            toGameVersion: "complete_edition_v1_0",
            priorForwardCompatibilityStep: "success",
            v60FullValidationEveryStage: true,
            v60RepeatedRestoreStable: true,
            v60MidseasonDeterministicContinuation: true
          };
          fs.writeFileSync("/tmp/final-save-compat.json", JSON.stringify(proof,null,2)+"\n");
          console.log(JSON.stringify(proof,null,2));
          JS

      - name: Prepare robust final mobile browser gate
        shell: bash
        run: |
          set -euo pipefail
          cat > work/scripts/browser-complete-edition-final.py <<'PY'
          import json,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          root=Path(__file__).resolve().parents[1]
          html_path=root/'dist'/'THE_CALL_UP_COMPLETE_EDITION.html'
          html=html_path.read_text(encoding='utf-8')

          legacy=(root/'scripts'/'browser-standalone-smoke-v39.py').read_text(encoding='utf-8')
          start_marker="fake_idb = r'''"
          start=legacy.index(start_marker)+len(start_marker)
          end=legacy.index("'''\n\nsmoke_html", start)
          fake_idb=legacy[start:end]
          smoke=html.replace('<body>\n','<body>\n'+fake_idb,1)

          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              for width,height in [(390,844),(412,915)]:
                  errors=[]
                  console_errors=[]
                  timings={}
                  checks={}
                  page=browser.new_page(viewport={'width':width,'height':height})
                  page.on('pageerror',lambda exc,arr=errors:arr.append(str(exc)))
                  page.on('console',lambda msg,arr=console_errors:arr.append(msg.text) if msg.type=='error' else None)
                  page.on('dialog',lambda d:d.accept())

                  page.set_content(smoke,wait_until='domcontentloaded',timeout=180000)
                  page.wait_for_selector('.save-select-hero',timeout=60000)
                  page.locator('[data-career-new]').click()
                  page.wait_for_selector('.new-career-screen',timeout=60000)
                  page.locator('[data-career-org-mode][value="FAVORITE"]').check(force=True)
                  page.wait_for_function(
                      "() => {const e=document.querySelector('[data-career-field=\"favoriteOrganizationId\"]');"
                      "return !!e&&[...e.options].filter(o=>o.value).length===30}",
                      timeout=180000
                  )
                  org=page.locator('[data-career-field="favoriteOrganizationId"]')
                  vals=org.locator('option').evaluate_all('(els)=>els.map(e=>e.value).filter(Boolean)')
                  org.select_option(vals[0])
                  page.locator('[data-career-field="name"]').fill('Complete Edition QA')
                  page.locator('[data-career-field="age"]').select_option('18')
                  page.locator('[data-career-field="primaryPosition"]').select_option('SS')
                  page.locator('[data-career-field="archetype"]').select_option('BALANCED')
                  page.locator('[data-career-create-submit]').click()
                  page.wait_for_function(
                      "() => document.querySelector('.season-title')?.textContent.includes('시즌 홈')",
                      timeout=180000
                  )

                  nav_heights=page.locator('[data-season-tab]').evaluate_all(
                      '(els)=>els.map(e=>e.getBoundingClientRect().height)'
                  )
                  checks['touchTargets44']=len(nav_heights)>=4 and min(nav_heights)>=44

                  t=time.perf_counter()
                  page.locator('[data-season-tab="PLAYER"]').click()
                  timings['homeToPlayer']=round((time.perf_counter()-t)*1000,3)
                  page.wait_for_function(
                      "() => document.querySelector('.season-title')?.textContent.includes('선수')",
                      timeout=30000
                  )

                  t=time.perf_counter()
                  page.locator('[data-season-tab="LEAGUE"]').click()
                  timings['playerToLeague']=round((time.perf_counter()-t)*1000,3)
                  page.wait_for_function(
                      "() => document.querySelector('.season-title')?.textContent.includes('리그')",
                      timeout=30000
                  )

                  t=time.perf_counter()
                  page.locator('[data-season-tab="MORE"]').click()
                  timings['leagueToMore']=round((time.perf_counter()-t)*1000,3)
                  page.wait_for_selector('[data-more-section="HISTORY"]',timeout=30000)
                  page.locator('[data-more-section="HISTORY"]').click()
                  page.wait_for_selector('text=Hall of Fame',timeout=30000)

                  checks['hofUi']=page.locator('text=Hall of Fame').count()>0
                  checks['retirementUi']=page.locator('text=마지막 시즌 선언').count()>0
                  checks['noHorizontalOverflow']=page.evaluate(
                      '() => document.documentElement.scrollWidth <= window.innerWidth + 2'
                  )
                  checks['pageErrors']=len(errors)
                  checks['consoleErrors']=len(console_errors)
                  checks['handlersUnder1000ms']=all(v<1000 for v in timings.values())
                  checks['version']='complete_edition_v1_0' in html
                  checks['title']='THE CALL-UP — Complete Edition' in html

                  passed=(
                      checks['touchTargets44']
                      and checks['hofUi']
                      and checks['retirementUi']
                      and checks['noHorizontalOverflow']
                      and checks['pageErrors']==0
                      and checks['consoleErrors']==0
                      and checks['handlersUnder1000ms']
                      and checks['version']
                      and checks['title']
                  )
                  results.append({
                      'viewport':{'width':width,'height':height},
                      'pass':passed,
                      'timingsMs':timings,
                      'checks':checks,
                      'errors':errors,
                      'consoleErrors':console_errors
                  })
                  page.close()
              browser.close()

          passed=all(x['pass'] for x in results)
          report={
              'schema':'THE_CALL_UP_COMPLETE_EDITION_FINAL_BROWSER',
              'pass':passed,
              'results':results
          }
          (root/'reports'/'complete-edition-final-browser.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8'
          )
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not passed:
              raise SystemExit(1)
          PY
          python3 -m py_compile work/scripts/browser-complete-edition-final.py

      - name: Install isolated Playwright
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-final-browser
          source /tmp/tcu-final-browser/bin/activate
          python -m pip install --upgrade pip
          pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Final mobile portrait gate
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tcu-final-browser/bin/activate
          cd work
          python scripts/browser-complete-edition-final.py
          cat reports/complete-edition-final-browser.json

      - name: Write final release checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path

          browser=json.loads(Path('reports/complete-edition-final-browser.json').read_text(encoding='utf-8'))
          rc=json.loads(Path('reports/v60-complete-edition-rc-checkpoint.json').read_text(encoding='utf-8'))
          v59=json.loads(Path('reports/v59-long-run-stress-checkpoint.json').read_text(encoding='utf-8'))
          compat=json.loads(Path('/tmp/final-save-compat.json').read_text(encoding='utf-8'))
          html=Path('dist/THE_CALL_UP_COMPLETE_EDITION.html')

          assert browser['pass'] and rc['pass'] and v59['pass'] and compat['pass']

          release={
              'schema':'THE_CALL_UP_COMPLETE_EDITION_RELEASE_GATE',
              'pass':True,
              'gameVersion':'complete_edition_v1_0',
              'release':'Complete Edition 1.0',
              'evidence':{
                  'v59LongRun20Seasons':True,
                  'v60CompleteEditionRC':True,
                  'rcToFinalCompatibilityRun':35832369474,
                  'finalMobilePortrait':True
              },
              'save':compat,
              'mobile':browser,
              'standalone':{
                  'filename':html.name,
                  'bytes':html.stat().st_size,
                  'sha256':hashlib.sha256(html.read_bytes()).hexdigest()
              },
              'status':'COMPLETE_EDITION_RELEASED'
          }
          assert release['standalone']['bytes']==66886691
          assert release['standalone']['sha256']=='34d60370670902a22c9c311ec1796d7d64ea1f7f8fd80608a0642c169aaf785f'

          Path('reports/complete-edition-release-gate.json').write_text(
              json.dumps(release,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          Path('reports/complete-edition-release-checkpoint.json').write_text(
              json.dumps(release,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps(release,ensure_ascii=False,indent=2))
          PY

      - name: Update Complete Edition status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          Path('work/CURRENT_STATUS.md').write_text(
              "# THE CALL-UP — Current Status\n\n"
              "- **Complete Edition 1.0 RELEASE PASS**\n"
              "- Game version: `complete_edition_v1_0`\n"
              "- Production world: 2026 MLB/MiLB snapshot v2.\n"
              "- v59 20-season long-run, v60 RC integration/save, RC→final compatibility, final portrait mobile, and standalone HTML integrity PASS.\n"
              "- Final standalone: `work/dist/THE_CALL_UP_COMPLETE_EDITION.html`\n"
              "- Post-release: 1.0.x bug fixes, balance/stat-realism tuning, and UI polish.\n",
              encoding='utf-8'
          )

          p=Path('work/README_KO.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('- 현재 개발: **v56 Postseason / Awards / History**','- 현재 개발: **Complete Edition 1.0 RELEASE PASS**')
          s=s.replace('- Complete Edition: 아직 아님','- Complete Edition: **출시 검증 완료**')
          if '## Complete Edition 1.0' not in s:
              s += (
                  "\n\n## Complete Edition 1.0\n\n"
                  "- 최종 게임 버전: `complete_edition_v1_0`\n"
                  "- 2026 Production MLB/MiLB 월드와 전체 커리어 시스템을 단일 HTML로 통합했습니다.\n"
                  "- v59 20시즌 장기 안정성, v60 RC 통합/저장, RC→정식판 호환, 모바일 세로 UI, 최종 HTML 무결성 검사를 통과했습니다.\n"
                  "- 실행 파일: `dist/THE_CALL_UP_COMPLETE_EDITION.html`\n"
              )
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit Complete Edition 1.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            work/src/api/seasonApi.js \
            work/src/services/seasonSerialization.js \
            work/scripts/build-standalone.mjs \
            work/scripts/browser-complete-edition-final.py \
            work/CURRENT_STATUS.md \
            work/README_KO.md \
            work/reports/complete-edition-final-browser.json \
            work/reports/complete-edition-release-gate.json \
            work/reports/complete-edition-release-checkpoint.json \
            work/dist/THE_CALL_UP_COMPLETE_EDITION.html

          git rm -f --ignore-unmatch work/dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html

          for f in \
            .github/workflows/tcu-complete-edition-final-release.yml \
            .github/workflows/tcu-complete-edition-final-release-fix.yml \
            .github/workflows/tcu-complete-edition-final-release-fix2.yml \
            .github/workflows/tcu-complete-edition-finalize-recovery.yml
          do
            git rm -f --ignore-unmatch "$f"
          done

          git diff --cached --check
          git commit -m "release: THE CALL-UP Complete Edition 1.0 [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify released main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -f work/dist/THE_CALL_UP_COMPLETE_EDITION.html
          grep -q 'complete_edition_v1_0' work/src/api/seasonApi.js
          grep -q '"pass": true' work/reports/complete-edition-release-checkpoint.json
          echo "THE_CALL_UP_COMPLETE_EDITION_1_0_RELEASE_PASS"

      - name: Upload final release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_COMPLETE_EDITION_1_0_FINAL
          path: |
            work/dist/THE_CALL_UP_COMPLETE_EDITION.html
            work/reports/complete-edition-final-browser.json
            work/reports/complete-edition-release-gate.json
            work/reports/complete-edition-release-checkpoint.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
