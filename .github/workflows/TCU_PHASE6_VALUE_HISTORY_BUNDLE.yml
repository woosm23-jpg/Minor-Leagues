name: THE CALL-UP Phase 6 Transparent Value and History Bundle

on:
  push:
    paths:
      - '.github/workflows/TCU_PHASE6_VALUE_HISTORY_BUNDLE.yml'
  workflow_dispatch:

permissions:
  contents: write

