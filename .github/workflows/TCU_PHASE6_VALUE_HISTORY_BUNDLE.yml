          assert.equal(v.productionV3WorldGames2026,10710);
          assert.equal(v.noOfficialWarClaim,true);
          assert.equal(v.regularAndPostseasonSeparated,true);
          assert.equal(v.saveUnchangedByReadModel,true);
          console.log('Phase 6 value + awards + retirement + current v3 world PASS');
          TCU_PHASE6_FINAL_GATE
          git diff --check
      - name: Commit only after all Phase 6 gates pass
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git add src/engine/season/seasonValueReadModel.js src/engine/career/seasonHistoryAudit.js src/api/seasonApi.js src/ui/seasonRender.js tests/phase6ValueHistory.test.js scripts/verify-phase6-value-history.mjs scripts/verify-v56-postseason-awards-history.mjs reports/phase6-value-history-bundle.json reports/v56-postseason-awards-history-gate.json reports/v58-retirement-hof-gate.json reports/phase3-integrated-regression-4r-v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No verified Phase 6 files to commit; stopping.' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'phase6: transparent read-only value estimates and verified career history'
