          python3 - <<'TCU_PHASE6_PATCH'
          from pathlib import Path

          def once(name, needle, replacement):
              path=Path(name)
              s=path.read_text(encoding='utf8')
              count=s.count(needle)
              if count != 1:
                  raise RuntimeError(f'Phase 6 patch guard: {name} anchor count {count}, expected exactly 1: {needle[:80]}')
              path.write_text(s.replace(needle,replacement,1),encoding='utf8')

          p='src/api/seasonApi.js'
          needle='import { createRetirementHallState, normalizeRetirementHallState, recordMlbSeason, archiveRetiredPlayers, announceUserFinalSeason, retireUserPlayer, processHallOfFameYear, getRetirementHallPublicView } from "../engine/career/retirementHallOfFame.js";'
          once(p,needle,needle+'\nimport { estimateHitterSeasonValue } from "../engine/season/seasonValueReadModel.js";')
          needle='    seasonLine,\n    seasonLinesByLevel,'
          once(p,needle,'    seasonLine,\n    valueEstimate: estimateHitterSeasonValue({ line: seasonLine, leagueLines: stateForLevel(session, detailLevel).playerBatting, position: identity.primaryPosition ?? "DH", level: detailLevel }),\n    seasonLinesByLevel,')

          p='src/ui/seasonRender.js'
          needle='function playerStatsView(player, leaders) {'
          # use standard triple-quoted template to keep JS interpolation literal
          helper="""function estimatedValueCard(value) {
            if (!value) return "";
            const note = "공식 WAR 아님 · 수비 기여·구장 보정 미포함 · 정규시즌 기록 기반";
            if (value.status !== "READY") return `<div class="player-value-wrap"><p class="player-section-label">공격·주루 가치 추정</p><p class="condition-note">표본 축적 중 · ${esc(note)}</p></div>`;
            return `<div class="player-value-wrap"><p class="player-section-label">공격·주루 가치 추정</p><div class="player-rank-grid"><div><span>참고 승수</span><b>${Number(value.partialWins).toFixed(2)}</b><small>${esc(value.level)} · ${value.PA} PA</small></div><div><span>타격 기여</span><b>${Number(value.battingRuns).toFixed(1)} R</b><small>리그 공격 환경 대비</small></div><div><span>주루 기여</span><b>${Number(value.runningRuns).toFixed(1)} R</b><small>도루·도루실패 기반</small></div><div><span>포지션/대체수준</span><b>${Number(value.positionalRuns+value.replacementRuns).toFixed(1)} R</b><small>수비 실적 미포함</small></div></div><p class="condition-note">${esc(note)}. 실제 기용·승격·수상·트레이드 평가에는 사용하지 않습니다.</p></div>`;
          }
          """
          once(p,needle,helper+'\n'+needle)
          needle='    <p class="condition-note">현재 레벨 리그 순위와 레벨별 정규시즌 기록을 분리해 표시합니다. AVG/OBP/SLG/OPS 순위는 규정 타석을 충족한 선수만 집계합니다.</p>'
          once(p,needle,'    ${estimatedValueCard(player.valueEstimate)}\n'+needle)

          p='scripts/verify-v56-postseason-awards-history.mjs'
          needle='import { POSTSEASON_RULESET_2026, POSTSEASON_ROUND_ORDER } from "../src/engine/career/postseasonHistory.js";'
          once(p,needle,needle+'\nimport { auditSeasonHistoryEntry } from "../src/engine/career/seasonHistoryAudit.js";')
          needle='const archive=afterPayload.historyState.seasons[0];'
          once(p,needle,needle+'\nconst audited=auditSeasonHistoryEntry(archive);\nassert.equal(audited.pass,true);\nassert.equal(audited.leaguesAudited,2);\nassert.equal(audited.regularAndPostseasonSeparate,true);')
          print('Phase 6 read-only value and authoritative archive checks patched')
          TCU_PHASE6_PATCH
          node --check src/engine/season/seasonValueReadModel.js
          node --check src/engine/career/seasonHistoryAudit.js
          node --check src/api/seasonApi.js
          node --check src/ui/seasonRender.js
          node --check scripts/verify-v56-postseason-awards-history.mjs
          node --check tests/phase6ValueHistory.test.js
          node --check scripts/verify-phase6-value-history.mjs
          git diff --check
      - name: Run full tests, 2026 awards, retirement and production v3 world gate
