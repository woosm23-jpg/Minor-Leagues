        shell: bash
        run: |
          set -euo pipefail
          npm test
          node scripts/verify-v56-postseason-awards-history.mjs
          node scripts/verify-v58-retirement-hof.mjs
          node scripts/verify-phase3-integration-4r.mjs
          node scripts/verify-phase6-value-history.mjs
