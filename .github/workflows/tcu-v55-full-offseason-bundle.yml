name: THE CALL-UP v55 Full Offseason Bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v55-full-offseason-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v55-full-offseason:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Verify v54 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/reports/v54-trade-system-checkpoint.json)" = "3a36ad38782046474d8272d4b5a41ef6b51b2569"
          test "$(git hash-object work/src/api/seasonApi.js)" = "8ba94ffafcb7fcf6f52211975e37420e3a25ea58"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "65a8998d988a93d37b6227062eaf92ce08ed8255"
          test "$(git hash-object work/src/engine/career/contractMarket.js)" = "9d4a795ceefa53fa3f3392bf0258b65c02a5202d"
          test "$(git hash-object work/src/engine/career/contractState.js)" = "08173dabc00443ce1a2460c53c5b7199dfa93b4e"
          test "$(git hash-object work/src/engine/career/tradeState.js)" = "eb606086578fe1382f6d7170670fdfb53c62c839"
          test "$(git hash-object work/src/engine/career/tradeAI.js)" = "d5a51113ed047dc959574fd19f93fd6b1b9d8c80"
          test "$(git hash-object work/src/services/tradeService.js)" = "7898ea2440c139edbe892365219db80522aa0f36"
          test "$(git hash-object work/src/services/productionSeasonFactory.js)" = "94082049826a17251f29c76ce2ef8281100f886b"
          test "$(git hash-object work/src/services/productionOffseasonEcology.js)" = "f630e8372f0a044d3f90cef669de98bda2861642"
          test "$(git hash-object work/src/ui/seasonRender.js)" = "579070ea058974a69ba487763d8fb3e289191d68"
          test "$(git hash-object work/src/app/seasonApp.js)" = "b4527965080d22002b66c60b47c26cf66b188eb3"

      - name: Install v55 Full Offseason
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/src/engine/career/offseasonPipeline.js
          echo '' | base64 -d > work/scripts/verify-v55-full-offseason.mjs
          echo '' | base64 -d > work/scripts/browser-offseason-v55.py
          echo '' | base64 -d > work/README_KO.md
          echo '' | base64 -d > /tmp/patch-v55.py
          python3 /tmp/patch-v55.py
          node --check work/src/engine/career/offseasonPipeline.js
          node --check work/src/engine/career/contractMarket.js
          node --check work/src/api/seasonApi.js
          node --check work/src/services/seasonSerialization.js
          node --check work/src/ui/seasonRender.js
          node --check work/src/app/seasonApp.js
          node --check work/scripts/verify-v55-full-offseason.mjs
          python3 -m py_compile work/scripts/browser-offseason-v55.py

      - name: v55 cross-contract preflight
        id: preflight
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OFFSEASON_PHASES' work/src/engine/career/offseasonPipeline.js
          grep -q 'offseasonState: session.offseasonState' work/src/services/seasonSerialization.js
          grep -q 'offseasonState: restored.offseasonState' work/src/services/seasonSerialization.js
          grep -q 'full_career_offseason_pipeline_v55' work/src/api/seasonApi.js
          grep -q 'START_OFFSEASON' work/src/ui/seasonRender.js
          grep -q 'OFFSEASON_NEXT' work/src/app/seasonApp.js
          grep -q 'ARBITRATION_SETTLED' work/src/engine/career/contractMarket.js
          echo "v55 cross-contract preflight PASS"

      - name: v55 focused Full Offseason gate
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v55-full-offseason.mjs
          cat reports/v55-full-offseason-gate.json

      - name: Re-run v54 Trade System gate
        id: reg_v54
        continue-on-error: true
        run: cd work && node scripts/verify-v54-trade-system.mjs

      - name: Re-run v54 Trade Rollover gate
        id: reg_v54_rollover
        continue-on-error: true
        run: cd work && node scripts/verify-v54-trade-rollover.mjs

      - name: Re-run v53 Arbitration Free Agency gate
        id: reg_v53
        continue-on-error: true
        run: cd work && node scripts/verify-v53-arbitration-free-agency.mjs

      - name: Re-run v52 Roster Rules gate
        id: reg_v52
        continue-on-error: true
        run: cd work && node scripts/verify-v52-roster-rules.mjs

      - name: Re-run v51 Contract Service gate
        id: reg_v51
        continue-on-error: true
        run: cd work && node scripts/verify-v51-contract-service.mjs

      - name: Re-run current MVP regression
        id: mvp
        continue-on-error: true
        run: cd work && node scripts/verify-v50-1g-current-mvp.mjs --verify --output=reports/v55-current-mvp-regression.json

      - name: Re-run Production runtime
        id: runtime
        continue-on-error: true
        run: cd work && node scripts/verify-v50-2a-production-data-runtime.mjs --verify --output=reports/v55-production-data-runtime-regression.json

      - name: Build v55 Production standalone
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs --output=dist/THE_CALL_UP_SEASON_STANDALONE_v55_PRODUCTION.html --master-snapshot=/tmp/tcu-production-v2.json
          python3 - <<'PY2'
          from pathlib import Path
          p=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v55_PRODUCTION.html")
          s=p.read_text(encoding="utf-8").replace("Season v49","Season v55").replace("Season v54","Season v55")
          p.write_text(s,encoding="utf-8")
          assert p.stat().st_size>1_000_000
          assert "Offseason Pipeline" in s
          assert "full_career_offseason_pipeline_v55" in s
          assert "START_OFFSEASON" in s and "OFFSEASON_NEXT" in s
          PY2

      - name: Install isolated Playwright
        id: playwright
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-v55-browser
          source /tmp/tcu-v55-browser/bin/activate
          python -m pip install --upgrade pip
          pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: v55 mobile offseason browser smoke
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tcu-v55-browser/bin/activate
          cd work
          python scripts/browser-offseason-v55.py
          cat reports/v55-offseason-browser-smoke.json

      - name: v55 checkpoint report
        id: checkpoint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY2'
          import hashlib,json
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text(encoding="utf-8"))
          focused=load("reports/v55-full-offseason-gate.json")
          browser=load("reports/v55-offseason-browser-smoke.json")
          current=load("reports/v55-current-mvp-regression.json")
          runtime=load("reports/v55-production-data-runtime-regression.json")
          assert focused["pass"] and browser["pass"] and current["pass"] and runtime["pass"]
          html=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v55_PRODUCTION.html")
          data=html.read_bytes()
          report={
            "schema":"THE_CALL_UP_V55_FULL_OFFSEASON_CHECKPOINT","pass":True,"version":"v55",
            "features":{
              "orderedPhases":True,"idempotentPhases":True,"midOffseasonSaveRestore":True,
              "serviceContractClassification":True,"arbitrationSettlement":True,"marketWindow":True,
              "organizationalCleanupBridge":True,"developmentAgingBridge":True,"scoutingBridge":True,
              "retirementEcologyBridge":True,"projectedRosters":True,"springTrainingPhase":True,
              "rosterCutsPhase":True,"openingDayAtomicRollover":True,"mobileUi":True,
              "legacyAdvanceToNextSeasonCompatibility":True
            },
            "regression":{"v54TradeSystem":True,"v54TradeRollover":True,"v53ArbitrationFA":True,"v52RosterRules":True,"v51ContractService":True,"v50_1CurrentMvp":True,"v50_2ProductionRuntime":True},
            "standalone":{"filename":html.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()},
            "next":"v56 Postseason / Awards / History"
          }
          Path("reports/v55-full-offseason-checkpoint.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY2

      - name: Aggregate v55 validation outcomes
        id: aggregate
        if: always()
        shell: bash
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          V54: ${{ steps.reg_v54.outcome }}
          V54_ROLLOVER: ${{ steps.reg_v54_rollover.outcome }}
          V53: ${{ steps.reg_v53.outcome }}
          V52: ${{ steps.reg_v52.outcome }}
          V51: ${{ steps.reg_v51.outcome }}
          MVP: ${{ steps.mvp.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          CHECKPOINT: ${{ steps.checkpoint.outcome }}
        run: |
          set -euo pipefail
          printf '%-14s %s\n' \
            PREFLIGHT "$PREFLIGHT" FOCUSED "$FOCUSED" V54 "$V54" V54_ROLLOVER "$V54_ROLLOVER" \
            V53 "$V53" V52 "$V52" V51 "$V51" MVP "$MVP" RUNTIME "$RUNTIME" \
            BUILD "$BUILD" PLAYWRIGHT "$PLAYWRIGHT" BROWSER "$BROWSER" CHECKPOINT "$CHECKPOINT"
          failed=0
          for value in "$PREFLIGHT" "$FOCUSED" "$V54" "$V54_ROLLOVER" "$V53" "$V52" "$V51" "$MVP" "$RUNTIME" "$BUILD" "$PLAYWRIGHT" "$BROWSER" "$CHECKPOINT"; do
            if [ "$value" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more v55 gates failed. See all gate logs above."
            exit 1
          fi
          echo "ALL V55 GATES PASS"

      - name: Commit verified v55
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            work/src/engine/career/offseasonPipeline.js \
            work/src/engine/career/contractMarket.js \
            work/src/api/seasonApi.js \
            work/src/services/seasonSerialization.js \
            work/src/ui/seasonRender.js \
            work/src/app/seasonApp.js \
            work/scripts/verify-v55-full-offseason.mjs \
            work/scripts/browser-offseason-v55.py \
            work/README_KO.md \
            work/reports/v55-full-offseason-gate.json \
            work/reports/v55-offseason-browser-smoke.json \
            work/reports/v55-current-mvp-regression.json \
            work/reports/v55-production-data-runtime-regression.json \
            work/reports/v55-full-offseason-checkpoint.json
          git rm -f .github/workflows/tcu-v55-full-offseason-bundle.yml
          git commit -m "v55: add idempotent full offseason phase pipeline [skip ci]"
          git push origin HEAD:main

      - name: Upload v55 Production checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v55_FULL_OFFSEASON
          path: |
            work/dist/THE_CALL_UP_SEASON_STANDALONE_v55_PRODUCTION.html
            work/reports/v55-full-offseason-gate.json
            work/reports/v55-offseason-browser-smoke.json
            work/reports/v55-full-offseason-checkpoint.json
            work/README_KO.md
          if-no-files-found: ignore
          compression-level: 0
