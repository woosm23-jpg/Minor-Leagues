name: THE CALL-UP Phase 3 4I Short Rotation Name Fix

on:
  push:
    paths:
      - '.github/workflows/tcu-phase3-4i-short-rotation-namefix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  short-postseason-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse verified 4I installer with valid fixture name and run all gates
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          node -e 'const r=JSON.parse(require("node:fs").readFileSync("reports/phase3-postseason-workload-fix-4h-v1.json","utf8"));if(r.pass!==true||r.snapshotHash!=="fnv1a32:f7b34713"||r.saveRestore.workloadPreserved!==true)process.exit(1);console.log("4H prerequisite PASS");'
          mkdir -p scripts reports tests src/engine/career
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re

          source_path = Path('../.github/workflows/tcu-phase3-4i-short-rotation-recovery.yml')
          source_bytes = source_path.read_bytes()
          expected_sha256 = '54cb3932521cc635b99fb42780104f0d6e63bc35ec6395bf9b403245bfe67982'
          assert hashlib.sha256(source_bytes).hexdigest() == expected_sha256, '4I verified installer has changed; abort safely'
          source = source_bytes.decode('utf-8')
          payloads = {
              'APPLY': '/tmp/tcu_phase3_4i_apply.py',
              'POLICY': '/tmp/tcu_phase3_4i_rotation_policy.js',
              'TESTS': '/tmp/tcu_phase3_4i_rotation_tests.js',
              'VERIFY': '/tmp/tcu_phase3_4i_verify.mjs',
          }
          for label, destination in payloads.items():
              marker = f"cat <<'TCU_4I_{label}'"
              assert source.count(marker) == 1, f'Expected exactly one {label} payload'
              part = source.split(marker, 1)[1].split('\n', 1)[1]
              encoded = part.split(f'\n          TCU_4I_{label}', 1)
              assert len(encoded) == 2, f'{label} payload terminator missing'
              data = gzip.decompress(base64.b64decode(''.join(encoded[0].split()), validate=True))
              if label == 'VERIFY':
                  old_name = b'Postseason Short Rotation QA'
                  assert data.count(old_name) == 1, '4I test fixture name has changed'
                  data = data.replace(old_name, b'4I QA', 1)
              Path(destination).write_bytes(data)
              print(f'Loaded {label} payload: {len(data)} bytes')
          PY
          python3 /tmp/tcu_phase3_4i_apply.py
          node --check src/engine/career/postseasonRotationPolicy.js
          node --check src/api/seasonApi.js
          node --check src/services/demoSeasonFactory.js
          node --check scripts/verify-phase3-postseason-rotation-4i.mjs
          node --test tests/postseasonRotation4I.test.js tests/postseasonRoster4H.test.js
          node scripts/verify-phase3-postseason-rotation-4i.mjs
          node -e 'const r=JSON.parse(require("node:fs").readFileSync("reports/phase3-postseason-short-rotation-4i-v1.json","utf8"));if(r.pass!==true||r.wildCard.rotationSize!==3||r.divisionSeries.rotationSize!==4||r.wildCard.gameCount<8||r.divisionSeries.gameCount<8||r.saveRestore.pitcherWorkloadPreserved!==true||r.determinism.sameSeedRound!==true)process.exit(1);console.log("4I actual postseason short rotation gate PASS");'
          node scripts/verify-v56-postseason-awards-history.mjs
          node scripts/verify-phase3-bullpen-recovery-4f.mjs
          git diff --check
      - name: Commit verified 4I gameplay and report only
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git add src/api/seasonApi.js src/services/demoSeasonFactory.js src/engine/career/postseasonRotationPolicy.js tests/postseasonRotation4I.test.js scripts/verify-phase3-postseason-rotation-4i.mjs reports/phase3-postseason-short-rotation-4i-v1.json
          if git diff --cached --quiet; then
            echo '4I short rotation already verified; no additional commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'phase3: enable rested 3-4 starter postseason rotation (4I)'
            git push origin HEAD:main
          fi
