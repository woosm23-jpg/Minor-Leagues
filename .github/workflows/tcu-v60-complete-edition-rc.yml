name: THE CALL-UP v60 Complete Edition RC Bundle

on:
  push:
    paths:
      - '.github/workflows/tcu-v60-complete-edition-rc.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  v60:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify v59 baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/src/api/seasonApi.js)" = "b9ae11065c047f28363bc34ec73649bdf279cd98"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "b0bd644fa0c7b344bc067eb121c5affee1d98c6a"
          test "$(git hash-object work/src/services/productionOffseasonEcology.js)" = "4427e8aaaad49e8d21c681f9b457999aa774e47a"
          test "$(git hash-object work/src/engine/career/rosterControlState.js)" = "c1c15cbf09af4f1571826fa7d83497c247ce3267"
          test "$(git hash-object work/src/engine/season/schedule.js)" = "37b66c64ca3d6bb2017d4a7c796dda45a3252c3a"
          test "$(git hash-object work/reports/v59-long-run-stress-checkpoint.json)" = "7782f038c455c0e445990c9db32c97719827a45e"
          grep -q '"pass": true' work/reports/v59-long-run-stress-checkpoint.json
          grep -q '"completedSeasons": 20' work/reports/v59-long-run-stress-checkpoint.json
          grep -q '"openingDayYear": 2046' work/reports/v59-long-run-stress-checkpoint.json
          grep -q 'full_career_long_run_stress_v59' work/src/api/seasonApi.js
          grep -q 'full_career_long_run_stress_v59' work/src/services/seasonSerialization.js

      - name: Apply v60 RC harness and release labels
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/v60-patch.py
          python3 /tmp/v60-patch.py
          printf '%s' '' | base64 -d > work/scripts/verify-v60-complete-edition-rc.mjs
          printf '%s' '' | base64 -d > work/scripts/browser-v60-complete-edition-rc.py
          node --check work/scripts/verify-v60-complete-edition-rc.mjs
          python3 -m py_compile work/scripts/browser-v60-complete-edition-rc.py
          node --check work/src/api/seasonApi.js
          node --check work/src/services/seasonSerialization.js
          node --check work/scripts/build-standalone.mjs
          grep -q 'complete_edition_rc_v60' work/src/api/seasonApi.js
          grep -q 'complete_edition_rc_v60' work/src/services/seasonSerialization.js
          grep -q 'Complete Edition RC v60' work/scripts/build-standalone.mjs

      - name: v60 Production data and ratings gates
        id: ratings
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/validate-master-snapshot-v2.mjs --input=/tmp/tcu-production-v2.json
          node scripts/audit-current-ability-phase-c.mjs
          cp reports/v50-phase-c-fix4-current-ability-audit.json reports/v60-current-ability-audit.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v60-current-ability-audit.json','utf8'));
          if((r.finiteErrors?.phaseC?.length??1)!==0) throw new Error('Phase C finite rating errors');
          if(!r.trackingRows || !r.pitchArsenalRows) throw new Error('Phase C tracking/arsenal coverage missing');
          if(Number(r.arsenalGate?.usageBad??1)!==0) throw new Error('Phase C arsenal usage gate');
          if(Number(r.arsenalGate?.stuffMissing??1)!==0) throw new Error('Phase C stuff gate');
          if(Number(r.arsenalGate?.arsenalMissing??999)!==20) throw new Error('Phase C arsenal missing drifted from validated baseline');
          console.log('v60 Phase C current ability gate PASS');
          NODE
          node scripts/audit-real-potential-phase-d.mjs --verify --output=reports/v60-potential-audit.json
          node scripts/audit-phase-e-preflight.mjs --verify --output=reports/v60-ratings-preflight.json
          node scripts/audit-phase-e-distribution-backtest.mjs --verify --output=reports/v60-distribution-backtest.json

      - name: v60 core simulation sanity
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-fast-sim-v38.js --verify --output reports/v60-fast-sim.json
          test -s reports/v60-fast-sim.json

      - name: v60 persistence regression
        id: saves
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-season-save-checkpoint-v15.js --verify --output=reports/v60-save-transfer-regression.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/v60-save-transfer-regression.json','utf8'));
          if(r.pass!==true) throw new Error('Production save/transfer gate did not pass');
          if(r.checkpoint?.deterministicContinuation!==true || r.checkpoint?.fullValidation!==true || r.checkpoint?.fiveLevelProduction!==true) throw new Error('Production checkpoint invariants missing');
          if(r.transfer?.checksumPass!==true || r.transfer?.importAsCopy!==true || r.transfer?.provenancePass!==true || r.transfer?.corruptRejected!==true || r.transfer?.sourceUntouched!==true) throw new Error('Production transfer invariants missing');
          console.log('v60 Production persistence gate PASS');
          NODE

      - name: v60 career systems regression A
        id: careerA
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v50-1g-current-mvp.mjs
          node scripts/verify-v51-contract-service.mjs
          node scripts/verify-v51-contract-rollover.mjs
          node scripts/verify-v52-roster-rules.mjs
          node scripts/verify-v52-roster-rollover.mjs
          node scripts/verify-v53-arbitration-free-agency.mjs
          node scripts/verify-v53-contract-market-rollover.mjs

      - name: v60 career systems regression B
        id: careerB
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v54-trade-system.mjs
          node scripts/verify-v54-trade-rollover.mjs
          node scripts/verify-v55-full-offseason.mjs
          node scripts/verify-v55-1-performance.mjs
          node scripts/verify-v56-postseason-awards-history.mjs
          node scripts/verify-v57-draft-international.mjs
          node scripts/verify-v58-retirement-hof.mjs

      - name: v60 Production lifecycle and FULL save round-trip
        id: lifecycle
        if: steps.ratings.outcome == 'success' && steps.unit.outcome == 'success' && steps.saves.outcome == 'success' && steps.careerA.outcome == 'success' && steps.careerB.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v60-complete-edition-rc.mjs
          cat reports/v60-complete-edition-rc-gate.json

      - name: Build v60 Complete Edition RC HTML
        id: build
        if: steps.lifecycle.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs --output=dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html --master-snapshot=/tmp/tcu-production-v2.json
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html')
          s=p.read_text(encoding='utf-8')
          assert p.stat().st_size > 1_000_000
          for needle in ['complete_edition_rc_v60','Complete Edition RC v60','Hall of Fame','ANNOUNCE_FINAL_SEASON','SIM_7_DAYS','SIM_IMPORTANT']:
              assert needle in s, needle
          print(p.stat().st_size)
          PY2

      - name: Install isolated Playwright
        id: playwright
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-v60-browser
          source /tmp/tcu-v60-browser/bin/activate
          python -m pip install --upgrade pip
          pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: v60 portrait mobile browser gate
        id: browser
        if: steps.playwright.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tcu-v60-browser/bin/activate
          cd work
          python scripts/browser-v60-complete-edition-rc.py
          cat reports/v60-complete-edition-rc-browser.json

      - name: v60 RC checkpoint
        id: checkpoint
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY2'
          import hashlib,json
          from pathlib import Path
          lifecycle=json.loads(Path('reports/v60-complete-edition-rc-gate.json').read_text())
          browser=json.loads(Path('reports/v60-complete-edition-rc-browser.json').read_text())
          v59=json.loads(Path('reports/v59-long-run-stress-checkpoint.json').read_text())
          potential=json.loads(Path('reports/v60-potential-audit.json').read_text())
          preflight=json.loads(Path('reports/v60-ratings-preflight.json').read_text())
          backtest=json.loads(Path('reports/v60-distribution-backtest.json').read_text())
          assert lifecycle['pass'] and browser['pass'] and v59['pass'] and potential['pass'] and preflight['pass'] and backtest['pass']
          html=Path('dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html'); data=html.read_bytes()
          report={
            'schema':'THE_CALL_UP_V60_COMPLETE_EDITION_RC_CHECKPOINT','pass':True,
            'baselineCommit':'ae6f181140a4fcf82f53d4ffe7d5a77c8cb61abb',
            'gameVersion':'complete_edition_rc_v60',
            'inheritedV59':{'completedSeasons':v59['stress']['completedSeasons'],'simulatedWorldGames':v59['stress']['simulatedWorldGames'],'openingDayYear':v59['stress']['openingDayYear'],'allInvariants':all(v59['stress']['invariants'].values())},
            'productionData':lifecycle['production'],
            'ratings':{'potential':potential['pass'],'preflight':preflight['pass'],'distributionBacktest':backtest['pass']},
            'persistence':{'lifecycleStages':[x['stage'] for x in lifecycle['lifecycle']['stages']],'fullRoundTrip':True},
            'browser':{'viewports':[x['viewport'] for x in browser['results']],'pass':browser['pass']},
            'standalone':{'filename':html.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()},
            'releaseStatus':'RELEASE_CANDIDATE',
            'next':'v60 final release gate / THE_CALL_UP_COMPLETE_EDITION.html'
          }
          Path('reports/v60-complete-edition-rc-checkpoint.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY2

      - name: Aggregate v60 RC outcomes
        id: aggregate
        if: always()
        shell: bash
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          RATINGS: ${{ steps.ratings.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          SAVES: ${{ steps.saves.outcome }}
          CAREER_A: ${{ steps.careerA.outcome }}
          CAREER_B: ${{ steps.careerB.outcome }}
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          CHECKPOINT: ${{ steps.checkpoint.outcome }}
        run: |
          set -euo pipefail
          printf '%s\n' "BASELINE=$BASELINE" "PATCH=$PATCH" "RATINGS=$RATINGS" "UNIT=$UNIT" "SAVES=$SAVES" "CAREER_A=$CAREER_A" "CAREER_B=$CAREER_B" "LIFECYCLE=$LIFECYCLE" "BUILD=$BUILD" "PLAYWRIGHT=$PLAYWRIGHT" "BROWSER=$BROWSER" "CHECKPOINT=$CHECKPOINT"
          for value in "$BASELINE" "$PATCH" "$RATINGS" "$UNIT" "$SAVES" "$CAREER_A" "$CAREER_B" "$LIFECYCLE" "$BUILD" "$PLAYWRIGHT" "$BROWSER" "$CHECKPOINT"; do
            test "$value" = success
          done

      - name: Commit verified v60 RC
        if: steps.aggregate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tcu-v60-complete-edition-rc.yml
          git add -A
          git status --short
          git commit -m 'v60: complete edition release candidate [skip ci]'
          git push origin HEAD:main

      - name: Upload v60 RC artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v60_COMPLETE_EDITION_RC
          if-no-files-found: warn
          retention-days: 90
          path: |
            work/reports/v60-complete-edition-rc-gate.json
            work/reports/v60-complete-edition-rc-browser.json
            work/reports/v60-complete-edition-rc-checkpoint.json
            work/reports/v60-current-ability-audit.json
            work/reports/v60-potential-audit.json
            work/reports/v60-ratings-preflight.json
            work/reports/v60-distribution-backtest.json
            work/reports/v60-save-checkpoint.json
            work/reports/v60-export-import.json
            work/reports/v60-rotating-backups.json
            work/reports/v60-save-select.json
            work/reports/v59-long-run-stress-checkpoint.json
            work/dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html
