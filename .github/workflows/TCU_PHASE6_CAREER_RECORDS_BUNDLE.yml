          from pathlib import Path
          
          def once(path, needle, replacement):
              target = Path(path)
              body = target.read_text(encoding="utf-8")
              occurrences = body.count(needle)
              if occurrences != 1:
                  raise RuntimeError(f"Patch refused: {path}: anchor count {occurrences}, expected 1: {needle[:90]}")
              target.write_text(body.replace(needle, replacement, 1), encoding="utf-8")
          
          p = 'src/engine/career/retirementHallOfFame.js'
          once(p, 'import { SeededRng } from "../rng.js";',
                  'import { SeededRng } from "../rng.js";\nimport { getCareerRecordsPublicView } from "./careerRecords.js";')
          once(p, 'latestEraBallot:era?clone(era):null}); }',
                  'latestEraBallot:era?clone(era):null,careerRecords:getCareerRecordsPublicView(state)}); }')
          
          p = 'src/ui/seasonRender.js'
          helper = '''function careerRecordsView(snapshot) {
            const records = snapshot.retirementHall?.careerRecords ?? null;
            if (!records?.includedSeasons?.length) return `<section class="card player-detail-card history-card"><div class="section-head"><strong>MLB 커리어 누적 기록</strong><span>아직 기록 없음</span></div><p class="condition-note">이 세이브에서 시뮬레이션한 MLB 시즌이 확정되면 기록이 나타납니다.</p></section>`;
            const categories = [["H", "안타"], ["HR", "홈런"], ["RBI", "타점"], ["SB", "도루"], ["SO", "투수 탈삼진"], ["IP", "투구 이닝"]];
            return `<section class="card player-detail-card history-card">
              <div class="section-head"><strong>MLB 커리어 누적 기록</strong><span>${records.startYear ?? records.includedSeasons[0]}~${records.throughYear}</span></div>
              <p class="condition-note">이 세이브에서 시뮬레이션한 MLB 기록만 집계합니다. 시작 이전 실존 선수의 과거 기록은 포함하지 않으며 공식 MLB 역대 기록이 아닙니다. 선수의 이적 전후 기록은 한 선수의 누적으로 계산합니다. 이닝 표기는 ⅓·⅔를 .1·.2로 표시합니다.</p>
              ${categories.map(([key, label]) => {
                const category = records.categories?.[key];
                if (!category) return "";
                return `<div class="player-section-label"><strong>${label}</strong><small>${category.userRank == null ? "" : `내 순위 #${category.userRank}`}</small></div>
                  ${category.leaders.length ? `<div class="career-timeline-list">${category.leaders.map(row => `<div class="career-timeline-row"><span>#${row.rank}</span><div><strong>${esc(row.name)}</strong><small>${esc(row.display)} · ${row.mlbSeasons} MLB 시즌</small></div></div>`).join("")}</div>` : `<p class="season-empty">기록 없음</p>`}`;
              }).join("")}
            </section>`;
          }
          
          '''
          once(p, 'function historyView(snapshot) {', helper + 'function historyView(snapshot) {')
          needle = '  <section class="card player-detail-card history-card"><div class="section-head"><strong>Hall of Fame</strong>'
          once(p, needle, '  ${careerRecordsView(snapshot)}\n' + needle)
          print('Phase 6 career records, immutable cached read model and history UI patched')
          TCU_PHASE6_RECORD_PATCH
          node --check src/engine/career/careerRecords.js
          node --check src/engine/career/retirementHallOfFame.js
          node --check src/ui/seasonRender.js
          node --check tests/phase6CareerRecords.test.js
          node --check scripts/verify-phase6-career-records.mjs
          git diff --check
      - name: Run all unit tests and record UI tests
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          npm test
          git diff --check
      - name: Verify full 2026 season records and 2027 opening-day save replay
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-phase6-career-records.mjs
          node scripts/verify-phase3-integration-4r.mjs
          node --input-type=module <<'TCU_PHASE6_RECORD_GATE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=name=>JSON.parse(readFileSync(`reports/${name}`,'utf8'));
          const r=read('phase6-career-records-bundle.json');
          const world=read('phase3-integrated-regression-4r-v1.json');
          assert.equal(r.pass,true);
          assert.equal(r.worldGames2026,10710);
          assert.equal(r.saveRestoreStable,true);
          assert.equal(r.openingDay2027NoDuplicate,true);
          assert.equal(world.pass,true);
          assert.equal(world.regularSeason.worldGames,10710);
          assert.ok(world.postseason.championTeamId);
          assert.ok(Object.values(world.gates).every(Boolean));
          console.log('Phase 6 career records + production v3 world/postseason PASS');
          TCU_PHASE6_RECORD_GATE
          git diff --check
      - name: Commit only after all career-record and world gates pass
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git add src/engine/career/careerRecords.js src/engine/career/retirementHallOfFame.js src/ui/seasonRender.js tests/phase6CareerRecords.test.js scripts/verify-phase6-career-records.mjs reports/phase6-career-records-bundle.json reports/phase3-integrated-regression-4r-v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No verified Phase 6 changes; refusing empty commit.' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'phase6: verified MLB career record leaderboards and immutable history read model'
          git push origin HEAD:main
