name: THE CALL-UP v50 Rollover Fix Gate v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v50-rollover-fix.yml"

permissions:
  contents: write

jobs:
  rollover-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/src/api/seasonApi.js)" = "68b0dff23e945bb9c7a34695ebd74c58550024bb"
          test "$(git hash-object work/src/engine/game/pitcherFatigue.js)" = "aaa3bc6603458f3108d8d5ab90c412e6f7f1611e"
          test "$(git hash-object work/src/engine/game/pitcherUsageAI.js)" = "06d5fb30dc5ef390a60c6d49c4b2a9d937b5819f"
          test "$(git hash-object work/src/engine/player/playerContextResolver.js)" = "e62b493b921e0198ed424cad993d78c349fd3576"
          test -f work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz

      - name: Apply pitcher and chronological rollover fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          # 1) SWING pitcher role normalization.
          path = Path('work/src/engine/game/pitcherFatigue.js')
          s = path.read_text()
          anchor = '''function getPitcherCapacityPitches(stamina, role, config = pitchingCalibration) {\n  assertRole(role);\n  const z = ratingToLatent(stamina);\n  const reliever = role !== "SP";'''
          replacement = '''function resolvePitcherUsageRole(role, { startedGame = false } = {}) {\n  if (role === "SWING") return startedGame ? "SP" : "RP";\n  assertRole(role);\n  return role;\n}\n\nfunction getPitcherCapacityPitches(stamina, role, config = pitchingCalibration) {\n  const resolvedRole = resolvePitcherUsageRole(role);\n  const z = ratingToLatent(stamina);\n  const reliever = resolvedRole !== "SP";'''
          s = replace_once(s, anchor, replacement, 'pitcher capacity role')
          s = replace_once(s,
              'function calculatePitcherFatigue({ pitchCount, stamina = 50, role = "SP" }, config = pitchingCalibration) {\n  if (!Number.isFinite(pitchCount) || pitchCount < 0) throw new RangeError("pitchCount는 0 이상의 유한한 값이어야 합니다.");\n  const capacity = getPitcherCapacityPitches(stamina, role, config);',
              'function calculatePitcherFatigue({ pitchCount, stamina = 50, role = "SP", startedGame = false }, config = pitchingCalibration) {\n  if (!Number.isFinite(pitchCount) || pitchCount < 0) throw new RangeError("pitchCount는 0 이상의 유한한 값이어야 합니다.");\n  const resolvedRole = resolvePitcherUsageRole(role, { startedGame });\n  const capacity = getPitcherCapacityPitches(stamina, resolvedRole, config);',
              'fatigue role')
          s = replace_once(s,
              '  role = "SP",\n  pitchCount = 0\n}, config = pitchingCalibration) {\n  for (const [name, value] of Object.entries({ control, command, movement, stuff, stamina })) ratingToLatent(value, name);\n  assertRole(role);\n  const fatigue = calculatePitcherFatigue({ pitchCount, stamina, role }, config);\n  const factor = fatigue / 100;\n  const reliever = role !== "SP";',
              '  role = "SP",\n  pitchCount = 0,\n  startedGame = false\n}, config = pitchingCalibration) {\n  for (const [name, value] of Object.entries({ control, command, movement, stuff, stamina })) ratingToLatent(value, name);\n  const resolvedRole = resolvePitcherUsageRole(role, { startedGame });\n  const fatigue = calculatePitcherFatigue({ pitchCount, stamina, role: resolvedRole }, config);\n  const factor = fatigue / 100;\n  const reliever = resolvedRole !== "SP";',
              'effective pitcher role')
          s = replace_once(s,
              'export { getPitcherCapacityPitches, calculatePitcherFatigue, getEffectivePitcherRatings };',
              'export { resolvePitcherUsageRole, getPitcherCapacityPitches, calculatePitcherFatigue, getEffectivePitcherRatings };',
              'fatigue export')
          path.write_text(s)

          # 2) Usage AI: a SWING arm uses starter limits only when he actually started this game.
          path = Path('work/src/engine/game/pitcherUsageAI.js')
          s = path.read_text()
          s = replace_once(s,
              'import { calculatePitcherFatigue } from "./pitcherFatigue.js";',
              'import { calculatePitcherFatigue, resolvePitcherUsageRole } from "./pitcherFatigue.js";',
              'usage import')
          s = replace_once(s,
              'function getSoftLimit(player, config) {\n  const role = player.pitching?.role ?? "SP";',
              'function getSoftLimit(player, config, { startedGame = false } = {}) {\n  const role = resolvePitcherUsageRole(player.pitching?.role ?? "SP", { startedGame });',
              'soft limit role')
          s = replace_once(s,
              'function shouldHook({ state, player, usage, config }) {\n  if (!usage) return false;\n  const role = player.pitching?.role ?? "SP";\n  const stamina = player.pitching?.stamina ?? 50;\n  const fatigue = calculatePitcherFatigue({ pitchCount: usage.pitchCount, stamina, role }, config);\n  const limit = getSoftLimit(player, config);',
              'function shouldHook({ state, player, usage, config, startedGame = false }) {\n  if (!usage) return false;\n  const role = resolvePitcherUsageRole(player.pitching?.role ?? "SP", { startedGame });\n  const stamina = player.pitching?.stamina ?? 50;\n  const fatigue = calculatePitcherFatigue({ pitchCount: usage.pitchCount, stamina, role, startedGame }, config);\n  const limit = getSoftLimit(player, config, { startedGame });',
              'hook role')
          s = replace_once(s,
              '    const usage = state.pitcherUsage[fieldingTeam][currentId];\n    if (!shouldHook({ state, player, usage, config })) return null;',
              '    const teamUsage = state.pitcherUsage[fieldingTeam] ?? {};\n    const usage = teamUsage[currentId];\n    const startedGame = Object.keys(teamUsage)[0] === currentId;\n    if (!shouldHook({ state, player, usage, config, startedGame })) return null;',
              'usage starter detection')
          path.write_text(s)

          # 3) Switch-pitcher hand resolution + SWING role in PA resolver.
          path = Path('work/src/engine/player/playerContextResolver.js')
          s = path.read_text()
          s = replace_once(s,
              'import { getEffectivePitcherRatings } from "../game/pitcherFatigue.js";',
              'import { getEffectivePitcherRatings, resolvePitcherUsageRole } from "../game/pitcherFatigue.js";',
              'resolver import')
          insert_anchor = 'function getPitcherRunningGameProfile(player) {'
          helper = '''function resolvePitcherThrowHand(throws, batterBats = "R") {\n  if (throws === "R" || throws === "L") return throws;\n  if (throws === "S") {\n    if (batterBats === "L" || batterBats === "R") return batterBats;\n    return "R";\n  }\n  throw new RangeError(`pitcher throws는 R/L/S 중 하나여야 합니다: ${throws}`);\n}\n\n'''
          if 'function resolvePitcherThrowHand' not in s:
              s = replace_once(s, insert_anchor, helper + insert_anchor, 'switch pitcher helper')
          s = replace_once(s,
              '    throws: player.throws,\n    holdRunner: pitching.holdRunner ?? 50',
              '    throws: resolvePitcherThrowHand(player.throws),\n    holdRunner: pitching.holdRunner ?? 50',
              'running-game throw hand')
          s = replace_once(s,
              'function getPitcherPAProfile(player, getPitcherStuff = getCachedDerivedStuff, gameUsage = null) {',
              'function getPitcherPAProfile(player, getPitcherStuff = getCachedDerivedStuff, gameUsage = null, { startedGame = false } = {}) {',
              'PA profile signature')
          s = replace_once(s,
              '    role: pitching.role ?? "SP"',
              '    role: resolvePitcherUsageRole(pitching.role ?? "SP", { startedGame })',
              'PA profile role')
          s = replace_once(s,
              '    const gameUsage = state.pitcherUsage?.[fieldingTeam]?.[pitcherId] ?? null;\n    const explicitDefense = resolveDefense ? resolveDefense(args) : null;',
              '    const teamUsage = state.pitcherUsage?.[fieldingTeam] ?? {};\n    const gameUsage = teamUsage[pitcherId] ?? null;\n    const startedGame = Object.keys(teamUsage)[0] === pitcherId;\n    const explicitDefense = resolveDefense ? resolveDefense(args) : null;',
              'PA starter detection')
          s = replace_once(s,
              '    const pitcherProfile = getPitcherPAProfile(pitcher, getPitcherStuff, gameUsage);\n    const selectedPitchVelocityMph = resolvePitchVelocity({ ...args, pitcherProfile });',
              '    const rawPitcherProfile = getPitcherPAProfile(pitcher, getPitcherStuff, gameUsage, { startedGame });\n    const pitcherProfile = Object.freeze({ ...rawPitcherProfile, throws: resolvePitcherThrowHand(rawPitcherProfile.throws, batter.bats) });\n    const selectedPitchVelocityMph = resolvePitchVelocity({ ...args, pitcherProfile });',
              'PA hand resolution')
          s = replace_once(s,
              'export { getHitterPAProfile, getFielderDefenseProfile, buildGameDefensePackage, getRunnerProfile, getPitcherRunningGameProfile, getCatcherRunningGameProfile, createRunnerProfileResolver, getCachedDerivedStuff, getPitcherPAProfile, createPlayerContextResolver };',
              'export { getHitterPAProfile, getFielderDefenseProfile, buildGameDefensePackage, getRunnerProfile, resolvePitcherThrowHand, getPitcherRunningGameProfile, getCatcherRunningGameProfile, createRunnerProfileResolver, getCachedDerivedStuff, getPitcherPAProfile, createPlayerContextResolver };',
              'resolver export')
          path.write_text(s)

          # 4) Full-season simulation must process the whole five-level world chronologically.
          path = Path('work/src/api/seasonApi.js')
          s = path.read_text()
          pattern = re.compile(r'  simulateToSeasonEnd\(seasonId\) \{.*?\n  \},\n  advanceToNextSeason\(seasonId\)', re.S)
          replacement = '''  simulateToSeasonEnd(seasonId) {\n    const session = assertSession(seasonId);\n    if (session.activeGameId) {\n      const level = session.activeLevel ?? currentUserLevel(session);\n      const activeSchedule = session.activeScheduleGameId ? scheduleGameById(session, session.activeScheduleGameId, level) : null;\n      if (activeSchedule && activeSchedule.status !== "FINAL") {\n        const finalGame = gameApi.simulateToFinal(session.activeGameId, { approach: "BALANCED" });\n        finalizeInteractiveGameIfNeeded(session, finalGame);\n      }\n      clearActiveGame(session);\n    }\n    while (!worldComplete(session)) {\n      const pending = SIMULATED_LEVELS.flatMap((itemLevel) => {\n        const state = stateForLevel(session, itemLevel);\n        if (!state) return [];\n        return state.schedule\n          .filter((row) => row.status !== "FINAL")\n          .map((row) => ({ level: itemLevel, date: row.date, gameId: row.gameId }));\n      }).sort((a, b) => a.date.localeCompare(b.date) || a.level.localeCompare(b.level) || a.gameId.localeCompare(b.gameId));\n      if (pending.length === 0) break;\n      const date = pending[0].date;\n      const before = pending.length;\n      recoverAllPlayersToDate(session, date);\n      simulateWorldDate(session, date);\n      runOrganizationReviewIfDue(session, date);\n      const after = SIMULATED_LEVELS.reduce((sum, itemLevel) => {\n        const state = stateForLevel(session, itemLevel);\n        return sum + (state ? state.schedule.filter((row) => row.status !== "FINAL").length : 0);\n      }, 0);\n      if (after >= before) {\n        throw new RangeError(`멀티레벨 시즌 시뮬레이션이 진행되지 않았습니다: ${date} (${before} -> ${after})`);\n      }\n    }\n    applySeasonEndAgingIfNeeded(session);\n    return snapshot(session);\n  },\n  advanceToNextSeason(seasonId)'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('missing patch anchor: simulateToSeasonEnd')
          path.write_text(s2)
          PY

          node --check work/src/api/seasonApi.js
          node --check work/src/engine/game/pitcherFatigue.js
          node --check work/src/engine/game/pitcherUsageAI.js
          node --check work/src/engine/player/playerContextResolver.js

      - name: Focused regression
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { resolvePitcherUsageRole } from './src/engine/game/pitcherFatigue.js';
          import { resolvePitcherThrowHand } from './src/engine/player/playerContextResolver.js';
          assert.equal(resolvePitcherUsageRole('SWING', { startedGame: true }), 'SP');
          assert.equal(resolvePitcherUsageRole('SWING', { startedGame: false }), 'RP');
          assert.equal(resolvePitcherThrowHand('S', 'L'), 'L');
          assert.equal(resolvePitcherThrowHand('S', 'R'), 'R');
          assert.equal(resolvePitcherThrowHand('S', 'S'), 'R');
          console.log('focused regression PASS');
          NODE

      - name: Build rollover verifier
        shell: bash
        run: |
          cat > work/scripts/verify-production-season-rollover-v50.mjs <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          import assert from 'node:assert/strict';
          import { seasonApi } from '../src/api/seasonApi.js';

          const LEVELS = ['MLB', 'AAA', 'AA', 'HIGH_A', 'A'];
          const SNAPSHOT_PATH = 'data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz';
          const REPORT_PATH = 'reports/v50-production-season-rollover.json';
          const snapshot = JSON.parse(zlib.gunzipSync(fs.readFileSync(SNAPSHOT_PATH)).toString('utf8'));
          const catalog = seasonApi.getCareerCreationCatalog({ masterSnapshot: snapshot });
          assert.equal(catalog.organizations.length, 30);

          const input = {
            name: 'Rollover QA', nationality: '대한민국', hometown: '구미', age: 18,
            heightCm: 180, weightKg: 78, bodyType: 'ATHLETIC', bats: 'R', throws: 'R',
            primaryPosition: 'SS', archetype: 'HIT_FIRST', visibleTraits: ['QUICK_BAT', 'SOFT_HANDS'],
            organizationMode: 'FAVORITE', favoriteOrganizationId: String(catalog.organizations[0].id)
          };

          function levelRosterCounts(fixture) {
            return Object.fromEntries(LEVELS.map((level) => [
              level,
              Object.values(fixture.levelLeagues[level].rosters)
                .reduce((sum, roster) => sum + Object.keys(roster.players).length, 0)
            ]));
          }

          const startedAt = Date.now();
          const created = seasonApi.createCareerSeason({ seed: 'v50-production-rollover-ci-v2', input, masterSnapshot: snapshot });
          const before = seasonApi.serializeSeason(created.seasonId);
          assert.equal(before.fixture.worldMode, 'PRODUCTION_REAL');
          assert.equal(before.fixture.startDate, '2026-03-25');
          const initialCounts = levelRosterCounts(before.fixture);

          const completed = seasonApi.simulateToSeasonEnd(created.seasonId);
          assert.equal(completed.status, 'COMPLETE');
          assert.equal(completed.seasonYear, 2026);
          assert.equal(completed.progress.worldLeagueGamesCompleted, completed.progress.worldLeagueGamesTotal);
          for (const level of LEVELS) {
            assert.equal(completed.userStatsByLevel[level].leagueGamesCompleted, completed.userStatsByLevel[level].leagueGamesTotal, `${level} incomplete`);
          }

          const next = seasonApi.advanceToNextSeason(created.seasonId);
          assert.equal(next.seasonYear, 2027);
          assert.equal(next.status, 'REGULAR_SEASON');
          assert.equal(next.startDate, '2027-03-25');
          assert.equal(next.progress.worldLeagueGamesCompleted, 0);
          assert.ok(next.progress.worldLeagueGamesTotal > 0);
          assert.equal(next.leagueEcology?.year, 2027);
          assert.ok(next.leagueEcology?.lastOffseason);
          assert.equal(next.leagueEcology.lastOffseason.retired, next.leagueEcology.lastOffseason.generated);

          const after = seasonApi.serializeSeason(created.seasonId);
          assert.deepEqual(levelRosterCounts(after.fixture), initialCounts);
          assert.ok(after.fixture.organization.levels[after.fixture.organization.userLevel].roster.players[after.fixture.userPlayerId]);

          const saved = seasonApi.serializeSeason(created.seasonId);
          const restored = seasonApi.restoreSeason(structuredClone(saved));
          assert.equal(restored.seasonYear, 2027);
          assert.equal(restored.status, 'REGULAR_SEASON');
          const restoredPayload = seasonApi.serializeSeason(restored.seasonId);
          assert.deepEqual(levelRosterCounts(restoredPayload.fixture), initialCounts);
          assert.deepEqual(restoredPayload.leagueEcologyState, saved.leagueEcologyState);

          const report = {
            schema: 'THE_CALL_UP_PRODUCTION_SEASON_ROLLOVER_V50_V2',
            pass: true,
            durationSeconds: Math.round((Date.now() - startedAt) / 100) / 10,
            completedSeason: {
              year: completed.seasonYear,
              worldGamesCompleted: completed.progress.worldLeagueGamesCompleted,
              worldGamesTotal: completed.progress.worldLeagueGamesTotal
            },
            nextSeason: {
              year: next.seasonYear,
              startDate: next.startDate,
              worldGamesCompleted: next.progress.worldLeagueGamesCompleted,
              worldGamesTotal: next.progress.worldLeagueGamesTotal
            },
            ecology: {
              retired: next.leagueEcology.lastOffseason.retired,
              generated: next.leagueEcology.lastOffseason.generated,
              totalRetired: next.leagueEcology.totalRetired,
              totalGenerated: next.leagueEcology.totalGenerated
            },
            levelRosterCounts: initialCounts,
            saveRoundTrip: true
          };
          fs.writeFileSync(REPORT_PATH, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE
          node --check work/scripts/verify-production-season-rollover-v50.mjs

      - name: Production 2026 to 2027 rollover gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-production-season-rollover-v50.mjs

      - name: Commit verified fixes
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/src/api/seasonApi.js \
                  work/src/engine/game/pitcherFatigue.js \
                  work/src/engine/game/pitcherUsageAI.js \
                  work/src/engine/player/playerContextResolver.js \
                  work/scripts/verify-production-season-rollover-v50.mjs \
                  work/reports/v50-production-season-rollover.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix v50 Production chronological season rollover [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: the-call-up-v50-production-rollover-v2
          path: work/reports/v50-production-season-rollover.json
          if-no-files-found: ignore
