name: THE CALL-UP v50.1b Promotion Fix Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v50-1b-promotion-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promotion-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v50.1b baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/scripts/verify-season-promotion-ai-v22.js)" = "b65ecc6b49386987e41e61878d4d19b0358a91f6"
          test "$(git hash-object work/src/engine/season/promotionAI.js)" = "a2240daf96aeebdc39eb6b2128d6c303c4f44f30"
          test "$(git hash-object work/src/services/organizationRosterService.js)" = "851910bba811237b7f3d73efca75c484cca38e06"
          test "$(git hash-object work/src/config/organizationCalibration.js)" = "45cd7ea02982f1415d9f9bada6030df88a1ebc4f"
          test "$(git hash-object work/src/api/seasonApi.js)" = "8959cab706eeb3e7027c6078e1782cf7e569d2de"
          test -f work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz

      - name: Install corrected promotion verifier
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/scripts/verify-season-promotion-ai-v22.js
          node --check work/scripts/verify-season-promotion-ai-v22.js

      - name: Focused current Production promotion gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-season-promotion-ai-v22.js --verify --output=reports/v50-1b-promotion-gate.json
          cat reports/v50-1b-promotion-gate.json

      - name: Commit verified v50.1b
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/scripts/verify-season-promotion-ai-v22.js work/reports/v50-1b-promotion-gate.json
          git rm -f .github/workflows/tcu-v50-1b-promotion.yml .github/workflows/tcu-v50-1b-promotion-fix.yml
          git commit -m "v50.1b: modernize current promotion gate [skip ci]"
          git push origin HEAD:main

      - name: Upload v50.1b report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: the-call-up-v50-1b-promotion-fixed
          path: work/reports/v50-1b-promotion-gate.json
          if-no-files-found: ignore
