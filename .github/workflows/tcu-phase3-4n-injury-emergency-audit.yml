name: THE CALL-UP Phase 3 4N Injury and Emergency Audit

on:
  push:
    paths:
      - '.github/workflows/tcu-phase3-4n-injury-emergency-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  injury-emergency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify prior production and postseason baselines
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs");for(const path of ["reports/phase3-development-promotion-audit-4m-v1.json","reports/phase3-full-postseason-rotation-gate-4l-v1.json"]){const x=JSON.parse(fs.readFileSync(path,"utf8"));if(x.pass!==true||x.snapshotHash!=="fnv1a32:f7b34713")process.exit(1);}console.log("4M and 4L baseline PASS");'
          node --test tests/postseasonRotation4I.test.js tests/postseasonRoster4H.test.js
