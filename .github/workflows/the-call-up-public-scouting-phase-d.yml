name: THE CALL-UP Public Scouting Phase D

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'fetch_the_call_up_public_scouting_phase_d.py'
      - '.github/workflows/the-call-up-public-scouting-phase-d.yml'

concurrency:
  group: the-call-up-public-scouting-phase-d
  cancel-in-progress: false

permissions:
  contents: write

env:
  SEASON: '2026'
  TCU_BASE_SNAPSHOT_GZ: data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz
  TCU_PHASE_D_OUT: data/the_call_up_phase_d

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.14.3

      - name: Offline self-test
        run: python fetch_the_call_up_public_scouting_phase_d.py --self-test

      - name: Fetch public scouting Phase D
        run: python fetch_the_call_up_public_scouting_phase_d.py

      - name: Verify staged manifest
        run: |
          python - <<'PY'
          import json
          p='data/the_call_up_phase_d/public_scouting_manifest.json'
          d=json.load(open(p,encoding='utf-8'))
          c=d['coverage']
          assert d['productionReady'] is False
          assert c['matchedPlayers'] >= 450
          assert c['futureValuePlayers'] >= 400
          assert c['futureToolObservations'] >= 900
          print('PHASE_D_PUBLIC_SCOUTING_GATE_PASS', json.dumps(c, ensure_ascii=False))
          PY

      - name: Upload staged artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-call-up-public-scouting-phase-d-2026
          path: |
            data/the_call_up_phase_d/public-scouting-2026.json.gz
            data/the_call_up_phase_d/public_scouting_manifest.json
          retention-days: 14

      - name: Commit staged Phase D data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/the_call_up_phase_d/public-scouting-2026.json.gz data/the_call_up_phase_d/public_scouting_manifest.json
          if git diff --cached --quiet; then
            echo 'No staged Phase D changes to commit.'
            exit 0
          fi
          git commit -m 'data: stage 2026 public scouting Phase D'
          git pull --rebase origin main
          git push origin HEAD:main
