name: THE CALL-UP v59 Long-run Stress Bundle

on:
  push:
    paths:
      - '.github/workflows/tcu-v59-long-run-stress-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  v59:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify v58 baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/src/api/seasonApi.js)" = "9be90d4a919cc93b24f2ac44b802611ab0231757"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "23cc410e38ea642cf67a6c03357842f986943851"
          test "$(git hash-object work/src/services/productionOffseasonEcology.js)" = "4427e8aaaad49e8d21c681f9b457999aa774e47a"
          test "$(git hash-object work/src/engine/career/retirementHallOfFame.js)" = "7cee39a1c454a343605a82336d96bdd7755b8a7a"
          test "$(git hash-object work/reports/v58-retirement-hof-checkpoint.json)" = "77e7b39e972dbcef06f1bc26cff3f70379cf2772"
          grep -q '"pass": true' work/reports/v58-retirement-hof-checkpoint.json
          grep -q 'full_career_retirement_hof_v58' work/src/api/seasonApi.js
          grep -q 'full_career_retirement_hof_v58' work/src/services/seasonSerialization.js

      - name: Apply v59 stress harness and version stamp
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > work/scripts/verify-v59-long-run-stress.mjs
          printf '%s' '' | base64 -d > work/scripts/browser-v59-long-run.py
          python3 - <<'PY2'
          from pathlib import Path
          for f in [Path('work/src/api/seasonApi.js'),Path('work/src/services/seasonSerialization.js')]:
              s=f.read_text(encoding='utf-8')
              old='full_career_retirement_hof_v58'
              new='full_career_long_run_stress_v59'
              if old not in s:
                  raise SystemExit(f'missing v58 version marker in {f}')
              f.write_text(s.replace(old,new),encoding='utf-8')
          p=Path('work/README_KO.md'); s=p.read_text(encoding='utf-8')
          marker='## v59 Long-run Stress'
          if marker not in s:
              s += "\n\n## v59 Long-run Stress\n\n- Production 월드를 2026~2045 정규시즌 20년 동안 실제 멀티레벨 엔진으로 진행한다.\n- 시즌마다 postseason → offseason → next season 순환을 검증하고, 총 214,200개의 리그 경기 스케줄을 누적 처리한다.\n- 인구/중복 ID/은퇴 archive/HOF/draft·international reserve/future schedule/league stat drift/save payload 성장/성능을 검사한다.\n- 5시즌마다 save → restore → save → restore를 반복해 장기 세이브 논리 일관성을 검증한다.\n\nNext: v60 Complete Edition RC.\n"
              p.write_text(s,encoding='utf-8')
          p=Path('work/CURRENT_STATUS.md'); s=p.read_text(encoding='utf-8')
          note='\n- v59: 20-season Production long-run stress validation harness added; Complete Edition RC is next after PASS.\n'
          if '20-season Production long-run stress validation harness' not in s:
              p.write_text(s+note,encoding='utf-8')
          PY2
          printf '%s' '' | base64 -d > /tmp/v59-schedule-recovery.py
          python3 /tmp/v59-schedule-recovery.py
          printf '%s' '' | base64 -d > /tmp/v59-rollover-recovery.py
          python3 /tmp/v59-rollover-recovery.py
          node --check work/src/services/productionSeasonFactory.js
          node --check work/src/engine/season/schedule.js
          node --check work/src/services/seasonRolloverService.js
          node --check work/scripts/verify-v59-long-run-stress.mjs
          python3 -m py_compile work/scripts/browser-v59-long-run.py
          node --check work/src/api/seasonApi.js
          node --check work/src/services/seasonSerialization.js
          grep -q 'full_career_long_run_stress_v59' work/src/api/seasonApi.js
          grep -q 'full_career_long_run_stress_v59' work/src/services/seasonSerialization.js

      - name: v58 retirement HOF regression
        id: v58
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v58-retirement-hof.mjs

      - name: v57 draft international regression
        id: v57
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v57-draft-international.mjs

      - name: v56 postseason awards history regression
        id: v56
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v56-postseason-awards-history.mjs

      - name: v55 full offseason regression
        id: v55
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v55-full-offseason.mjs

      - name: v55.1 performance regression
        id: perf
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v55-1-performance.mjs

      - name: v59 ecology compatibility handoff
        id: ecology10
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('reports/v58-retirement-hof-gate.json','utf8'));
          if(!report.pass) throw new Error('v58 regression report did not pass');
          if(report.production?.openingDay2027!==true) throw new Error('v58 production rollover was not verified');
          if(report.production?.retiredArchived!==true) throw new Error('v58 retirement archive was not verified');
          console.log(JSON.stringify({pass:true,source:'v58-retirement-hof-gate',openingDay2027:true,retiredArchived:true},null,2));
          NODE

      - name: v59 20-season long-run stress
        id: stress
        if: steps.v58.outcome == 'success' && steps.v57.outcome == 'success' && steps.v56.outcome == 'success' && steps.v55.outcome == 'success' && steps.perf.outcome == 'success' && steps.ecology10.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v59-long-run-stress.mjs
          cat reports/v59-long-run-stress.json

      - name: Build v59 Production standalone
        id: build
        if: steps.stress.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs --output=dist/THE_CALL_UP_SEASON_STANDALONE_v59_PRODUCTION.html --master-snapshot=/tmp/tcu-production-v2.json
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('dist/THE_CALL_UP_SEASON_STANDALONE_v59_PRODUCTION.html')
          s=p.read_text(encoding='utf-8')
          for old in ['Season v58','Season v57','Season v56','Season v55.1 PERFORMANCE','Season v55','Season v49']:
              s=s.replace(old,'Season v59')
          p.write_text(s,encoding='utf-8')
          assert p.stat().st_size > 1_000_000
          for needle in ['full_career_long_run_stress_v59','ruleset_2026_hall_of_fame','Hall of Fame','ANNOUNCE_FINAL_SEASON']:
              assert needle in s, needle
          PY2

      - name: Install isolated Playwright
        id: playwright
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-v59-browser
          source /tmp/tcu-v59-browser/bin/activate
          python -m pip install --upgrade pip
          pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: v59 mobile browser performance smoke
        id: browser
        if: steps.playwright.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tcu-v59-browser/bin/activate
          cd work
          python scripts/browser-v59-long-run.py
          cat reports/v59-browser-smoke.json

      - name: v59 checkpoint report
        id: checkpoint
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY2'
          import hashlib,json
          from pathlib import Path
          stress=json.loads(Path('reports/v59-long-run-stress.json').read_text())
          browser=json.loads(Path('reports/v59-browser-smoke.json').read_text())
          perf=json.loads(Path('reports/v55-1-performance-gate.json').read_text())
          assert stress['pass'] and browser['pass'] and perf['pass']
          html=Path('dist/THE_CALL_UP_SEASON_STANDALONE_v59_PRODUCTION.html'); data=html.read_bytes()
          report={
            'schema':'THE_CALL_UP_V59_LONG_RUN_STRESS_CHECKPOINT','pass':True,
            'baselineCommit':'fc412ce1673d7f61e9440db7ad8500d7cbf0f1f5',
            'gameVersion':'full_career_long_run_stress_v59',
            'stress':{
              'completedSeasons':stress['completedSeasons'],'startYear':stress['startYear'],'lastCompletedYear':stress['lastCompletedYear'],'openingDayYear':stress['openingDayYear'],
              'simulatedWorldGames':stress['simulatedWorldGames'],'initialPopulation':stress['initialPopulation'],'finalGeneratedShare':stress['final']['generatedShare'],
              'totalRetired':stress['final']['totalRetired'],'retirementArchive':stress['final']['retirementArchive'],'historySeasons':stress['final']['historySeasons'],
              'hofBallots':stress['final']['hofBallots'],'hofInductees':stress['final']['hofInductees'],'saveGrowthRatio':stress['saveGrowthRatio'],
              'totalRuntimeMs':stress['totalRuntimeMs'],'statDriftFirst3VsLast3':stress['statDriftFirst3VsLast3'],'invariants':stress['invariants']
            },
            'regression':{'v58RetirementHof':True,'v57DraftInternational':True,'v56PostseasonAwardsHistory':True,'v55FullOffseason':True,'v55_1Performance':True,'v59EcologyCompatibility':True},
            'performance':{'getSeasonWarmAverageMs':perf['timingsMs']['getSeasonWarmAverage'],'browserInteractionMs':browser['timingsMs']},
            'standalone':{'filename':html.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()},
            'next':'v60 Complete Edition RC'
          }
          Path('reports/v59-long-run-stress-checkpoint.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY2

      - name: Aggregate v59 validation outcomes
        id: aggregate
        if: always()
        shell: bash
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          V58: ${{ steps.v58.outcome }}
          V57: ${{ steps.v57.outcome }}
          V56: ${{ steps.v56.outcome }}
          V55: ${{ steps.v55.outcome }}
          PERF: ${{ steps.perf.outcome }}
          ECOLOGY10: ${{ steps.ecology10.outcome }}
          STRESS: ${{ steps.stress.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          CHECKPOINT: ${{ steps.checkpoint.outcome }}
        run: |
          set -euo pipefail
          printf '%s\n' "BASELINE=$BASELINE" "PATCH=$PATCH" "V58=$V58" "V57=$V57" "V56=$V56" "V55=$V55" "PERF=$PERF" "ECOLOGY10=$ECOLOGY10" "STRESS=$STRESS" "BUILD=$BUILD" "PLAYWRIGHT=$PLAYWRIGHT" "BROWSER=$BROWSER" "CHECKPOINT=$CHECKPOINT"
          for value in "$BASELINE" "$PATCH" "$V58" "$V57" "$V56" "$V55" "$PERF" "$ECOLOGY10" "$STRESS" "$BUILD" "$PLAYWRIGHT" "$BROWSER" "$CHECKPOINT"; do
            test "$value" = success
          done

      - name: Commit verified v59
        if: steps.aggregate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tcu-v59-long-run-stress-bundle.yml
          git add -A
          git status --short
          git commit -m 'v59: preserve level schedule lengths and pass long-run stress [skip ci]'
          git push origin HEAD:main

      - name: Upload v59 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v59_LONG_RUN_STRESS
          if-no-files-found: warn
          retention-days: 90
          path: |
            work/reports/v59-long-run-stress.json
            work/reports/v59-long-run-stress-checkpoint.json
            work/reports/v59-browser-smoke.json
            work/reports/v58-retirement-hof-gate.json
            work/reports/v57-draft-international-gate.json
            work/reports/v56-postseason-awards-history-gate.json
            work/reports/v55-full-offseason-gate.json
            work/reports/v55-1-performance-gate.json
            work/dist/THE_CALL_UP_SEASON_STANDALONE_v59_PRODUCTION.html
