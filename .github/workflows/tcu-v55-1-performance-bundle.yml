name: THE CALL-UP v55.1 Performance Bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v55-1-performance-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v55-1-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Verify v55 baseline
        run: |
          set -euo pipefail
          test "$(git hash-object work/reports/v55-full-offseason-checkpoint.json)" = "846d0f19b27eec2ba44554eb5d422536004d1281"
          test "$(git hash-object work/src/api/seasonApi.js)" = "d07df6e6530c79c8452e2fb639a0134f19c645d3"
          test "$(git hash-object work/src/app/seasonApp.js)" = "cf428072550274f66cff781e99252915debdea69"
          test "$(git hash-object work/src/ui/seasonRender.js)" = "cc671b7a49944f8eff551d5acf93bdb64597984a"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "9fd23d8974662a05908a14bf1afd08cd2b1c175f"
          test "$(git hash-object work/src/services/seasonSaveService.js)" = "8ec5d8e93eaf02b0d44dccf80c82a5b4aad7a65d"

      - name: Install v55.1 performance changes
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/scripts/verify-v55-1-performance.mjs
          echo '' | base64 -d > work/scripts/browser-v55-1-performance.py
          echo '' | base64 -d > work/README_KO.md
          echo '' | base64 -d > /tmp/patch-v55-1.py
          python3 /tmp/patch-v55-1.py
          node --check work/src/api/seasonApi.js
          node --check work/src/app/seasonApp.js
          node --check work/scripts/verify-v55-1-performance.mjs
          python3 -m py_compile work/scripts/browser-v55-1-performance.py

      - name: v55.1 performance preflight
        id: preflight
        continue-on-error: true
        run: |
          set -euo pipefail
          grep -q 'heavyReadModelCaches' work/src/api/seasonApi.js
          grep -q 'cachedWorldProspectRankings' work/src/api/seasonApi.js
          grep -q 'cachedOrganizationView' work/src/api/seasonApi.js
          grep -q 'Object.isFrozen(value)' work/src/api/seasonApi.js
          grep -q 'queueAutosave' work/src/app/seasonApp.js
          grep -q 'requestIdleCallback' work/src/app/seasonApp.js

      - name: v55.1 focused performance gate
        id: performance
        continue-on-error: true
        run: cd work && node scripts/verify-v55-1-performance.mjs

      - name: Re-run v55 Full Offseason gate
        id: reg_v55
        continue-on-error: true
        run: cd work && node scripts/verify-v55-full-offseason.mjs

      - name: Re-run v54 Trade System gate
        id: reg_v54
        continue-on-error: true
        run: cd work && node scripts/verify-v54-trade-system.mjs

      - name: Re-run v54 Trade Rollover gate
        id: reg_v54_roll
        continue-on-error: true
        run: cd work && node scripts/verify-v54-trade-rollover.mjs

      - name: Re-run current MVP regression
        id: mvp
        continue-on-error: true
        run: cd work && node scripts/verify-v50-1g-current-mvp.mjs --verify --output=reports/v55-1-current-mvp-regression.json

      - name: Re-run Production runtime
        id: runtime
        continue-on-error: true
        run: cd work && node scripts/verify-v50-2a-production-data-runtime.mjs --verify --output=reports/v55-1-production-runtime-regression.json

      - name: Build v55.1 Production standalone
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs --output=dist/THE_CALL_UP_SEASON_STANDALONE_v55_1_PERFORMANCE.html --master-snapshot=/tmp/tcu-production-v2.json
          python3 - <<'PY2'
          from pathlib import Path
          p=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v55_1_PERFORMANCE.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("Season v49","Season v55.1 PERFORMANCE").replace("Season v55","Season v55.1 PERFORMANCE")
          p.write_text(s,encoding="utf-8")
          assert p.stat().st_size>1_000_000
          assert "heavyReadModelCaches" in s and "queueAutosave" in s
          PY2

      - name: Install isolated Playwright
        id: playwright
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-v55-1-browser
          source /tmp/tcu-v55-1-browser/bin/activate
          python -m pip install --upgrade pip
          pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: v55.1 mobile performance smoke
        id: browser
        continue-on-error: true
        run: |
          set -euo pipefail
          source /tmp/tcu-v55-1-browser/bin/activate
          cd work
          python scripts/browser-v55-1-performance.py

      - name: v55.1 checkpoint report
        id: checkpoint
        continue-on-error: true
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY2'
          import hashlib,json
          from pathlib import Path
          perf=json.loads(Path("reports/v55-1-performance-gate.json").read_text())
          browser=json.loads(Path("reports/v55-1-browser-performance.json").read_text())
          mvp=json.loads(Path("reports/v55-1-current-mvp-regression.json").read_text())
          runtime=json.loads(Path("reports/v55-1-production-runtime-regression.json").read_text())
          assert perf["pass"] and browser["pass"] and mvp["pass"] and runtime["pass"]
          html=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v55_1_PERFORMANCE.html")
          data=html.read_bytes()
          report={
            "schema":"THE_CALL_UP_V55_1_PERFORMANCE_CHECKPOINT","pass":True,
            "features":{"worldProspectCache":True,"organizationReadModelCache":True,"frozenFastPath":True,"idleAutosaveQueue":True,"nonBlockingNormalAutosave":True,"manualSaveFlush":True,"cacheInvalidationOnReview":True,"cacheExcludedFromSave":True,"mobileTimingGate":True},
            "performance":perf["timingsMs"],"browser":browser["timingsMs"],
            "regression":{"v55FullOffseason":True,"v54TradeSystem":True,"v54TradeRollover":True,"v50_1CurrentMvp":True,"v50_2ProductionRuntime":True},
            "standalone":{"filename":html.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()},
            "next":"v56 Postseason / Awards / History"
          }
          Path("reports/v55-1-performance-checkpoint.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          PY2

      - name: Aggregate v55.1 outcomes
        id: aggregate
        if: always()
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          PERF: ${{ steps.performance.outcome }}
          V55: ${{ steps.reg_v55.outcome }}
          V54: ${{ steps.reg_v54.outcome }}
          V54ROLL: ${{ steps.reg_v54_roll.outcome }}
          MVP: ${{ steps.mvp.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          CHECKPOINT: ${{ steps.checkpoint.outcome }}
        run: |
          set -euo pipefail
          printf '%-12s %s\n' PREFLIGHT "$PREFLIGHT" PERF "$PERF" V55 "$V55" V54 "$V54" V54ROLL "$V54ROLL" MVP "$MVP" RUNTIME "$RUNTIME" BUILD "$BUILD" PLAYWRIGHT "$PLAYWRIGHT" BROWSER "$BROWSER" CHECKPOINT "$CHECKPOINT"
          failed=0
          for value in "$PREFLIGHT" "$PERF" "$V55" "$V54" "$V54ROLL" "$MVP" "$RUNTIME" "$BUILD" "$PLAYWRIGHT" "$BROWSER" "$CHECKPOINT"; do
            if [ "$value" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi

      - name: Commit verified v55.1
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/src/api/seasonApi.js work/src/app/seasonApp.js work/scripts/verify-v55-1-performance.mjs work/scripts/browser-v55-1-performance.py work/README_KO.md work/reports/v55-1-performance-gate.json work/reports/v55-1-browser-performance.json work/reports/v55-1-current-mvp-regression.json work/reports/v55-1-production-runtime-regression.json work/reports/v55-1-performance-checkpoint.json
          git rm -f .github/workflows/tcu-v55-1-performance-bundle.yml
          git commit -m "v55.1: optimize heavy read models and autosave responsiveness [skip ci]"
          git push origin HEAD:main

      - name: Upload v55.1 checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v55_1_PERFORMANCE
          path: |
            work/dist/THE_CALL_UP_SEASON_STANDALONE_v55_1_PERFORMANCE.html
            work/reports/v55-1-performance-gate.json
            work/reports/v55-1-browser-performance.json
            work/reports/v55-1-performance-checkpoint.json
            work/README_KO.md
          if-no-files-found: ignore
          compression-level: 0
