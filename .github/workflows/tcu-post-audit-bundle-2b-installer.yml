name: THE CALL-UP Post-Audit Bundle 2B Installer

on:
  push:
    paths:
      - '.github/workflows/tcu-post-audit-bundle-2b-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle-2b:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm Snapshot v3
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          test -f data/the_call_up_snapshot_v3/mlb-milb-2026-production-v3.json.gz
          test -f data/the_call_up_snapshot_v3/production_manifest_v3.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('data/the_call_up_snapshot_v3/production_manifest_v3.json').read_text(encoding='utf-8'))
          assert m['pass'] is True
          assert m['snapshotId'] == 'mlb-milb-2026-2026-09-20-v3-production'
          assert m['contentHash'] == 'fnv1a32:f7b34713'
          assert m['coverage']['players'] == 5429
          assert m['coverage']['trackingRows'] == 14988
          assert m['coverage']['pitchArsenalRows'] == 12023
          assert m['coverage']['publicScoutingPlayers'] == 1127
          print('SNAPSHOT_V3_OK')
          PY

      - name: Add gzip snapshot support to standalone builder
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-standalone.mjs')
          s = p.read_text(encoding='utf-8')
          if 'import zlib from "node:zlib";' not in s:
              target = 'import process from "node:process";\n'
              assert target in s
              s = s.replace(target, target + 'import zlib from "node:zlib";\n', 1)
          old = '''let snapshotBootstrap = "";
          if (masterSnapshotPath) {
            const parsed = JSON.parse(fs.readFileSync(masterSnapshotPath, "utf8"));
            snapshotBootstrap = `globalThis.__THE_CALL_UP_MASTER_SNAPSHOT__ = ${JSON.stringify(parsed)};\\n`;
          }'''.replace('          ', '')
          new = '''function readMasterSnapshot(snapshotPath) {
            const bytes = fs.readFileSync(snapshotPath);
            const text = snapshotPath.endsWith(".gz")
              ? zlib.gunzipSync(bytes).toString("utf8")
              : bytes.toString("utf8");
            return JSON.parse(text);
          }

          let snapshotBootstrap = "";
          if (masterSnapshotPath) {
            const parsed = readMasterSnapshot(masterSnapshotPath);
            snapshotBootstrap = `globalThis.__THE_CALL_UP_MASTER_SNAPSHOT__ = ${JSON.stringify(parsed)};\\n`;
          }'''.replace('          ', '')
          if 'function readMasterSnapshot(snapshotPath)' not in s:
              assert old in s, 'standalone snapshot bootstrap block changed unexpectedly'
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check scripts/build-standalone.mjs

      - name: Install canonical v3 Complete Edition builder
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          cat > scripts/build-complete-edition-production.mjs <<'JS'
          import path from "node:path";
          import process from "node:process";
          import { spawnSync } from "node:child_process";
          import { fileURLToPath } from "node:url";

          const SCRIPT_DIR = path.dirname(fileURLToPath(import.meta.url));
          const WORK_ROOT = path.resolve(SCRIPT_DIR, "..");
          const MASTER_SNAPSHOT = "data/the_call_up_snapshot_v3/mlb-milb-2026-production-v3.json.gz";
          const DEFAULT_OUTPUT = "dist/THE_CALL_UP_COMPLETE_EDITION.html";

          function argValue(name, fallback) {
            const prefix = `--${name}=`;
            const hit = process.argv.slice(2).find((arg) => arg.startsWith(prefix));
            return hit ? hit.slice(prefix.length) : fallback;
          }

          function buildCompleteEditionProduction({ output = DEFAULT_OUTPUT } = {}) {
            const result = spawnSync(
              process.execPath,
              [
                path.resolve(WORK_ROOT, "scripts/build-standalone.mjs"),
                `--master-snapshot=${MASTER_SNAPSHOT}`,
                `--output=${output}`
              ],
              { cwd: WORK_ROOT, encoding: "utf8", stdio: "pipe" }
            );
            if (result.stdout) process.stdout.write(result.stdout);
            if (result.stderr) process.stderr.write(result.stderr);
            if (result.status !== 0) throw new Error(`Complete Edition Production build failed: exit ${result.status}`);
            return { masterSnapshot: MASTER_SNAPSHOT, output };
          }

          if (path.resolve(process.argv[1] ?? "") === fileURLToPath(import.meta.url)) {
            try {
              buildCompleteEditionProduction({ output: argValue("output", DEFAULT_OUTPUT) });
            } catch (error) {
              console.error(error);
              process.exitCode = 1;
            }
          }

          export { MASTER_SNAPSHOT, DEFAULT_OUTPUT, buildCompleteEditionProduction };
          JS
          node --check scripts/build-complete-edition-production.mjs

      - name: Install v3 runtime wiring verifier
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          cat > scripts/verify-production-runtime-v3.mjs <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import zlib from "node:zlib";
          import assert from "node:assert/strict";
          import { fileURLToPath } from "node:url";
          import { seasonApi } from "../src/api/seasonApi.js";
          import { validateMasterSnapshot } from "../src/data/masterSnapshot.js";
          import { validateSeasonSavePayload } from "../src/services/seasonSerialization.js";

          const SCRIPT_DIR = path.dirname(fileURLToPath(import.meta.url));
          const WORK_ROOT = path.resolve(SCRIPT_DIR, "..");
          const SNAPSHOT_REL = "data/the_call_up_snapshot_v3/mlb-milb-2026-production-v3.json.gz";
          const MANIFEST_REL = "data/the_call_up_snapshot_v3/production_manifest_v3.json";

          function readGz(relativePath) {
            return JSON.parse(zlib.gunzipSync(fs.readFileSync(path.resolve(WORK_ROOT, relativePath))).toString("utf8"));
          }
          function readJson(relativePath) {
            return JSON.parse(fs.readFileSync(path.resolve(WORK_ROOT, relativePath), "utf8"));
          }
          function outputPath() {
            const hit = process.argv.slice(2).find((arg) => arg.startsWith("--output="));
            return path.resolve(WORK_ROOT, hit ? hit.slice("--output=".length) : "reports/production-runtime-v3-wiring.json");
          }
          function careerInput(organizationId) {
            return {
              name: "Production v3 Wiring QA", nationality: "대한민국", hometown: "구미",
              age: 18, heightCm: 180, weightKg: 78, bodyType: "ATHLETIC",
              bats: "R", throws: "R", primaryPosition: "SS", archetype: "BALANCED",
              visibleTraits: ["QUICK_BAT", "SOFT_HANDS"], organizationMode: "FAVORITE",
              favoriteOrganizationId: String(organizationId)
            };
          }

          function buildRuntimeReport() {
            const snapshot = readGz(SNAPSHOT_REL);
            const manifest = readJson(MANIFEST_REL);
            validateMasterSnapshot(snapshot, { requireProductionCoverage: true });
            assert.equal(snapshot.metadata.snapshotId, "mlb-milb-2026-2026-09-20-v3-production");
            assert.equal(snapshot.metadata.contentHash, "fnv1a32:f7b34713");
            assert.equal(manifest.contentHash, snapshot.metadata.contentHash);

            const catalog = seasonApi.getCareerCreationCatalog({ masterSnapshot: snapshot });
            assert.equal(catalog.organizations.length, 30);
            const created = seasonApi.createCareerSeason({
              seed: "post-audit-production-v3-runtime",
              input: careerInput(catalog.organizations[0].id),
              masterSnapshot: snapshot
            });
            const payload = seasonApi.serializeSeason(created.seasonId);
            validateSeasonSavePayload(payload, { mode: "FULL" });
            assert.equal(payload.fixture.worldMode, "PRODUCTION_REAL");
            assert.equal(payload.dataUniverse.origin, "MASTER_SNAPSHOT");
            assert.equal(payload.dataUniverse.sourceSnapshot.id, snapshot.metadata.snapshotId);
            assert.equal(payload.dataUniverse.sourceSnapshot.hash, snapshot.metadata.contentHash);

            const data = payload.dataUniverse.data;
            const publicScoutingPlayers = data.players.filter((player) => player.publicScouting).length;
            assert.equal(data.players.length, 5429);
            assert.equal(data.teams.length, 150);
            assert.equal(data.parks.length, 30);
            assert.equal(data.schedule.length, 10710);
            assert.equal(data.tracking.length, 14988);
            assert.equal(data.pitchArsenal.length, 12023);
            assert.equal(publicScoutingPlayers, 1127);

            const trackingIds = new Set(data.tracking.map((row) => String(row.playerId)));
            const arsenalIds = new Set(data.pitchArsenal.map((row) => String(row.playerId)));
            assert.equal(trackingIds.size, 2149);
            assert.equal(arsenalIds.size, 1288);

            return {
              schema: "THE_CALL_UP_PRODUCTION_RUNTIME_V3_WIRING",
              pass: true,
              seed: "post-audit-production-v3-runtime",
              runtime: { gameVersion: payload.gameVersion, saveSchemaVersion: payload.schemaVersion, worldMode: payload.fixture.worldMode },
              snapshot: { source: `work/${SNAPSHOT_REL}`, id: snapshot.metadata.snapshotId, contentHash: snapshot.metadata.contentHash, schemaVersion: snapshot.schemaVersion },
              coverage: {
                organizations: catalog.organizations.length, teams: data.teams.length, players: data.players.length,
                parks: data.parks.length, scheduleGames: data.schedule.length, trackingRows: data.tracking.length,
                trackingPlayers: trackingIds.size, pitchArsenalRows: data.pitchArsenal.length,
                pitchArsenalPlayers: arsenalIds.size, publicScoutingPlayers
              },
              saveValidation: { full: true, sourceSnapshotPreserved: true }
            };
          }

          function main() {
            const report = buildRuntimeReport();
            const json = JSON.stringify(report, null, 2) + "\n";
            const out = outputPath();
            fs.mkdirSync(path.dirname(out), { recursive: true });
            fs.writeFileSync(out, json);
            process.stdout.write(json);
          }

          if (path.resolve(process.argv[1] ?? "") === fileURLToPath(import.meta.url)) {
            try { main(); } catch (error) { console.error(error); process.exitCode = 1; }
          }

          export { buildRuntimeReport };
          JS
          node --check scripts/verify-production-runtime-v3.mjs

      - name: Verify v3 runtime and FULL save
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          node scripts/verify-production-runtime-v3.mjs --output=reports/production-runtime-v3-wiring.json

      - name: Prove canonical Complete Edition build uses v3
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          rm -f /tmp/THE_CALL_UP_V3_A.html /tmp/THE_CALL_UP_V3_B.html
          node scripts/build-complete-edition-production.mjs --output=/tmp/THE_CALL_UP_V3_A.html
          node scripts/build-complete-edition-production.mjs --output=/tmp/THE_CALL_UP_V3_B.html
          cmp /tmp/THE_CALL_UP_V3_A.html /tmp/THE_CALL_UP_V3_B.html
          grep -q 'mlb-milb-2026-2026-09-20-v3-production' /tmp/THE_CALL_UP_V3_A.html
          grep -q 'fnv1a32:f7b34713' /tmp/THE_CALL_UP_V3_A.html
          grep -q 'complete_edition_v1_0' /tmp/THE_CALL_UP_V3_A.html

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('/tmp/THE_CALL_UP_V3_A.html')
          report = {
              'schema': 'THE_CALL_UP_COMPLETE_EDITION_V3_BUILD_WIRING',
              'pass': True,
              'snapshotId': 'mlb-milb-2026-2026-09-20-v3-production',
              'snapshotHash': 'fnv1a32:f7b34713',
              'bytes': p.stat().st_size,
              'sha256': hashlib.sha256(p.read_bytes()).hexdigest()
          }
          Path('reports/complete-edition-v3-build-wiring.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Commit Bundle 2B
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            work/scripts/build-standalone.mjs \
            work/scripts/build-complete-edition-production.mjs \
            work/scripts/verify-production-runtime-v3.mjs \
            work/reports/production-runtime-v3-wiring.json \
            work/reports/complete-edition-v3-build-wiring.json
          if git diff --cached --quiet; then
            echo "Bundle 2B already installed; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "post-audit: wire Complete Edition build to production snapshot v3"
          git push origin HEAD:main
