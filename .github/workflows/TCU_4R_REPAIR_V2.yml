name: THE CALL-UP Phase 3 4R Corrected Integrated Audit

on:
  push:
    paths:
      - '.github/workflows/TCU_4R_REPAIR_V2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrated-phase3-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify 4A-4Q report prerequisites and production snapshot
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test -f data/the_call_up_snapshot_v3/mlb-milb-2026-production-v3.json.gz
          test -f reports/phase3-scouting-position-audit-4q-v1.json
          test -f reports/phase3-automatic-injury-callup-4p-v1.json
          git diff --check -- src
          node --test tests/benchCurrentPitcherGuard4H.test.js tests/postseasonRoster4H.test.js tests/postseasonRotation4I.test.js

      - name: Block nested injured-list callup and test guard
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path
          p=Path('src/api/seasonApi.js')
          s=p.read_text(encoding='utf-8')
          needle='.filter(candidateId=>candidateId!==id && aaa.players?.[candidateId]);'
          assert s.count(needle)==1,'4P candidate-selection source changed; refusing unsafe patch'
          replacement=""".filter(candidateId=>candidateId!==id && aaa.players?.[candidateId]
                  && !emergencyMoveEntries(session).some(row=>row.status==='ACTIVE'
                    && (row.injuredPlayerId===candidateId || row.replacementId===candidateId))
                  && session.rosterControlStates?.[candidateId]?.assignmentStatus!=='MLB_INJURED_LIST');"""
          p.write_text(s.replace(needle,replacement),encoding='utf-8')
          p=Path('src/engine/career/rosterControlState.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('function prepareAaaMlbEmergencyInjuryMove(')
          needle='  try {\n    // The 10-/15-day injured list'
          assert s[start:].count(needle)==1,'4O helper source changed; refusing unsafe patch'
          replacement="""  if (candidate?.assignmentStatus==='MLB_INJURED_LIST') return {
              allowed:false, states:original, blockCode:'CANDIDATE_ON_INJURED_LIST',
              candidateReasonCodes:['CANDIDATE_ON_INJURED_LIST'], incumbentReasonCodes:['CANDIDATE_ON_INJURED_LIST']
            };
          """+needle
          s=s[:start]+s[start:].replace(needle,replacement,1)
          p.write_text(s,encoding='utf-8')
          print('IL candidate exclusion and roster-control guard installed')
          PY_PATCH
          node --check src/api/seasonApi.js
          node --check src/engine/career/rosterControlState.js
          git diff --check
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createRosterControlState,placeOnMlbInjuredList,prepareAaaMlbEmergencyInjuryMove} from './src/engine/career/rosterControlState.js';
          const date='2026-04-10',organizationId='qa';
          const il=placeOnMlbInjuredList(createRosterControlState({playerId:'il',initialLevel:'MLB',startDate:date,organizationId}),{date});
          const incumbent=createRosterControlState({playerId:'incumbent',initialLevel:'MLB',startDate:date,organizationId});
          const states={il,incumbent};
          const result=prepareAaaMlbEmergencyInjuryMove({states,candidateId:'il',incumbentId:'incumbent',date,organizationId,organizationPlayerIds:['il','incumbent']});
          assert.equal(result.allowed,false);
          assert.equal(result.blockCode,'CANDIDATE_ON_INJURED_LIST');
          assert.deepEqual(states,{il,incumbent});
          console.log('IL candidate guard PASS');
          JS

      - name: Re-test injury call-ups and scouting against current game source
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-phase3-automatic-injury-callup-4p.mjs
          node scripts/verify-phase3-scouting-position-4q.mjs
          git diff --check -- src
          git diff --exit-code -- reports/phase3-automatic-injury-callup-4p-v1.json reports/phase3-scouting-position-audit-4q-v1.json

