      - name: Correct 4R audit of historical IL returns
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          p=Path('scripts/verify-phase3-integration-4r.mjs')
          s=p.read_text(encoding='utf-8')
          old="      assert.ok(org.levels.MLB.roster.players[entry.replacementId]);"
          new="""      if(!org.levels.MLB.roster.players[entry.replacementId]) {
                  const chained=moves.some(x=>x.status==='ACTIVE' && x.injuredPlayerId===entry.replacementId);
                  assert.ok(chained && org.levels.AAA.roster.players[entry.replacementId],
                    `\${label}: temporary replacement moved without a tracked nested IL injury`);
                }""".replace('\\${label}','${label}')
          assert s.count(old)==1,'4R active replacement assertion changed'
          s=s.replace(old,new)
          old="""    }else if(entry.status==='RETURNED'){
                assert.equal(il.assignmentStatus,'MLB_ACTIVE',`\${label}: recovered player not active`);
                assert.ok(org.levels.MLB.roster.players[entry.injuredPlayerId]);
                assert.ok(org.levels.AAA.roster.players[entry.replacementId]);
                assert.ok(entry.returnedDate>=entry.minReturnDate,`\${label}: early IL return`);""".replace('\\${label}','${label}')
          new="""    }else if(entry.status==='RETURNED'){
                // Historical returns need not remain on today's MLB roster.
                assert.ok(entry.returnedDate>=entry.minReturnDate,`\${label}: early IL return`);""".replace('\\${label}','${label}')
          assert s.count(old)==1,'4R historical return assertion changed'
          s=s.replace(old,new)
          old="      assert.equal(il.assignmentStatus,'MLB_INJURED_LIST');"
          new="      assert.equal(il.assignmentStatus,'MLB_INJURED_LIST',`\${label}: active IL drift: \${JSON.stringify(entry)}`);".replace('\\${label}','${label}').replace('\\${JSON.stringify(entry)}','${JSON.stringify(entry)}')
          assert s.count(old)==1,'4R active IL assertion changed'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          print('4R evaluator distinguishes current IL from historical returns')
          PY_VERIFY
          node --check scripts/verify-phase3-integration-4r.mjs

      - name: Replay detailed save and simulate full 2026 production postseason
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-phase3-integration-4r.mjs
          node -e 'const r=JSON.parse(require("node:fs").readFileSync("reports/phase3-integrated-regression-4r-v1.json"));if(!r.pass||r.regularSeason.worldGames!==10710||!Object.values(r.gates).every(Boolean)||!r.postseason.championTeamId)process.exit(1);console.log("4R Phase 3 integrated regression PASS");'
          git diff --check -- src
          git diff --check

      - name: Commit only verified 4R verifier and result
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git add src/api/seasonApi.js src/engine/career/rosterControlState.js scripts/verify-phase3-integration-4r.mjs reports/phase3-integrated-regression-4r-v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '4R already committed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'phase3: prevent IL candidate reuse and validate integrated season (4R)'
            git push origin HEAD:main
          fi
