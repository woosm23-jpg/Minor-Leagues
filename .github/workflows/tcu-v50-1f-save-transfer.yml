name: THE CALL-UP v50.1f Save Transfer Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v50-1f-save-transfer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v50.1f baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/scripts/verify-season-save-checkpoint-v15.js)" = "f8d58c12569cee4248e3ca0adf95a8b8d6c26033"
          test "$(git hash-object work/scripts/verify-season-export-import-v16.js)" = "998529fa9d8e4922cc6a1ab0074a87bbda8acca8"
          test "$(git hash-object work/src/services/seasonSaveService.js)" = "8ec5d8e93eaf02b0d44dccf80c82a5b4aad7a65d"
          test "$(git hash-object work/src/services/seasonTransferService.js)" = "8e9802a677aca3b8ef293ce0f5ccefadbbbdcbad"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "6cb7b0c5b814b2104a9c83651c1905c629b8269d"
          test "$(git hash-object work/src/api/seasonApi.js)" = "ae3f22620b054788e9d9fae8b5f0c6604445c2f4"
          test -f work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz

      - name: Modernize save checkpoint and transfer verifiers
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/scripts/verify-season-save-checkpoint-v15.js
          echo 'Ly8gdjUwLjFmOiBleHBvcnQvaW1wb3J0IHZlcmlmaWNhdGlvbiBpcyB1bmlmaWVkIGluIHRoZSBjdXJyZW50IFByb2R1Y3Rpb24gc2F2ZS9jaGVja3BvaW50IGdhdGUuCmltcG9ydCAiLi92ZXJpZnktc2Vhc29uLXNhdmUtY2hlY2twb2ludC12MTUuanMiOwo=' | base64 -d > work/scripts/verify-season-export-import-v16.js
          node --check work/scripts/verify-season-save-checkpoint-v15.js
          node --check work/scripts/verify-season-export-import-v16.js

      - name: Focused current Production save transfer gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-season-save-checkpoint-v15.js --verify --output=reports/v50-1f-save-transfer-regression.json
          cat reports/v50-1f-save-transfer-regression.json

      - name: Commit verified v50.1f
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/scripts/verify-season-save-checkpoint-v15.js work/scripts/verify-season-export-import-v16.js work/reports/v50-1f-save-transfer-regression.json
          git rm .github/workflows/tcu-v50-1f-save-transfer.yml
          git commit -m "v50.1f: modernize save checkpoint transfer regression [skip ci]"
          git push origin HEAD:main

      - name: Upload v50.1f report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: the-call-up-v50-1f-save-transfer
          path: work/reports/v50-1f-save-transfer-regression.json
          if-no-files-found: ignore
