name: THE CALL-UP Post-Audit Bundle 3C Dynamic Stuff

on:
  push:
    paths:
      - '.github/workflows/tcu-post-audit-bundle-3c-dynamic-stuff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle-3c:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and verify Bundle 3C
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/tcu_bundle_3c.py
          python3 -m py_compile /tmp/tcu_bundle_3c.py
          python3 /tmp/tcu_bundle_3c.py
