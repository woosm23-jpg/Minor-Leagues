name: THE CALL-UP v50.1a Organization Depth Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v50-1a-org-depth.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organization-depth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v50.1a baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/scripts/verify-season-organization-v20.js)" = "0e93312737a90a916a0fae5825e7127104399acb"
          test "$(git hash-object work/src/api/seasonApi.js)" = "8959cab706eeb3e7027c6078e1782cf7e569d2de"
          test -f work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz

      - name: Modernize organization-depth verifier
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/scripts/verify-season-organization-v20.js
          node --check work/scripts/verify-season-organization-v20.js

      - name: Focused five-level Production organization-depth gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-season-organization-v20.js --seeds=2 --verify --output=reports/v50-1a-organization-depth.json
          cat reports/v50-1a-organization-depth.json

      - name: Commit verified v50.1a
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/scripts/verify-season-organization-v20.js work/reports/v50-1a-organization-depth.json
          git rm .github/workflows/tcu-v50-1a-org-depth.yml
          git commit -m "v50.1a: modernize five-level organization depth gate [skip ci]"
          git push origin HEAD:main

      - name: Upload v50.1a report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: the-call-up-v50-1a-organization-depth
          path: work/reports/v50-1a-organization-depth.json
          if-no-files-found: ignore
