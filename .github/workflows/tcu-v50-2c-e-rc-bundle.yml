name: THE CALL-UP v50.2 RC Bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v50-2c-e-rc-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v50-2-rc-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v50.2 bundle baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/reports/v50-2a-production-data-runtime.json)" = "9d6e36ffb46617eff2b5e1c24c1d1012071eec22"
          test "$(git hash-object work/reports/v50-2b-rollover-evidence.json)" = "6f0450478d2a14382da328601fe0f05912b9c684"
          test "$(git hash-object work/reports/v50-1g-current-mvp-gate.json)" = "5f3785df6af2a4d3977df24bd4563b533a586059"
          test "$(git hash-object work/reports/v50-1h-production-standalone.json)" = "a41398ace4b6a32ce7e8bb963fd6c9339b777bb4"
          test "$(git hash-object work/scripts/build-standalone.mjs)" = "4bf75be6ad8dba1706a91b98968c72fcd4656daf"
          test "$(git hash-object work/scripts/browser-standalone-smoke-v39.py)" = "26410e1552f8e27197ccdd244676d9305f4ad5d3"
          test "$(git hash-object work/src/api/seasonApi.js)" = "ae3f22620b054788e9d9fae8b5f0c6604445c2f4"
          test "$(git hash-object work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz)" = "a113be1ff629e68db8ccf8b7603badf1af83766a"
          test "$(git hash-object work/README_KO.md)" = "7b7d20b78ed49f9062b8a7e0dc54da8b4bbeb807"

          node - <<'NODE'
          const fs = require('fs');
          const reports = [
            ['work/reports/v50-1g-current-mvp-gate.json', 'THE_CALL_UP_V50_1G_CURRENT_MVP_GATE'],
            ['work/reports/v50-1h-production-standalone.json', 'THE_CALL_UP_V50_1H_PRODUCTION_STANDALONE'],
            ['work/reports/v50-2a-production-data-runtime.json', 'THE_CALL_UP_V50_2A_PRODUCTION_DATA_RUNTIME'],
            ['work/reports/v50-2b-rollover-evidence.json', 'THE_CALL_UP_V50_2B_ROLLOVER_EVIDENCE']
          ];
          for (const [path, schema] of reports) {
            const row = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (row.schema !== schema || row.pass !== true) throw new Error(`${path} is not verified PASS`);
          }
          NODE

      - name: Install v50.2 browser smoke and sync Korean docs
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/scripts/browser-production-v50_2.py
          echo '' | base64 -d > work/README_KO.md
          python3 -m py_compile work/scripts/browser-production-v50_2.py

      - name: Build v50.2 Production standalone
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs \
            --output=dist/THE_CALL_UP_SEASON_STANDALONE_v50_2_PRODUCTION.html \
            --master-snapshot=/tmp/tcu-production-v2.json

          python3 - <<'PY'
          from pathlib import Path
          p = Path("dist/THE_CALL_UP_SEASON_STANDALONE_v50_2_PRODUCTION.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("Season v49", "Season v50.2")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Static standalone verification
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dist/THE_CALL_UP_SEASON_STANDALONE_v50_2_PRODUCTION.html")
          s = p.read_text(encoding="utf-8")
          checks = {
              "doctype": s.startswith("<!doctype html>"),
              "korean": '<html lang="ko">' in s,
              "snapshot": "globalThis.__THE_CALL_UP_MASTER_SNAPSHOT__" in s,
              "production": "Production 2026" in s,
              "version": "Season v50.2" in s,
              "app": '<div id="app"' in s,
              "modules": "const __modules = Object.create(null);" in s,
              "size": p.stat().st_size > 1_000_000,
          }
          if not all(checks.values()):
              raise SystemExit(f"v50.2 standalone static check failed: {checks}")
          print(checks)
          PY

      - name: Install isolated Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-browser
          source /tmp/tcu-browser/bin/activate
          python -m pip install --upgrade pip
          pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: v50.2c mobile Production browser smoke
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tcu-browser/bin/activate
          cd work
          python scripts/browser-production-v50_2.py
          cat reports/v50-2c-production-browser-smoke.json

      - name: v50.2d docs sync verification
        shell: bash
        run: |
          set -euo pipefail
          grep -q "v50.2 Production RC" work/README_KO.md
          grep -q "5,429 canonical 선수" work/README_KO.md
          grep -q "10,710경기" work/README_KO.md
          grep -q "THE_CALL_UP_SEASON_STANDALONE_v50_2_PRODUCTION.html" work/README_KO.md
          grep -q "v51부터 계약/서비스타임" work/README_KO.md

      - name: v50.2e RC decision report
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          mvp = load("reports/v50-1g-current-mvp-gate.json")
          standalone_prev = load("reports/v50-1h-production-standalone.json")
          data = load("reports/v50-2a-production-data-runtime.json")
          rollover = load("reports/v50-2b-rollover-evidence.json")
          browser = load("reports/v50-2c-production-browser-smoke.json")

          assert mvp["pass"] is True and mvp["verified"] is True
          assert standalone_prev["pass"] is True
          assert data["pass"] is True and data["verified"] is True
          assert rollover["pass"] is True
          assert browser["pass"] is True
          assert browser["checks"]["pageErrors"] == 0

          html_path = Path("dist/THE_CALL_UP_SEASON_STANDALONE_v50_2_PRODUCTION.html")
          html_bytes = html_path.read_bytes()

          report = {
              "schema": "THE_CALL_UP_V50_2_RELEASE_CANDIDATE",
              "pass": True,
              "decision": "RC_READY",
              "source": "Production Snapshot v2",
              "version": "v50.2",
              "standalone": {
                  "filename": html_path.name,
                  "bytes": len(html_bytes),
                  "sha256": hashlib.sha256(html_bytes).hexdigest()
              },
              "gates": {
                  "v50_1CurrentMvp": True,
                  "v50_1Standalone": True,
                  "v50_2ProductionDataRuntime": True,
                  "v50_2RolloverEvidence": True,
                  "v50_2MobileBrowserSmoke": True,
                  "v50_2DocsSync": True
              },
              "production": {
                  "teams": data["snapshot"]["teams"],
                  "players": data["snapshot"]["players"],
                  "activePlayers": data["snapshot"]["activePlayers"],
                  "statsRows": data["snapshot"]["statsRows"],
                  "scheduleGames2026": data["snapshot"]["scheduleGames"],
                  "organizations": data["runtimeGate"]["organizations"],
                  "levels": ["MLB", "AAA", "AA", "HIGH_A", "A"]
              },
              "rollover": rollover["evidence"],
              "browser": browser["checks"],
              "next": "v51 Contracts / Service Time"
          }

          Path("reports/v50-2-release-candidate.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit v50.2 RC bundle
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            work/scripts/browser-production-v50_2.py \
            work/README_KO.md \
            work/reports/v50-2c-production-browser-smoke.json \
            work/reports/v50-2-release-candidate.json
          git rm .github/workflows/tcu-v50-2c-e-rc-bundle.yml
          git commit -m "v50.2: Production RC browser smoke and release checkpoint [skip ci]"
          git push origin HEAD:main

      - name: Upload v50.2 Production RC
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v50_2_PRODUCTION_RC
          path: |
            work/dist/THE_CALL_UP_SEASON_STANDALONE_v50_2_PRODUCTION.html
            work/reports/v50-2c-production-browser-smoke.json
            work/reports/v50-2-release-candidate.json
            work/README_KO.md
          if-no-files-found: ignore
          compression-level: 0
