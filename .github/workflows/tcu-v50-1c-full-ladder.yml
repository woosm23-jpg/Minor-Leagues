name: THE CALL-UP v50.1c Full Ladder Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v50-1c-full-ladder.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v50.1c baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/scripts/verify-season-multi-level-v23.js)" = "c145c43310b9e108114abe6e0c9c39f8e82d8915"
          test "$(git hash-object work/scripts/verify-season-multi-level-v23-all.js)" = "13f51b0504c5981e3010e6ec204275fb7ade102e"
          test "$(git hash-object work/src/api/seasonApi.js)" = "8959cab706eeb3e7027c6078e1782cf7e569d2de"
          test "$(git hash-object work/src/services/productionSeasonFactory.js)" = "cff0d41155a7836363756e47e253bdfed3ccec11"
          test -f work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz

      - name: Modernize five-level ladder verifier
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/scripts/verify-season-multi-level-v23.js
          node --check work/scripts/verify-season-multi-level-v23.js

      - name: Focused current Production full-ladder gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-season-multi-level-v23.js --seeds=1 --verify --output=reports/v50-1c-full-ladder-gate.json
          cat reports/v50-1c-full-ladder-gate.json

      - name: Commit verified v50.1c
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/scripts/verify-season-multi-level-v23.js work/reports/v50-1c-full-ladder-gate.json
          git rm .github/workflows/tcu-v50-1c-full-ladder.yml
          git commit -m "v50.1c: modernize five-level ladder gate [skip ci]"
          git push origin HEAD:main

      - name: Upload v50.1c report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: the-call-up-v50-1c-full-ladder
          path: work/reports/v50-1c-full-ladder-gate.json
          if-no-files-found: ignore
