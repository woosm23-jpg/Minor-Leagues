name: THE CALL-UP Phase 3 Next Appearance Long Absence

on:
  push:
    paths:
      - '.github/workflows/TCU_PHASE3_NEXT_APPEARANCE.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  next-appearance-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bounded-progress fix and regression test
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path

          def replace_once(path, before, after):
              p = Path(path)
              source = p.read_text(encoding='utf-8')
              count = source.count(before)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one exact patch anchor; found {count}. Inspect main before changing source.')
              p.write_text(source.replace(before, after, 1), encoding='utf-8')

          replace_once(
              'src/api/seasonApi.js',
              'function startCurrentGameInternal(session) {\n  let safety = 0;\n  while (true) {',
              'function startCurrentGameInternal(session) {\n  while (true) {'
          )
          replace_once(
              'src/api/seasonApi.js',
              '      safety += 1; if (safety > 24) throw new RangeError("다음 사용자 출전 탐색이 안전 한도를 초과했습니다.");\n      continue;',
              '      // Each skipped team game must become FINAL. With that invariant,\n'
              '      // the finite schedule bounds Next Appearance even for a season-long injury.\n'
              '      if (scheduleGameById(session, game.gameId, level).status !== "FINAL") {\n'
              '        throw new RangeError(`다음 사용자 출전 탐색 중 경기 진행이 멈췄습니다: ${level}:${game.gameId}`);\n'
              '      }\n'
              '      continue;'
          )
          replace_once(
              'src/app/seasonApp.js',
              '        if (action === "PLAY") {\n'
              '          saveMessage = "";\n'
              '          snapshot = seasonApi.startCurrentGame(snapshot.seasonId);\n'
              '          if (snapshot.activeGame) {\n'
              '            gameView = "GAME";\n'
              '            renderGame();\n'
              '            void queueAutosave();\n'
              '          }\n'
              '          return;\n'
              '        }',
              '        if (action === "PLAY") {\n'
              '          saveMessage = "";\n'
              '          const previousStatus = snapshot.status;\n'
              '          const previousCareerSequence = latestCareerSequence(snapshot);\n'
              '          snapshot = seasonApi.startCurrentGame(snapshot.seasonId);\n'
              '          majorEvent = latestMajorCareerEvent(snapshot, previousCareerSequence) ?? majorEvent;\n'
              '          if (snapshot.activeGame) {\n'
              '            gameView = "GAME";\n'
              '            renderGame();\n'
              '            void queueAutosave();\n'
              '          } else {\n'
              '            saveMessage = snapshot.nextGame\n'
              '              ? "아직 출전 경기를 찾지 못했습니다. 7일 진행으로 다음 일정을 확인하세요."\n'
              '              : "현재 시즌에 남은 출전 일정이 없습니다.";\n'
              '            const milestone = previousStatus !== "COMPLETE" && snapshot.status === "COMPLETE" ? "SEASON_END" : null;\n'
              '            renderHome();\n'
              '            void queueAutosave({ milestone });\n'
              '          }\n'
              '          return;\n'
              '        }'
          )

          test_path = Path('tests/nextAppearanceLongAbsence.test.js')
          if test_path.exists():
              raise RuntimeError(f'{test_path}: regression test already exists; inspect before overwriting.')
          test_path.write_text(r'''import assert from 'node:assert/strict';
          import test from 'node:test';
          import { writeFileSync } from 'node:fs';
          import { seasonApi } from '../src/api/seasonApi.js';

          test('Next Appearance survives more than 24 consecutive injury absences and save/restore', () => {
            const initial = seasonApi.createDemoSeason({
              seed: 'phase3-next-appearance-long-absence', startDate: '2026-04-01'
            });
            const payload = seasonApi.serializeSeason(initial.seasonId);
            const userId = payload.fixture.userPlayerId;
            assert.ok(payload.playerStates[userId], 'user player state must exist');
            // Force one long absence in a reproducible demo season; this is a QA
            // injection, not evidence of the naturally occurring injury distribution.
            payload.playerStates[userId].health.activeInjury = {
              injuryId: 'qa_long_absence', family: 'LOWER_BODY', severity: 'MAJOR',
              startDate: '2026-04-01', expectedReturnDate: '2027-01-01', daysRemaining: 275
            };
            seasonApi.restoreSeason(payload);
            const before = seasonApi.getSeason(initial.seasonId);
            const after = seasonApi.startCurrentGame(initial.seasonId);
            assert.ok(after.progress.gamesPlayed > 24,
              `long-absence regression must pass 24 team games; observed ${after.progress.gamesPlayed}`);
            assert.equal(after.activeGame, null, 'injured user must not be forced into a game');
            assert.equal(after.nextGame, null, 'the demo team schedule must be consumed');
            const checkpoint = seasonApi.serializeSeason(initial.seasonId);
            const recovered = seasonApi.restoreSeason(checkpoint);
            assert.equal(recovered.progress.gamesPlayed, after.progress.gamesPlayed);
            assert.equal(recovered.userSeasonLine.G, after.userSeasonLine.G);
            assert.equal(recovered.activeGame, null);
            assert.equal(checkpoint.playerStates[userId].health.activeInjury?.daysRemaining > 0, true);
            writeFileSync('reports/phase3-next-appearance-long-absence.json', JSON.stringify({
              schema: 'THE_CALL_UP_PHASE3_NEXT_APPEARANCE_LONG_ABSENCE_V1',
              pass: true,
              fixture: 'DEMO_FORCED_LONG_INJURY',
              userTeamGamesBefore: before.progress.gamesPlayed,
              userTeamGamesAfter: after.progress.gamesPlayed,
              skippedUserTeamGames: after.progress.gamesPlayed - before.progress.gamesPlayed,
              noForcedAppearance: after.activeGame === null,
              saveRestore: recovered.progress.gamesPlayed === after.progress.gamesPlayed
            }, null, 2) + '\n', 'utf8');
          });
          '''.replace('\n          ', '\n'), encoding='utf-8')
          print('Patched Next Appearance progress and no-game UI; added long-injury regression test.')
          PY_PATCH
          node --check src/api/seasonApi.js
          node --check src/app/seasonApp.js
          node --check tests/nextAppearanceLongAbsence.test.js
          git diff --check

      - name: Run existing tests and forced long-injury regression
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          npm test
          node --input-type=module <<'JS_ASSERT'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('reports/phase3-next-appearance-long-absence.json', 'utf8'));
          assert.equal(report.pass, true);
          assert.ok(report.skippedUserTeamGames > 24);
          assert.equal(report.noForcedAppearance, true);
          assert.equal(report.saveRestore, true);
          console.log('Phase 3 Next Appearance gate PASS:', report.skippedUserTeamGames, 'skipped team games');
          JS_ASSERT

      - name: Commit only verified source test and report
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git add src/api/seasonApi.js src/app/seasonApp.js tests/nextAppearanceLongAbsence.test.js reports/phase3-next-appearance-long-absence.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No verified changes staged; refusing an empty success commit.'
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'phase3: complete next appearance through long injury absences'
          git push origin HEAD:main
