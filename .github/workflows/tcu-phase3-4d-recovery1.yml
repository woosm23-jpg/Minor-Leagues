name: THE CALL-UP Phase 3 4D Recovery 1

on:
  push:
    paths:
      - '.github/workflows/tcu-phase3-4d-recovery1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-4d:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover Phase 3 Bundle 4D
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/tcu_4d_recovery.py <<'PY'
          from pathlib import Path
          import base64
          import re
          import subprocess

          ROOT = Path.cwd()
          SOURCE = ROOT / ".github/workflows/tcu-phase3-4d-late-game-bench.yml"

          workflow = SOURCE.read_text(encoding="utf-8")
          match = re.search(
              r"echo '([^']+)' \\| base64 -d > /tmp/tcu_phase3_4d\\.py",
              workflow
          )
          if not match:
              raise RuntimeError("기존 4D installer를 찾지 못했습니다.")

          installer = base64.b64decode(
              match.group(1)
          ).decode("utf-8")

          patch_code = """
          # 4D Fix 1: protect backup catcher at role-classification stage too.
          p = WORK / "src/engine/game/benchUsageAI.js"
          source = p.read_text(encoding="utf-8")
          old = base64.b64decode("").decode("utf-8")
          new = base64.b64decode("").decode("utf-8")

          if "const nonCatcherPinchBatPool = rows.filter(" not in source:
              if old not in source:
                  raise RuntimeError("PINCH_BAT classifier anchor missing")
              source = source.replace(old, new, 1)
              p.write_text(source, encoding="utf-8")

          run(["node", "--check", "src/engine/game/benchUsageAI.js"])

          """

          needle = 'verifier = dec("'
          if needle not in installer:
              raise RuntimeError("4D verifier insertion anchor missing")

          installer = installer.replace(
              needle,
              patch_code + needle,
              1
          )

          target = Path("/tmp/tcu_phase3_4d_recovered.py")
          target.write_text(installer, encoding="utf-8")

          subprocess.run(
              ["python3", "-m", "py_compile", str(target)],
              check=True
          )
          subprocess.run(
              ["python3", str(target)],
              cwd=ROOT,
              check=True
          )

          PY
          python3 -m py_compile /tmp/tcu_4d_recovery.py
          python3 /tmp/tcu_4d_recovery.py
