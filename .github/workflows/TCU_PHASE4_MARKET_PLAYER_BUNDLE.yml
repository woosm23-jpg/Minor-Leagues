name: THE CALL-UP Phase 4 Market and Roster Player Actions Bundle

on:
  push:
    paths:
      - '.github/workflows/TCU_PHASE4_MARKET_PLAYER_BUNDLE.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase4-market-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Connect agent strategy trade request and cancellation in one patch
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tests/phase4MarketPlayerActions.test.js
          cat > tests/phase4MarketPlayerActions.test.js <<'TCU_PHASE4_TEST'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { readFileSync, writeFileSync } from "node:fs";
          import { gunzipSync } from "node:zlib";
          import { seasonApi } from "../src/api/seasonApi.js";
          import { renderSeason } from "../src/ui/seasonRender.js";
          import { createTradeState, requestTradeState, cancelTradeRequestState,
            validateTradeState } from "../src/engine/career/tradeState.js";
          import { createContractMarketState, setAgentStrategy, projectFreeAgentMarket }
            from "../src/engine/career/contractMarket.js";

          const root = () => ({ innerHTML: "", querySelectorAll: () => [], querySelector: () => null });

          test("trade requests have one active request, reversible cancellation and no forced destination", () => {
            const base = createTradeState({ startDate: "2026-04-01", userPlayerId: "u" });
            const pending = requestTradeState(base, { date: "2026-04-02", preferences: { preferContender: true } });
            assert.equal(pending.agentRequest.status, "REQUESTED");
            assert.equal(requestTradeState(pending, { date: "2026-04-02", preferences: { preferContender: true } }), pending);
            assert.throws(() => requestTradeState(pending, { date: "2026-04-03", preferences: { preferPlayingTime: true } }), /이미|진행/);
            assert.throws(() => requestTradeState(base, { date: "2026-04-02", preferences: { destinationOrganizationId: "109" } }), /선호/);
            const cancelled = cancelTradeRequestState(pending, { date: "2026-04-02" });
            assert.equal(cancelled.agentRequest.status, "CANCELLED");
            assert.equal(cancelled.agentRequest.cancelledDate, "2026-04-02");
            assert.equal(validateTradeState(cancelled), true);
            assert.deepEqual(cancelled.trades, base.trades);
            assert.deepEqual(cancelled.rumors, base.rumors);
            assert.throws(() => cancelTradeRequestState(cancelled, { date: "2026-04-02" }), /요청/);
            const again = requestTradeState(cancelled, { date: "2026-04-03", preferences: { preferPlayingTime: true } });
            assert.equal(again.agentRequest.status, "REQUESTED");
            assert.equal(again.agentRequest.preferences.preferPlayingTime, true);
          });

          test("agent strategy is a market choice, not an instant contract or ratings change", () => {
            const before = createContractMarketState({ playerId: "u", startDate: "2026-04-01" });
            const after = setAgentStrategy(before, "SECURITY");
            assert.equal(before.agentStrategy, "BALANCED");
            assert.equal(after.agentStrategy, "SECURITY");
            assert.deepEqual(after.freeAgency, before.freeAgency);
            assert.equal(after.status, before.status);
            assert.throws(() => setAgentStrategy(after, "GUARANTEED_BONUS"), /agent strategy/);
            const input = { age: 27, projectedValue: 0.78, durability: 0.72,
              trackRecord: 0.62, reputation: 0.52, positionDemand: 0.67 };
            const security = projectFreeAgentMarket({ ...input, agentStrategy: "SECURITY" });
            const short = projectFreeAgentMarket({ ...input, agentStrategy: "BET_ON_MYSELF" });
            assert.ok(security.years > short.years);
            assert.ok(security.aav < short.aav);
          });

          test("2026 production market controls, trade cancellation, saves and date replay share one world", () => {
            const master = JSON.parse(gunzipSync(readFileSync(
              "data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz")).toString("utf8"));
            const catalog = seasonApi.getCareerCreationCatalog({ masterSnapshot: master });
            const org = catalog.organizations[0];
            const initial = seasonApi.createCareerSeason({ seed: "phase4-market-agent-batch",
              input: { name: "Phase4 Market QA", nationality: "대한민국", hometown: "구미", age: 21,
                heightCm: 180, weightKg: 78, bodyType: "ATHLETIC", bats: "R", throws: "R",
                primaryPosition: "CF", archetype: "HIT_FIRST", visibleTraits: ["QUICK_BAT", "SOFT_HANDS"],
                organizationMode: "FAVORITE", favoriteOrganizationId: String(org.id) },
              masterSnapshot: master });
            const id = initial.seasonId;
            const original = seasonApi.serializeSeason(id);
            const userId = String(original.fixture.userPlayerId);
            assert.equal(initial.userPlayer.marketActionsAvailable, true);
            const strategy = seasonApi.setAgentStrategy(id, "SECURITY");
            assert.equal(strategy.userPlayer.contractMarket.agentStrategy, "SECURITY");
            const requested = seasonApi.requestTrade(id, { preferences: { preferContender: true } });
            assert.equal(requested.userPlayer.trade.agentRequest.status, "REQUESTED");
            const view = root();
            renderSeason(view, requested, {}, "PLAYER", { playerSection: "CONTRACT" });
            assert.match(view.innerHTML, /data-agent-strategy="SECURITY"/);
            assert.match(view.innerHTML, /data-season-action="CANCEL_TRADE_REQUEST"/);
            assert.match(view.innerHTML, /트레이드 요청 철회/);
            const requestedPayload = seasonApi.serializeSeason(id);
            assert.deepEqual(requestedPayload.contractStates[userId], original.contractStates[userId],
              "changing agent or requesting trade must not award an instant new contract");
            assert.deepEqual(requestedPayload.rosterControlStates[userId], original.rosterControlStates[userId],
              "trade request must not silently change the active roster");
            const restoredPending = seasonApi.restoreSeason(structuredClone(requestedPayload));
            assert.equal(restoredPending.userPlayer.trade.agentRequest.status, "REQUESTED");
            assert.equal(restoredPending.userPlayer.contractMarket.agentStrategy, "SECURITY");
            const cancelled = seasonApi.cancelTradeRequest(id);
            assert.equal(cancelled.userPlayer.trade.agentRequest.status, "CANCELLED");
            assert.equal(seasonApi.serializeSeason(id).tradeState.trades.length, 0);
            const requestedAgain = seasonApi.requestTrade(id, { preferences: { preferPlayingTime: true } });
            assert.equal(requestedAgain.userPlayer.trade.agentRequest.preferences.preferPlayingTime, true);
            const checkpoint = seasonApi.serializeSeason(id);
            const first = seasonApi.simulateOneDay(id);
            const restored = seasonApi.restoreSeason(structuredClone(checkpoint));
            assert.equal(restored.userPlayer.trade.agentRequest.status, "REQUESTED");
            const replay = seasonApi.simulateOneDay(id);
            assert.deepEqual(replay.userPlayer.trade, first.userPlayer.trade);
            assert.deepEqual(replay.userPlayer.contractMarket, first.userPlayer.contractMarket);
            assert.equal(replay.currentDate, first.currentDate);
            const badTrade = seasonApi.serializeSeason(id);
            badTrade.tradeState.agentRequest.status = "INSTANT_TRADE";
            assert.throws(() => seasonApi.restoreSeason(badTrade), /trade request status/);
            const badMarket = seasonApi.serializeSeason(id);
            badMarket.contractMarketStates[userId].agentStrategy = "INFINITE_SALARY";
            assert.throws(() => seasonApi.restoreSeason(badMarket), /agentStrategy/);

            writeFileSync("reports/phase4-market-player-actions.json", JSON.stringify({
              schema: "THE_CALL_UP_PHASE4_MARKET_PLAYER_ACTIONS_V1", pass: true,
              productionMarketUi: true, strategyInfluencesFutureOfferModel: true,
              noInstantContractOrRosterGrant: true, cancellableTradeRequest: true,
              duplicateRequestGuard: true, noPlayerChosenDestination: true,
              saveRestoreReplay: true, malformedSaveRejected: true,
              source: "2026 production snapshot v2 baseline; v3 world gate separately required"
            }, null, 2) + "\n", "utf8");
          });
          TCU_PHASE4_TEST
          python3 - <<'TCU_PHASE4_PATCH'
          from pathlib import Path

          def replace_once(path, original, replacement):
              p=Path(path)
              source=p.read_text(encoding="utf-8")
              count=source.count(original)
              if count!=1:
                  raise RuntimeError(f"{path}: expected one anchor, found {count}: {original[:75]!r}")
              p.write_text(source.replace(original,replacement),encoding="utf-8")

          p='src/engine/career/tradeState.js'
          replace_once(p, '["NONE","REQUESTED","SATISFIED"].includes(state.agentRequest.status)',
              '["NONE","REQUESTED","SATISFIED","CANCELLED"].includes(state.agentRequest.status)')
          old='function requestTradeState(state,{date,preferences={}}={}){validateTradeState(state);assertDate(date,"trade request date");const n=clone(state);n.agentRequest={status:"REQUESTED",requestedDate:date,preferences:{...preferences}};return n;}'
          new='''function requestTradeState(state, { date, preferences = {} } = {}) {
            validateTradeState(state);
            assertDate(date, "trade request date");
            if (!preferences || typeof preferences !== "object" || Array.isArray(preferences) ||
                Object.keys(preferences).some(key => !["preferContender", "preferPlayingTime"].includes(key)) ||
                Object.values(preferences).some(value => typeof value !== "boolean")) {
              throw new RangeError("트레이드 선호는 경쟁력·출전 기회 두 항목만 선택할 수 있습니다.");
            }
            if (state.agentRequest.status === "REQUESTED") {
              if (JSON.stringify(state.agentRequest.preferences ?? {}) === JSON.stringify(preferences)) return state;
              throw new RangeError("트레이드 요청이 이미 진행 중입니다. 변경하려면 먼저 철회하세요.");
            }
            const next = clone(state);
            next.agentRequest = { status: "REQUESTED", requestedDate: date,
              preferences: { ...preferences }, cancelledDate: null };
            return next;
          }

          function cancelTradeRequestState(state, { date } = {}) {
            validateTradeState(state);
            assertDate(date, "trade cancellation date");
            if (state.agentRequest.status !== "REQUESTED") throw new RangeError("철회할 트레이드 요청이 없습니다.");
            if (date < state.agentRequest.requestedDate) throw new RangeError("요청일 이전에 철회할 수 없습니다.");
            const next = clone(state);
            next.agentRequest = { ...next.agentRequest, status: "CANCELLED", cancelledDate: date };
            return next;
          }'''
          replace_once(p,old,new)
          replace_once(p,
              'normalizeTradeState, requestTradeState, addTradeRumor, recordTrade, getTradePublicView };',
              'normalizeTradeState, requestTradeState, cancelTradeRequestState, addTradeRumor, recordTrade, getTradePublicView };')

          p='src/api/seasonApi.js'
          replace_once(p,
              'prepareArbitrationCase, resolveArbitration, getContractMarketPublicView } from "../engine/career/contractMarket.js";',
              'prepareArbitrationCase, resolveArbitration, getContractMarketPublicView, setAgentStrategy as chooseAgentStrategy } from "../engine/career/contractMarket.js";')
          replace_once(p,
              'normalizeTradeState, requestTradeState, addTradeRumor, recordTrade, getTradePublicView } from "../engine/career/tradeState.js";',
              'normalizeTradeState, requestTradeState, cancelTradeRequestState, addTradeRumor, recordTrade, getTradePublicView } from "../engine/career/tradeState.js";')
          replace_once(p,
              '    contractMarket: getContractMarketPublicView(session.contractMarketStates?.[playerId] ?? null),',
              '    marketActionsAvailable: isUser && session.fixture.worldMode === "PRODUCTION_REAL",\n'
              '    contractMarket: getContractMarketPublicView(session.contractMarketStates?.[playerId] ?? null),'.replace('\\n','\n'))
          replace_once(p,
              '  requestNextGameRest(seasonId) {',
              '''  setAgentStrategy(seasonId, strategy) {
              const session = assertSession(seasonId);
              const playerId = session.fixture.userPlayerId;
              const current = session.contractMarketStates?.[playerId];
              if (!current) throw new RangeError("에이전트 계약 시장 데이터가 없습니다.");
              session.contractMarketStates = { ...session.contractMarketStates,
                [playerId]: chooseAgentStrategy(current, strategy) };
              return snapshot(session);
            },
            requestNextGameRest(seasonId) {''')
          replace_once(p,
              'function updateStateUserTeam(state, teamId) {',
              '''function cancelTradeRequest(seasonId) {
            const session = assertSession(seasonId);
            session.tradeState = cancelTradeRequestState(session.tradeState,
              { date: session.state.currentDate });
            return snapshot(session);
          }
          function updateStateUserTeam(state, teamId) {''')
          replace_once(p,
              '  requestTrade,\n  executeTradeProposal,',
              '  requestTrade,\n  cancelTradeRequest,\n  executeTradeProposal,')

          p='src/app/seasonApp.js'
          replace_once(p,
              '''      async onRolePreference(mode) {
                  snapshot = seasonApi.setRolePreference(snapshot.seasonId, mode);
                  renderHome();
                  void queueAutosave();
                },''',
              '''      async onRolePreference(mode) {
                  snapshot = seasonApi.setRolePreference(snapshot.seasonId, mode);
                  renderHome();
                  void queueAutosave();
                },
                async onAgentStrategy(strategy) {
                  try {
                    snapshot = seasonApi.setAgentStrategy(snapshot.seasonId, strategy);
                    saveMessage = "에이전트 계약 전략을 변경했습니다.";
                    renderHome();
                    void queueAutosave();
                  } catch (error) {
                    saveMessage = `에이전트 전략 변경 실패: ${error?.message ?? error}`;
                    renderHome();
                  }
                },''')
          replace_once(p,
              '        if (action === "REQUEST_REST" || action === "CANCEL_REST") {',
              '''        if (["REQUEST_TRADE_CONTENDER", "REQUEST_TRADE_PLAYING_TIME", "CANCEL_TRADE_REQUEST"].includes(action)) {
                    try {
                      snapshot = action === "CANCEL_TRADE_REQUEST"
                        ? seasonApi.cancelTradeRequest(snapshot.seasonId)
                        : seasonApi.requestTrade(snapshot.seasonId, { preferences: action === "REQUEST_TRADE_CONTENDER"
                          ? { preferContender: true } : { preferPlayingTime: true } });
                      saveMessage = action === "CANCEL_TRADE_REQUEST"
                        ? "에이전트에게 트레이드 요청 철회를 전달했습니다."
                        : "에이전트에게 트레이드 요청을 전달했습니다. 이적이 확정된 것은 아닙니다.";
                      renderHome();
                      void queueAutosave();
                    } catch (error) {
                      saveMessage = `트레이드 요청 처리 실패: ${error?.message ?? error}`;
                      renderHome();
                    }
                    return;
                  }
                  if (action === "REQUEST_REST" || action === "CANCEL_REST") {''')

          p='src/ui/seasonRender.js'
          ui='''function playerMarketActionControls(player, market, trade) {
            if (!player.isUser || !player.marketActionsAvailable || !market || !trade) return "";
            const current = market.agentStrategy ?? "BALANCED";
            const options = [["SECURITY", "계약 기간 우선"], ["BALANCED", "기간·연봉 균형"],
              ["BET_ON_MYSELF", "단기·연봉 우선"]];
            const status = trade.agentRequest?.status ?? "NONE";
            const request = status === "REQUESTED";
            const requestText = status === "REQUESTED" ? "요청 전달됨 · 구단 판단 대기"
              : status === "CANCELLED" ? "이전 요청 철회됨"
                : status === "SATISFIED" ? "이적 요청에 따른 거래 완료" : "신청 내역 없음";
            return `<div class="training-focus-wrap market-actions-wrap">
              <div class="training-focus-head"><strong>에이전트 계약 전략</strong><span>시장 제안의 기간·연봉 선호</span></div>
              <div class="training-focus-grid">${options.map(([value, label]) => `<button type="button" data-agent-strategy="${value}" class="${current === value ? "active" : ""}">${label}</button>`).join("")}</div>
              <p class="condition-note">선택은 향후 FA 시장 추정·제안에 사용됩니다. 이미 체결된 계약과 실제 실력은 바뀌지 않습니다.</p>
              <div class="training-focus-head"><strong>트레이드 요청</strong><span>${esc(requestText)}</span></div>
              <div class="progress-actions">${request
                ? `<button type="button" class="secondary" data-season-action="CANCEL_TRADE_REQUEST">트레이드 요청 철회</button>`
                : `<button type="button" class="secondary" data-season-action="REQUEST_TRADE_PLAYING_TIME">출전 기회 선호로 요청</button><button type="button" class="secondary" data-season-action="REQUEST_TRADE_CONTENDER">경쟁력 있는 팀 선호로 요청</button>`}</div>
              <p class="condition-note">에이전트에게 의사를 전달하는 기능입니다. 목적지·트레이드 성사·주전 자리를 직접 결정할 수 없습니다.</p>
            </div>`;
          }

          '''
          replace_once(p,'function playerContractView(player) {',ui+'function playerContractView(player) {')
          replace_once(p,
              '    <p class="condition-note">v54 Trade Value는 OVR이 아니라',
              '    ${playerMarketActionControls(player, market, trade)}\n'
              '    <p class="condition-note">v54 Trade Value는 OVR이 아니라'.replace('\\n','\n'))
          replace_once(p,
              '  root.querySelectorAll("[data-role-preference]").forEach((button) => button.addEventListener("click", () => handlers.onRolePreference?.(button.dataset.rolePreference)));',
              '  root.querySelectorAll("[data-role-preference]").forEach((button) => button.addEventListener("click", () => handlers.onRolePreference?.(button.dataset.rolePreference)));\n'
              '  root.querySelectorAll("[data-agent-strategy]").forEach((button) => button.addEventListener("click", () => handlers.onAgentStrategy?.(button.dataset.agentStrategy)));'.replace('\\n','\n'))

          print('Phase 4 market UI, user actions, cancellation and safe anchors applied')
          TCU_PHASE4_PATCH
          node --check src/engine/career/tradeState.js
          node --check src/api/seasonApi.js
          node --check src/ui/seasonRender.js
          node --check src/app/seasonApp.js
          node --check tests/phase4MarketPlayerActions.test.js
          git diff --check
      - name: Run all unit tests and market player-action save replay
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node --input-type=module <<'TCU_PHASE4_CHECK'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync('reports/phase4-market-player-actions.json', 'utf8'));
          assert.equal(r.pass, true);
          for (const [key, value] of Object.entries(r)) {
            if (key !== 'schema' && key !== 'source') assert.equal(value, true, key);
          }
          console.log('Phase 4 player market actions gate PASS');
          TCU_PHASE4_CHECK
      - name: Check production roster transfer and full offseason gate
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-v52-roster-rules.mjs
          node scripts/verify-v54-trade-system.mjs
          node scripts/verify-v55-full-offseason.mjs
          node --input-type=module <<'TCU_PHASE4_WORLD'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const paths = ['v52-roster-rules-gate.json', 'v54-trade-system-gate.json', 'v55-full-offseason-gate.json'];
          for (const name of paths) assert.equal(JSON.parse(readFileSync(`reports/${name}`, 'utf8')).pass, true, name);
          const world = JSON.parse(readFileSync('reports/v55-full-offseason-gate.json', 'utf8'));
          assert.equal(world.production.worldGames2026, 10710);
          assert.equal(world.production.openingDay2027, true);
          console.log('Phase 4 roster, trade and 2026-27 offseason baseline PASS');
          TCU_PHASE4_WORLD
          node scripts/verify-phase3-integration-4r.mjs
          node --input-type=module <<'TCU_PHASE4_V3'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync('reports/phase3-integrated-regression-4r-v1.json', 'utf8'));
          assert.equal(r.pass, true);
          assert.equal(r.regularSeason.worldGames, 10710);
          assert.ok(r.postseason.championTeamId);
          assert.ok(Object.values(r.gates).every(Boolean));
          console.log('Current v3 world + postseason save baseline PASS');
          TCU_PHASE4_V3
          git diff --check
      - name: Commit only when the combined test gates pass
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git add src/engine/career/tradeState.js src/api/seasonApi.js src/ui/seasonRender.js src/app/seasonApp.js tests/phase4MarketPlayerActions.test.js reports/phase4-market-player-actions.json reports/v52-roster-rules-gate.json reports/v54-trade-system-gate.json reports/v55-full-offseason-gate.json reports/phase3-integrated-regression-4r-v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No verified Phase 4 changes; refusing empty commit.' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'phase4: bundle agent market choices trade requests roster and offseason QA'
          git push origin HEAD:main
