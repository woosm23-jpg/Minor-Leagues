name: THE CALL-UP v50.2a Production Data Runtime Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v50-2a-production-data-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-data-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v50.2a baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/src/data/masterSnapshot.js)" = "b3078fb39e31f34d83f2242cf92c9003908f24d4"
          test "$(git hash-object work/src/data/realWorldInference.js)" = "73253d774dfce58b4e9755e17a64f04f629b1bf4"
          test "$(git hash-object work/src/data/rosterAvailability.js)" = "b546dddb0beba59b8f04c26add736f991e49356d"
          test "$(git hash-object work/src/services/productionSeasonFactory.js)" = "cff0d41155a7836363756e47e253bdfed3ccec11"
          test "$(git hash-object work/src/api/seasonApi.js)" = "ae3f22620b054788e9d9fae8b5f0c6604445c2f4"
          test "$(git hash-object work/data/the_call_up_snapshot_v2/production_manifest_v2.json)" = "94dd393964ebf5b678c7ccd1725e2c7be84af7f6"
          test "$(git hash-object work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz)" = "a113be1ff629e68db8ccf8b7603badf1af83766a"
          test -f work/reports/v50-1h-production-standalone.json

      - name: Install v50.2a Production data runtime verifier
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/scripts/verify-v50-2a-production-data-runtime.mjs
          node --check work/scripts/verify-v50-2a-production-data-runtime.mjs

      - name: Run v50.2a Production data runtime gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v50-2a-production-data-runtime.mjs             --verify             --output=reports/v50-2a-production-data-runtime.json
          cat reports/v50-2a-production-data-runtime.json

      - name: Commit verified v50.2a
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/scripts/verify-v50-2a-production-data-runtime.mjs work/reports/v50-2a-production-data-runtime.json
          git rm .github/workflows/tcu-v50-2a-production-data-runtime.yml
          git commit -m "v50.2a: verify Production data and runtime [skip ci]"
          git push origin HEAD:main

      - name: Upload v50.2a report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: the-call-up-v50-2a-production-data-runtime
          path: work/reports/v50-2a-production-data-runtime.json
          if-no-files-found: ignore
