      - name: Production 2026 season completion and 2027 rollover gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-production-season-rollover-v50.mjs

      - name: Commit verified rollover fix
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/src/api/seasonApi.js                   work/scripts/verify-production-season-rollover-v50.mjs                   work/reports/v50-production-season-rollover.json
          if git diff --cached --quiet; then
            echo "No verified rollover changes to commit."
          else
            git commit -m "v50: verify Production season rollover [skip ci]"
            git push
          fi

      - name: Upload rollover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-call-up-v50-production-rollover
          path: work/reports/v50-production-season-rollover.json
          if-no-files-found: ignore
