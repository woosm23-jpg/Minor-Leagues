      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          elif [ -f work/package-lock.json ]; then
            cd work && npm ci
          elif [ -f work/package.json ]; then
            cd work && npm install
          fi

      - name: Focused live ecology verification
        shell: bash
        run: |
          if [ -f scripts/verify-production-live-ecology-v50.mjs ]; then
            node scripts/verify-production-live-ecology-v50.mjs
          else
            cd work && node scripts/verify-production-live-ecology-v50.mjs
          fi

      - name: Generated pipeline regression
        shell: bash
        run: |
          if [ -f scripts/verify-generated-pipeline-v50.mjs ]; then
            node scripts/verify-generated-pipeline-v50.mjs
          else
            cd work && node scripts/verify-generated-pipeline-v50.mjs
          fi

      - name: 10-year live ecology gate
        shell: bash
        run: |
          if [ -f scripts/audit-production-live-ecology-10y-v50.mjs ]; then
            node scripts/audit-production-live-ecology-10y-v50.mjs
          else
            cd work && node scripts/audit-production-live-ecology-10y-v50.mjs
          fi

      - name: Commit installed patch and reports
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports scripts src
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "v50 Phase E live ecology integration"
          git push
