      - name: Install dependencies
        shell: bash
        run: |
          cd work
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Focused live ecology verification
        shell: bash
        run: |
          cd work
          node scripts/verify-production-live-ecology-v50.mjs

      - name: Generated pipeline regression
        shell: bash
        run: |
          cd work
          node scripts/verify-generated-pipeline-v50.mjs

      - name: 10-year live ecology gate
        shell: bash
        run: |
          cd work
          node scripts/audit-production-live-ecology-10y-v50.mjs

      - name: Commit installed patch and reports
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/reports work/scripts work/src .github/workflows/the-call-up-phase-e-ecology-v50.yml
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "v50 Phase E live ecology integration"
          git push
