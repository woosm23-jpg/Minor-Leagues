name: "THE CALL-UP v50 Phase E Production Rollover Gate (Phone)"

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/THE_CALL_UP_v50_PHASE_E_PHONE_INSTALLER.yml'

permissions:
  contents: write

jobs:
  production-rollover-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify v50 Phase E baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f work/src/api/seasonApi.js
          test -f work/src/services/productionOffseasonEcology.js
          test -f work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz
          ACTUAL="$(git hash-object work/src/api/seasonApi.js)"
          case "$ACTUAL" in
            68b0dff23e945bb9c7a34695ebd74c58550024bb|43eb81c034bb1778ccc42d380b62ba43e208d80a) ;;
            *) echo "Unexpected seasonApi baseline: $ACTUAL" >&2; exit 1 ;;
