name: THE CALL-UP v60 RC FINALIZE PASS

on:
  push:
    paths:
      - '.github/workflows/tcu-v60-finalize-pass.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download already-PASSed v60 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/woosm23-jpg/Minor-Leagues/actions/artifacts/10734996328/zip" \
            -o /tmp/v60-pass.zip
          rm -rf /tmp/v60-pass
          mkdir -p /tmp/v60-pass
          unzip -q /tmp/v60-pass.zip -d /tmp/v60-pass
          find /tmp/v60-pass -maxdepth 3 -type f -print

      - name: Verify PASS evidence and install artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path

          root = Path('/tmp/v60-pass')
          gate = root / 'reports/v60-complete-edition-rc-gate.json'
          browser = root / 'reports/v60-complete-edition-rc-browser.json'
          checkpoint = root / 'reports/v60-complete-edition-rc-checkpoint.json'
          html = root / 'dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html'

          for p in [gate, browser, checkpoint, html]:
              assert p.exists(), f'missing artifact file: {p}'

          g = json.loads(gate.read_text(encoding='utf-8'))
          b = json.loads(browser.read_text(encoding='utf-8'))
          c = json.loads(checkpoint.read_text(encoding='utf-8'))

          assert g['pass'] is True
          assert b['pass'] is True
          assert c['pass'] is True
          assert c['gameVersion'] == 'complete_edition_rc_v60'
          assert c['saveValidation']['fullValidationEveryStage'] is True
          assert c['saveValidation']['repeatedRestoreStable'] is True
          assert c['saveValidation']['midseasonDeterministicContinuation'] is True

          expected_sha = '4ae3033f96ab0652cbb9a3295cc822ece9347958f1e6bb42aff9801bdfe66761'
          actual_sha = hashlib.sha256(html.read_bytes()).hexdigest()
          assert actual_sha == expected_sha, (actual_sha, expected_sha)
          assert html.stat().st_size == 66886709

          v59 = json.loads(Path('work/reports/v59-long-run-stress-checkpoint.json').read_text(encoding='utf-8'))
          assert v59['pass'] is True
          assert v59['stress']['completedSeasons'] == 20
          assert v59['stress']['lastCompletedYear'] == 2045
          assert v59['stress']['openingDayYear'] == 2046

          print('V60_PASS_ARTIFACT_VERIFIED')
          print('HTML_SHA256', actual_sha)
          PY

          mkdir -p work/reports work/dist
          cp /tmp/v60-pass/reports/v60-complete-edition-rc-gate.json work/reports/
          cp /tmp/v60-pass/reports/v60-complete-edition-rc-browser.json work/reports/
          cp /tmp/v60-pass/reports/v60-complete-edition-rc-checkpoint.json work/reports/
          cp /tmp/v60-pass/dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html work/dist/

      - name: Apply v60 RC release labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = 'full_career_long_run_stress_v59'
          new = 'complete_edition_rc_v60'
          for rel in ['work/src/api/seasonApi.js', 'work/src/services/seasonSerialization.js']:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              if new not in s:
                  assert old in s, f'missing v59 marker in {rel}'
                  s = s.replace(old, new)
                  p.write_text(s, encoding='utf-8')

          p = Path('work/scripts/build-standalone.mjs')
          s = p.read_text(encoding='utf-8')
          if 'Complete Edition RC v60' not in s:
              assert 'Season v49' in s
              p.write_text(s.replace('Season v49', 'Complete Edition RC v60'), encoding='utf-8')

          status_lines = [
              '# THE CALL-UP — Current Status',
              '',
              '- Validated integration baseline: **v59 — 20-season Production Long-run Stress PASS**',
              '- v59 proof: 2026–2045 complete, 214,200 world games, save/restore, ecology, postseason/offseason, draft/international, retirement/HOF.',
              '- Current build: **v60 — Complete Edition Release Candidate PASS**',
              '- v60 RC recovery evidence: lifecycle PASS, FULL save validation PASS, MIDSEASON deterministic continuation PASS, portrait mobile browser PASS.',
              '- Standalone RC: `work/dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html`',
              '- Next: final release gate / Complete Edition.',
              ''
          ]
          Path('work/CURRENT_STATUS.md').write_text('\n'.join(status_lines), encoding='utf-8')

          p = Path('work/README_KO.md')
          s = p.read_text(encoding='utf-8')
          marker = '## v60 Complete Edition RC'
          if marker not in s:
              note = [
                  '',
                  '',
                  marker,
                  '',
                  '- v59의 20시즌 장기 안정성 검증을 기반으로 v60 Complete Edition RC 통합 검증을 완료했습니다.',
                  '- Production lifecycle, FULL 저장/복원, 중간시즌 결정론, 모바일 세로 UI, 단일 HTML 검증이 PASS했습니다.',
                  '- RC 결과물: `dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html`',
                  ''
              ]
              p.write_text(s + '\n'.join(note), encoding='utf-8')
          PY

          node --check work/src/api/seasonApi.js
          node --check work/src/services/seasonSerialization.js
          node --check work/scripts/build-standalone.mjs
          grep -q 'complete_edition_rc_v60' work/src/api/seasonApi.js
          grep -q 'complete_edition_rc_v60' work/src/services/seasonSerialization.js
          grep -q 'Complete Edition RC v60' work/scripts/build-standalone.mjs

      - name: Finalize v60 RC on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            work/src/api/seasonApi.js \
            work/src/services/seasonSerialization.js \
            work/scripts/build-standalone.mjs \
            work/CURRENT_STATUS.md \
            work/README_KO.md \
            work/reports/v60-complete-edition-rc-gate.json \
            work/reports/v60-complete-edition-rc-browser.json \
            work/reports/v60-complete-edition-rc-checkpoint.json \
            work/dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html

          for f in \
            .github/workflows/tcu-v60-complete-edition-rc.yml \
            .github/workflows/tcu-v60-rc-lifecycle-recovery.yml \
            .github/workflows/tcu-v60-rc-lifecycle-recovery-v2.yml \
            .github/workflows/tcu-v60-rc-recovery-v2-clear.yml \
            .github/workflows/v60-recovery.yml \
            .github/workflows/tcu-v60-finalize-pass.yml
          do
            git rm -f --ignore-unmatch "$f"
          done

          git commit -m "v60: finalize complete edition RC from verified PASS artifact [skip ci]"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify pushed main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git show --stat --oneline --summary HEAD
          echo "V60_RC_FINALIZE_PASS"
