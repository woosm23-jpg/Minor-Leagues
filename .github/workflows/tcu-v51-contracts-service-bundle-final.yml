name: THE CALL-UP v51 Contracts Service Bundle Final

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v51-contracts-service-bundle-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v51-contracts-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v50.2 RC baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/reports/v50-2-release-candidate.json)" = "61075dc63e2b5d6c981f568fec5e219780a39047"
          test "$(git hash-object work/src/api/seasonApi.js)" = "ae3f22620b054788e9d9fae8b5f0c6604445c2f4"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "6cb7b0c5b814b2104a9c83651c1905c629b8269d"
          test "$(git hash-object work/src/app/seasonApp.js)" = "b3c565aee599c2ab6fe496805c9afc96b74ce60b"
          test "$(git hash-object work/src/ui/seasonRender.js)" = "9eef0d08bb5f956b9312831e819be949100d3991"
          test "$(git hash-object work/README_KO.md)" = "f6900a501cbd5f91853c230ed809bf3283289506"

          node - <<'NODE'
          const fs = require('fs');
          const rc = JSON.parse(fs.readFileSync('work/reports/v50-2-release-candidate.json', 'utf8'));
          if (rc.schema !== 'THE_CALL_UP_V50_2_RELEASE_CANDIDATE' || rc.pass !== true || rc.decision !== 'RC_READY') {
            throw new Error('v50.2 RC baseline is not ready');
          }
          NODE

      - name: Install v51 contract engine integration and UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/src/engine/career
          echo '' | base64 -d > work/src/engine/career/contractRules.js
          echo '' | base64 -d > work/src/engine/career/contractState.js
          echo '' | base64 -d > work/scripts/verify-v51-contract-service.mjs
          echo '' | base64 -d > work/scripts/verify-v51-contract-rollover.mjs
          echo '' | base64 -d > work/scripts/browser-contract-v51.py
          echo '' | base64 -d > work/README_KO.md
          echo '' | base64 -d > /tmp/patch-v51.py
          python3 /tmp/patch-v51.py

          node --check work/src/engine/career/contractRules.js
          node --check work/src/engine/career/contractState.js
          node --check work/src/api/seasonApi.js
          node --check work/src/services/seasonSerialization.js
          node --check work/src/app/seasonApp.js
          node --check work/src/ui/seasonRender.js
          node --check work/scripts/verify-v51-contract-service.mjs
          node --check work/scripts/verify-v51-contract-rollover.mjs
          python3 -m py_compile work/scripts/browser-contract-v51.py

      - name: v51 focused contract service gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v51-contract-service.mjs
          cat reports/v51-contract-service-gate.json

      - name: Re-run current MVP regression on v51 code
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v50-1g-current-mvp.mjs \
            --verify \
            --output=reports/v51-current-mvp-regression.json

      - name: Re-run Production data runtime gate on v51 code
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v50-2a-production-data-runtime.mjs \
            --verify \
            --output=reports/v51-production-data-runtime-regression.json

      - name: Full 2026 to 2027 contract rollover gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v51-contract-rollover.mjs
          cat reports/v51-contract-rollover-gate.json

      - name: Build v51 Production standalone
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs \
            --output=dist/THE_CALL_UP_SEASON_STANDALONE_v51_PRODUCTION.html \
            --master-snapshot=/tmp/tcu-production-v2.json

          python3 - <<'PY'
          from pathlib import Path
          p = Path("dist/THE_CALL_UP_SEASON_STANDALONE_v51_PRODUCTION.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("Season v49", "Season v51")
          s = s.replace("Season v50.2", "Season v51")
          p.write_text(s, encoding="utf-8")
          assert p.stat().st_size > 1_000_000
          assert "ruleset_2026" in s
          assert "Contract / Service" in s
          PY

      - name: Install isolated Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-v51-browser
          source /tmp/tcu-v51-browser/bin/activate
          python -m pip install --upgrade pip
          pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: v51 mobile Contract tab browser smoke
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tcu-v51-browser/bin/activate
          cd work
          python scripts/browser-contract-v51.py
          cat reports/v51-contract-browser-smoke.json

      - name: v51 release checkpoint report
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          focused = load("reports/v51-contract-service-gate.json")
          rollover = load("reports/v51-contract-rollover-gate.json")
          browser = load("reports/v51-contract-browser-smoke.json")
          current = load("reports/v51-current-mvp-regression.json")
          runtime = load("reports/v51-production-data-runtime-regression.json")
          assert focused["pass"] and rollover["pass"] and browser["pass"]
          assert current["pass"] and runtime["pass"]

          html = Path("dist/THE_CALL_UP_SEASON_STANDALONE_v51_PRODUCTION.html")
          data = html.read_bytes()
          report = {
              "schema": "THE_CALL_UP_V51_CONTRACTS_SERVICE_CHECKPOINT",
              "pass": True,
              "version": "v51",
              "ruleset": "ruleset_2026",
              "features": {
                  "versionedContractRules": True,
                  "dailyMlbService": True,
                  "minorTimeExcluded": True,
                  "unknownRealBaseline": True,
                  "saveRestore": True,
                  "seasonRollover": True,
                  "playerContractTab": True
              },
              "regression": {
                  "v50_1CurrentMvp": True,
                  "v50_2ProductionDataRuntime": True
              },
              "standalone": {
                  "filename": html.name,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest()
              },
              "next": "v52 40-man / options / DFA / waivers"
          }
          Path("reports/v51-contracts-service-checkpoint.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit verified v51 bundle
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            work/src/engine/career/contractRules.js \
            work/src/engine/career/contractState.js \
            work/src/api/seasonApi.js \
            work/src/services/seasonSerialization.js \
            work/src/app/seasonApp.js \
            work/src/ui/seasonRender.js \
            work/scripts/verify-v51-contract-service.mjs \
            work/scripts/verify-v51-contract-rollover.mjs \
            work/scripts/browser-contract-v51.py \
            work/README_KO.md \
            work/reports/v51-contract-service-gate.json \
            work/reports/v51-contract-rollover-gate.json \
            work/reports/v51-contract-browser-smoke.json \
            work/reports/v51-current-mvp-regression.json \
            work/reports/v51-production-data-runtime-regression.json \
            work/reports/v51-contracts-service-checkpoint.json

          git rm -f \
            .github/workflows/tcu-v51-contracts-service-bundle.yml \
            .github/workflows/tcu-v51-contracts-service-bundle-fix.yml \
            .github/workflows/tcu-v51-contracts-service-bundle-final.yml
          git commit -m "v51: add contracts and MLB service-time foundation [skip ci]"
          git push origin HEAD:main

      - name: Upload v51 Production checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v51_CONTRACTS_SERVICE
          path: |
            work/dist/THE_CALL_UP_SEASON_STANDALONE_v51_PRODUCTION.html
            work/reports/v51-contract-service-gate.json
            work/reports/v51-contract-rollover-gate.json
            work/reports/v51-contract-browser-smoke.json
            work/reports/v51-contracts-service-checkpoint.json
            work/README_KO.md
          if-no-files-found: ignore
          compression-level: 0
