name: THE CALL-UP v50.1d Final Call-up Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v50-1d-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-callup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v50.1d baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/scripts/verify-season-mlb-replacement-v24.js)" = "d741e6dc4e672147ce3ad78383b394444f7880b4"
          test "$(git hash-object work/src/api/seasonApi.js)" = "8959cab706eeb3e7027c6078e1782cf7e569d2de"
          test -f .github/workflows/tcu-v50-1d-mlb-callup.yml
          test -f .github/workflows/tcu-v50-1d-chronology-fix.yml
          test -f .github/workflows/tcu-v50-1d-calendar-fix2.yml
          test -f work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz

      - name: Fix current-game five-level chronology
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | python
          node --check work/src/api/seasonApi.js

      - name: Install resilient MLB call-up verifier
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/scripts/verify-season-mlb-replacement-v24.js
          node --check work/scripts/verify-season-mlb-replacement-v24.js

      - name: Focused Production MLB call-up replacement gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-season-mlb-replacement-v24.js --verify --output=reports/v50-1d-mlb-callup-replacement.json
          cat reports/v50-1d-mlb-callup-replacement.json

      - name: Commit verified v50.1d
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/src/api/seasonApi.js work/scripts/verify-season-mlb-replacement-v24.js work/reports/v50-1d-mlb-callup-replacement.json
          git rm -f             .github/workflows/tcu-v50-1d-mlb-callup.yml             .github/workflows/tcu-v50-1d-chronology-fix.yml             .github/workflows/tcu-v50-1d-calendar-fix2.yml             .github/workflows/tcu-v50-1d-final.yml
          git commit -m "v50.1d: preserve MLB call-up world chronology [skip ci]"
          git push origin HEAD:main

      - name: Upload v50.1d report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: the-call-up-v50-1d-final
          path: work/reports/v50-1d-mlb-callup-replacement.json
          if-no-files-found: ignore
