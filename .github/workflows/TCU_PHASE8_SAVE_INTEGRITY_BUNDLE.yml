        shell: bash
        run: |
          set -euo pipefail
          npm test
          node scripts/verify-phase8-save-integrity.mjs
          node --input-type=module <<'TCU_PHASE8_GATES'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const r=JSON.parse(readFileSync("reports/phase8-save-integrity-bundle.json","utf8"));
          assert.equal(r.pass,true);
          assert.equal(r.capturedBoundaryPayloadPreserved,true);
          assert.equal(r.corruptImportLeavesOriginalUntouched,true);
          console.log("Phase 8 integrity gate PASS");
          TCU_PHASE8_GATES
      - name: Verify production v3 full world and postseason with new save protections
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-phase3-integration-4r.mjs
          node --input-type=module <<'TCU_PHASE8_WORLD'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const world=JSON.parse(readFileSync("reports/phase3-integrated-regression-4r-v1.json","utf8"));
          assert.equal(world.pass,true);
          assert.equal(world.regularSeason.worldGames,10710);
          assert.ok(world.postseason.championTeamId);
          assert.ok(Object.values(world.gates).every(Boolean));
          console.log("Phase 8 v3 world regression PASS");
          TCU_PHASE8_WORLD
          git diff --check
      - name: Commit only after Phase 8 and production regression pass
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git add src/services/coalescedSaveQueue.js src/services/seasonSaveService.js src/services/seasonBackupService.js src/app/seasonApp.js tests/phase8SaveIntegrity.test.js scripts/verify-phase8-save-integrity.mjs reports/phase8-save-integrity-bundle.json reports/phase3-integrated-regression-4r-v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No verified Phase 8 changes; refusing empty commit.' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'phase8: preserve exact milestone saves and isolate career backup recovery'
          git push origin HEAD:main
