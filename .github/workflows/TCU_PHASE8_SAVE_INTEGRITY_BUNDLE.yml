name: THE CALL-UP Phase 8 Save Integrity and Milestone Restore Bundle

on:
  push:
    paths:
      - '.github/workflows/TCU_PHASE8_SAVE_INTEGRITY_BUNDLE.yml'
  workflow_dispatch:

permissions:
  contents: write

