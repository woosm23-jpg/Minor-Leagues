name: THE CALL-UP v53 Arbitration Free Agency Bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v53-arbitration-free-agency-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v53-arbitration-free-agency:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v52 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/reports/v52-roster-rules-checkpoint.json)" = "95eebac61b1d90035cbd95dc1199165beba16b50"
          test "$(git hash-object work/src/engine/career/contractRules.js)" = "d16861699636f750efb16cb572a40cdd49466070"
          test "$(git hash-object work/src/engine/career/contractState.js)" = "fafefd7fb9b53316962d9e471a7331fe65098def"
          test "$(git hash-object work/src/engine/career/rosterRules.js)" = "8e98e57d8aa822920ccf1b1c234126efc84d2f6d"
          test "$(git hash-object work/src/engine/career/rosterControlState.js)" = "c4d7793627b5b05b353f0fa2ed8bba386a6e0434"
          test "$(git hash-object work/src/api/seasonApi.js)" = "c035aaa44ff4d43b2dcda20df64b3ea1af36dbbb"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "3711069df83226ebd43c9e3d0a98214b082f2924"
          test "$(git hash-object work/src/ui/seasonRender.js)" = "d0e993430ec7894bfbe8acbaf06a420b7e40fa77"
          test "$(git hash-object work/README_KO.md)" = "85be7b5a61754b50a6d6473b33d9660580a1850e"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('work/reports/v52-roster-rules-checkpoint.json','utf8'));
          if(r.schema!=='THE_CALL_UP_V52_ROSTER_RULES_CHECKPOINT'||r.pass!==true) throw new Error('v52 baseline not PASS');
          NODE

      - name: Install v53 arbitration free-agency engine integration and UI
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/src/engine/career/contractMarket.js
          echo '' | base64 -d > work/scripts/verify-v53-arbitration-free-agency.mjs
          echo '' | base64 -d > work/scripts/verify-v53-contract-market-rollover.mjs
          echo '' | base64 -d > work/scripts/browser-contract-market-v53.py
          echo '' | base64 -d > work/README_KO.md
          echo '' | base64 -d > /tmp/patch-v53.py
          python3 /tmp/patch-v53.py

          node --check work/src/engine/career/contractRules.js
          node --check work/src/engine/career/contractState.js
          node --check work/src/engine/career/contractMarket.js
          node --check work/src/api/seasonApi.js
          node --check work/src/services/seasonSerialization.js
          node --check work/src/ui/seasonRender.js
          node --check work/scripts/verify-v53-arbitration-free-agency.mjs
          node --check work/scripts/verify-v53-contract-market-rollover.mjs
          python3 -m py_compile work/scripts/browser-contract-market-v53.py

      - name: v53 focused arbitration free-agency gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v53-arbitration-free-agency.mjs
          cat reports/v53-arbitration-free-agency-gate.json

      - name: Re-run v52 roster rules gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v52-roster-rules.mjs

      - name: Re-run v51 contract service gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v51-contract-service.mjs

      - name: Re-run current MVP regression
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v50-1g-current-mvp.mjs --verify --output=reports/v53-current-mvp-regression.json

      - name: Re-run Production data runtime gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v50-2a-production-data-runtime.mjs --verify --output=reports/v53-production-data-runtime-regression.json

      - name: Full 2026 to 2027 contract-market rollover
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v53-contract-market-rollover.mjs
          cat reports/v53-contract-market-rollover-gate.json

      - name: Build v53 Production standalone
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs \
            --output=dist/THE_CALL_UP_SEASON_STANDALONE_v53_PRODUCTION.html \
            --master-snapshot=/tmp/tcu-production-v2.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v53_PRODUCTION.html")
          s=p.read_text(encoding="utf-8").replace("Season v49","Season v53").replace("Season v52","Season v53")
          p.write_text(s,encoding="utf-8")
          assert p.stat().st_size>1_000_000
          assert "Arbitration / FA" in s
          assert "full_career_arbitration_free_agency_v53" in s
          assert "2027+ CBA 미확정" in s
          PY

      - name: Install isolated Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-v53-browser
          source /tmp/tcu-v53-browser/bin/activate
          python -m pip install --upgrade pip
          pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: v53 mobile contract market browser smoke
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tcu-v53-browser/bin/activate
          cd work
          python scripts/browser-contract-market-v53.py
          cat reports/v53-contract-market-browser-smoke.json

      - name: v53 checkpoint report
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text(encoding="utf-8"))
          focused=load("reports/v53-arbitration-free-agency-gate.json")
          rollover=load("reports/v53-contract-market-rollover-gate.json")
          browser=load("reports/v53-contract-market-browser-smoke.json")
          current=load("reports/v53-current-mvp-regression.json")
          runtime=load("reports/v53-production-data-runtime-regression.json")
          assert focused["pass"] and rollover["pass"] and browser["pass"] and current["pass"] and runtime["pass"]
          html=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v53_PRODUCTION.html")
          data=html.read_bytes()
          report={
            "schema":"THE_CALL_UP_V53_ARBITRATION_FREE_AGENCY_CHECKPOINT",
            "pass":True,
            "version":"v53",
            "ruleset":"ruleset_2026",
            "features":{
              "standardArbitration":True,
              "superTwo":True,
              "tenderNonTender":True,
              "finalOfferHearing":True,
              "agentStrategies":True,
              "freeAgentMarket":True,
              "offerExpiry":True,
              "counterOffers":True,
              "signingTerms":True,
              "qualifyingOffer2026Metadata":True,
              "futureCbaGuard":True,
              "saveRestore":True,
              "seasonRollover":True,
              "playerUi":True
            },
            "regression":{
              "v52RosterRules":True,
              "v51ContractService":True,
              "v50_1CurrentMvp":True,
              "v50_2ProductionDataRuntime":True
            },
            "standalone":{"filename":html.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()},
            "next":"v54 Trade System"
          }
          Path("reports/v53-arbitration-free-agency-checkpoint.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit verified v53 bundle
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            work/src/engine/career/contractRules.js \
            work/src/engine/career/contractState.js \
            work/src/engine/career/contractMarket.js \
            work/src/api/seasonApi.js \
            work/src/services/seasonSerialization.js \
            work/src/ui/seasonRender.js \
            work/scripts/verify-v53-arbitration-free-agency.mjs \
            work/scripts/verify-v53-contract-market-rollover.mjs \
            work/scripts/browser-contract-market-v53.py \
            work/README_KO.md \
            work/reports/v53-arbitration-free-agency-gate.json \
            work/reports/v53-contract-market-rollover-gate.json \
            work/reports/v53-contract-market-browser-smoke.json \
            work/reports/v53-current-mvp-regression.json \
            work/reports/v53-production-data-runtime-regression.json \
            work/reports/v53-arbitration-free-agency-checkpoint.json
          git rm .github/workflows/tcu-v53-arbitration-free-agency-bundle.yml
          git commit -m "v53: add arbitration and free-agency market foundation [skip ci]"
          git push origin HEAD:main

      - name: Upload v53 Production checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v53_ARBITRATION_FREE_AGENCY
          path: |
            work/dist/THE_CALL_UP_SEASON_STANDALONE_v53_PRODUCTION.html
            work/reports/v53-arbitration-free-agency-gate.json
            work/reports/v53-contract-market-rollover-gate.json
            work/reports/v53-contract-market-browser-smoke.json
            work/reports/v53-arbitration-free-agency-checkpoint.json
            work/README_KO.md
          if-no-files-found: ignore
          compression-level: 0
