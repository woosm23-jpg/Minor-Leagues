name: THE CALL-UP Phase 5 Spring Outlook and Amateur Integration Bundle

on:
  push:
    paths:
      - '.github/workflows/TCU_PHASE5_SPRING_AMATEUR_BUNDLE.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase5-spring-amateur:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard production sources and install spring and amateur bundle
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test -f data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz
          test -f data/the_call_up_snapshot_v3/mlb-milb-2026-production-v3.json.gz
          test -f scripts/verify-v57-draft-international.mjs
          mkdir -p "$(dirname 'src/engine/career/springCamp.js')"
          cat <<'TCU_ASSET_1' | base64 -d | gzip -d > 'src/engine/career/springCamp.js'
          
          TCU_ASSET_1
          mkdir -p "$(dirname 'tests/phase5SpringCamp.test.js')"
          cat <<'TCU_ASSET_2' | base64 -d | gzip -d > 'tests/phase5SpringCamp.test.js'
          
          TCU_ASSET_2
          mkdir -p "$(dirname 'scripts/verify-phase5-spring-amateur-bundle.mjs')"
          cat <<'TCU_ASSET_3' | base64 -d | gzip -d > 'scripts/verify-phase5-spring-amateur-bundle.mjs'
          
          TCU_ASSET_3
          python3 - <<'TCU_PHASE5_PATCH'
          from pathlib import Path

          def once(path,before,after):
              p=Path(path); s=p.read_text(encoding="utf-8"); n=s.count(before)
              if n!=1:raise RuntimeError(f"{path}: expected one anchor, found {n}: {before[:95]!r}")
              p.write_text(s.replace(before,after),encoding="utf-8")

          p="src/api/seasonApi.js"
          needle='import { createRetirementHallState, normalizeRetirementHallState, recordMlbSeason, archiveRetiredPlayers, announceUserFinalSeason, retireUserPlayer, processHallOfFameYear, getRetirementHallPublicView } from "../engine/career/retirementHallOfFame.js";'
          once(p,needle,needle+'\nimport { buildSpringCampOutlook, setSpringRolePreference } from "../engine/career/springCamp.js";')

          old='  else if(phase==="SPRING_TRAINING") result={mode:"ROSTER_PREP_ONLY_V55",detailedSpringGames:"DEFERRED"};'
          new='''  else if(phase==="SPRING_TRAINING") {
              const userId=session.fixture.userPlayerId;
              const outlook=buildSpringCampOutlook({
                organization:session.fixture.organization,playerId:userId,
                playerState:session.playerStates[userId],roleState:session.roleStates?.[userId],
                rosterControl:session.rosterControlStates?.[userId],
                targetYear:offseasonSeasonYear(session)+1,date
              });
              result={mode:"SPRING_PREVIEW_V1",outlook,
                detailedSpringGames:"NOT_YET_IMPLEMENTED",openingDayRosterDecision:"PENDING"};
            }'''
          once(p,old,new)

          old='    offseason: getOffseasonPublicView(session.offseasonState),'
          new='''    offseason: getOffseasonPublicView(session.offseasonState),
              springCamp: session.offseasonState?.phaseResults?.SPRING_TRAINING?.outlook ??
                (session.offseasonState?.currentPhase === "SPRING_TRAINING" ? buildSpringCampOutlook({
                  organization:session.fixture.organization,playerId:session.fixture.userPlayerId,
                  playerState:session.playerStates[session.fixture.userPlayerId],
                  roleState:session.roleStates?.[session.fixture.userPlayerId],
                  rosterControl:session.rosterControlStates?.[session.fixture.userPlayerId],
                  targetYear:offseasonSeasonYear(session)+1,date:offseasonPhaseDate(session,"SPRING_TRAINING")
                }) : null),'''
          once(p,old,new)

          old='  requestNextGameRest(seasonId) {'
          new='''  setSpringRolePreference(seasonId,mode) {
              const session=assertSession(seasonId);
              if (session.offseasonState?.status!=="ACTIVE" ||
                  session.offseasonState.currentPhase!=="SPRING_TRAINING")
                throw new RangeError("스프링 캠프 단계에서만 역할 선호를 선택할 수 있습니다.");
              const userId=session.fixture.userPlayerId;
              session.playerStates={...session.playerStates,
                [userId]:setSpringRolePreference(session.playerStates[userId],mode,
                  offseasonPhaseDate(session,"SPRING_TRAINING"))};
              return snapshot(session);
            },
            requestNextGameRest(seasonId) {'''
          once(p,old,new)

          p="src/services/seasonSerialization.js"
          needle='import { validatePlayerRolePreference } from "../engine/season/rolePreference.js";'
          once(p,needle,needle+'\nimport { validateSpringRolePreference } from "../engine/career/springCamp.js";')
          needle='    validatePlayerRolePreference(playerState.rolePreference ?? null, `payload.playerStates.${playerId}.rolePreference`);'
          once(p,needle,needle+'\n    validateSpringRolePreference(playerState.springRolePreference ?? null, `payload.playerStates.${playerId}.springRolePreference`);')

          p="src/ui/seasonRender.js"
          needle='function offseasonCard(snapshot) {'
          new='''function springCampPreview(snapshot) {
            const camp=snapshot.springCamp;
            if(!camp||snapshot.status!=="OFFSEASON")return "";
            const labels={LOCKED:"로스터 전망 안정",LIKELY:"로스터 전망 유력",BUBBLE:"로스터 경쟁 중",LONG_SHOT:"도전 필요"};
            const levels={MLB:"MLB",AAA:"AAA",AA:"AA",HIGH_A:"High-A",A:"A"};
            const choice=camp.preference??"OPEN";
            const options=[["OPEN","구단 판단"],["MLB_BENCH","MLB 벤치 선호"],["AAA_EVERYDAY","AAA 주전 선호"]];
            const controls=snapshot.offseason?.currentPhase==="SPRING_TRAINING"
              ? `<div class="training-focus-grid">${options.map(([value,label])=>`<button type="button" data-spring-role-preference="${value}" class="${choice===value?"active":""}">${label}</button>`).join("")}</div>` : "";
            return `<div class="training-focus-wrap spring-camp-preview">
              <div class="training-focus-head"><strong>스프링 예비평가</strong><span>${esc(camp.targetYear)} · ${esc(labels[camp.rosterSecurity]??"평가 중")}</span></div>
              <p class="condition-note">현재 ${esc(levels[camp.level]??camp.level)} · ${esc(camp.primaryPosition)} · MLB 동일 주포지션 경쟁 ${camp.directMlbCompetition}명. ${camp.injured?"현재 부상 상태입니다.":"현재 부상 제한은 없습니다."}</p>
              ${controls}
              <p class="condition-note">선호는 구단에 전달하는 의견이며 개막 로스터·주전은 보장되지 않습니다. 이 평가는 현재 로스터·역할에 따른 예비 전망으로, 아직 시범경기 성적이나 최종 개막 결정이 아닙니다.</p>
            </div>`;
          }
          function offseasonCard(snapshot) {'''
          once(p,needle,new)
          needle='    <p class="condition-note">v55는 각 오프시즌 단계를 저장하고 중복 적용을 막습니다. 중간에 앱을 닫아도 저장된 phase에서 이어집니다.</p>'
          once(p,needle,'    ${springCampPreview(snapshot)}\n'+needle)
          needle='  root.querySelectorAll("[data-role-preference]").forEach((button) => button.addEventListener("click", () => handlers.onRolePreference?.(button.dataset.rolePreference)));'
          once(p,needle,needle+'\n  root.querySelectorAll("[data-spring-role-preference]").forEach((button) => button.addEventListener("click", () => handlers.onSpringRolePreference?.(button.dataset.springRolePreference)));')

          p="src/app/seasonApp.js"
          needle='      async onRolePreference(mode) {\n        snapshot = seasonApi.setRolePreference(snapshot.seasonId, mode);\n        renderHome();\n        void queueAutosave();\n      },'
          once(p,needle,needle+'''\n      async onSpringRolePreference(mode) {
                  snapshot = seasonApi.setSpringRolePreference(snapshot.seasonId, mode);
                  renderHome();
                  void queueAutosave();
                },''')
          print("Phase 5 spring roster outlook, advisory choice, save validation and UI installed")
          TCU_PHASE5_PATCH
          node --check src/engine/career/springCamp.js
          node --check src/api/seasonApi.js
          node --check src/services/seasonSerialization.js
          node --check src/ui/seasonRender.js
          node --check src/app/seasonApp.js
          node --check tests/phase5SpringCamp.test.js
          node --check scripts/verify-phase5-spring-amateur-bundle.mjs
          git diff --check
      - name: Run full unit suite and spring camp integration with 2027 opening day
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node scripts/verify-phase5-spring-amateur-bundle.mjs
          node -e 'const r=require("./reports/phase5-spring-amateur-bundle.json");if(!r.pass||r.regularSeasonWorldGames2026!==10710||!r.openingDay2027)process.exit(1);console.log("Spring 2027 scenario PASS")'
          git diff --check
      - name: Verify draft international and current production v3 world postseason
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-v57-draft-international.mjs
          node scripts/verify-phase3-integration-4r.mjs
          node --input-type=module <<'TCU_PHASE5_GATES'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=(name)=>JSON.parse(readFileSync(`reports/${name}`,'utf8'));
          const camp=read('phase5-spring-amateur-bundle.json');
          const amateur=read('v57-draft-international-gate.json');
          const v3=read('phase3-integrated-regression-4r-v1.json');
          assert.equal(camp.pass,true);
          assert.equal(amateur.pass,true);
          assert.equal(amateur.draft2027.picks,600);
          assert.equal(amateur.draft2027.draftSlotRatingsInvariant,true);
          assert.equal(v3.pass,true);
          assert.equal(v3.regularSeason.worldGames,10710);
          assert.ok(v3.postseason.championTeamId);
          assert.ok(Object.values(v3.gates).every(Boolean));
          console.log('Phase 5 bundled gates PASS: spring outlook, draft, international, v3 world/postseason');
          TCU_PHASE5_GATES
          git diff --check
      - name: Commit only after all Phase 5 gates pass
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git add src/engine/career/springCamp.js src/api/seasonApi.js src/services/seasonSerialization.js src/ui/seasonRender.js src/app/seasonApp.js tests/phase5SpringCamp.test.js scripts/verify-phase5-spring-amateur-bundle.mjs reports/phase5-spring-amateur-bundle.json reports/v57-draft-international-gate.json reports/phase3-integrated-regression-4r-v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Phase 5 changes to commit' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'phase5: spring roster outlook player preference and amateur world gates'
          git push origin HEAD:main
