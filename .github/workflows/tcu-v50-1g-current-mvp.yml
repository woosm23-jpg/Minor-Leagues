name: THE CALL-UP v50.1g Current MVP Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v50-1g-current-mvp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  current-mvp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v50.1g baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/scripts/verify-season-organization-v20.js)" = "967d5daa9b61db4920501ae3adf83978697690ae"
          test "$(git hash-object work/scripts/verify-season-promotion-ai-v22.js)" = "76f53364b57a138a98b45bd6627603424c174e16"
          test "$(git hash-object work/scripts/verify-season-multi-level-v23.js)" = "90dd5df6b81010a4e369065ddfd73a33abeecd16"
          test "$(git hash-object work/scripts/verify-season-mlb-replacement-v24.js)" = "58ac8f9685c82b6e776185c288dc12dc14faaf19"
          test "$(git hash-object work/scripts/verify-season-condition.js)" = "4c41771c7c9c4f6410462956d8a313842541dfd4"
          test "$(git hash-object work/scripts/verify-season-save-checkpoint-v15.js)" = "1f284f762b76422efc4e1dfffcaf439954cb8783"
          test "$(git hash-object work/scripts/verify-season-export-import-v16.js)" = "1c039e8661a32b834ab3362d39803ea2d41b2dda"
          test "$(git hash-object work/src/api/seasonApi.js)" = "ae3f22620b054788e9d9fae8b5f0c6604445c2f4"
          test -f work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz

      - name: Install unified current MVP gate
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/scripts/verify-v50-1g-current-mvp.mjs
          node --check work/scripts/verify-v50-1g-current-mvp.mjs

      - name: Run unified current MVP gate
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v50-1g-current-mvp.mjs --verify --output=reports/v50-1g-current-mvp-gate.json
          cat reports/v50-1g-current-mvp-gate.json

      - name: Commit verified v50.1g
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/scripts/verify-v50-1g-current-mvp.mjs work/reports/v50-1g-current-mvp-gate.json
          git rm .github/workflows/tcu-v50-1g-current-mvp.yml
          git commit -m "v50.1g: add unified current MVP gate [skip ci]"
          git push origin HEAD:main

      - name: Upload v50.1g report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: the-call-up-v50-1g-current-mvp
          path: work/reports/v50-1g-current-mvp-gate.json
          if-no-files-found: ignore
