name: THE CALL-UP Phase 8 Fresh Two-Year Save and Phase 9 Release Candidate

on:
  push:
    paths:
      - '.github/workflows/TCU_PHASE8_9_FRESH_V3_RC.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase8-long-save-and-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 115
