name: THE CALL-UP COMPLETE EDITION FINAL RELEASE FIX2

on:
  push:
    paths:
      - '.github/workflows/tcu-complete-edition-final-release-fix2.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout verified v60 RC main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lock exact v60 RC baseline and inherited gates
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object work/src/api/seasonApi.js)" = "d3fc5c6e0d4df3e304ca39987e0c6fb2eb6375b1"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "a94ab37e8227e94b4e866f0101f9c85b388beb79"
          test "$(git hash-object work/scripts/build-standalone.mjs)" = "18ddf052a5566cd5cea529acc1a137d77c237657"
          test "$(git hash-object work/reports/v59-long-run-stress-checkpoint.json)" = "7782f038c455c0e445990c9db32c97719827a45e"
          test "$(git hash-object work/reports/v60-complete-edition-rc-checkpoint.json)" = "25f4a4cdd0e49647706238216510ba075e1fa72c"

          echo "4ae3033f96ab0652cbb9a3295cc822ece9347958f1e6bb42aff9801bdfe66761  work/dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html" | sha256sum -c -

          python3 - <<'PY'
          import json
          from pathlib import Path

          checkpoints = [
              'work/reports/v50-1f-save-transfer-regression.json',
              'work/reports/v51-contracts-service-checkpoint.json',
              'work/reports/v52-roster-rules-checkpoint.json',
              'work/reports/v53-arbitration-free-agency-checkpoint.json',
              'work/reports/v54-trade-system-checkpoint.json',
              'work/reports/v55-full-offseason-checkpoint.json',
              'work/reports/v55-1-performance-checkpoint.json',
              'work/reports/v56-postseason-awards-history-checkpoint.json',
              'work/reports/v57-draft-international-checkpoint.json',
              'work/reports/v58-retirement-hof-checkpoint.json',
              'work/reports/v59-long-run-stress-checkpoint.json',
              'work/reports/v60-complete-edition-rc-checkpoint.json',
          ]
          for rel in checkpoints:
              obj = json.loads(Path(rel).read_text(encoding='utf-8'))
              assert obj.get('pass') is True, rel

          v59 = json.loads(Path('work/reports/v59-long-run-stress-checkpoint.json').read_text(encoding='utf-8'))
          assert v59['stress']['completedSeasons'] == 20
          assert v59['stress']['lastCompletedYear'] == 2045
          assert v59['stress']['openingDayYear'] == 2046
          assert v59['stress']['simulatedWorldGames'] == 214200

          v60 = json.loads(Path('work/reports/v60-complete-edition-rc-checkpoint.json').read_text(encoding='utf-8'))
          assert v60['gameVersion'] == 'complete_edition_rc_v60'
          assert v60['saveValidation']['fullValidationEveryStage'] is True
          assert v60['saveValidation']['repeatedRestoreStable'] is True
          assert v60['saveValidation']['midseasonDeterministicContinuation'] is True
          assert v60['evidence']['mobilePortrait'] is True
          assert v60['evidence']['v59LongRun20Seasons'] is True

          manifest = json.loads(Path('work/data/the_call_up_snapshot_v2/production_manifest_v2.json').read_text(encoding='utf-8'))
          assert manifest['snapshotSchema'] == 2
          assert manifest['historySeasons'] == [2024, 2025, 2026]
          assert manifest['coverage']['teams'] == 150
          assert manifest['coverage']['players'] == 5429
          assert manifest['coverage']['statsRows'] == 80606
          assert manifest['coverage']['scheduleGames'] == 10710

          print('INHERITED_RELEASE_GATES_PASS')
          PY

      - name: Create an RC save for forward-compatibility proof
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/create-rc-save.mjs <<'JS'
          import fs from "node:fs";
          import zlib from "node:zlib";
          import assert from "node:assert/strict";
          import { pathToFileURL } from "node:url";

          const { seasonApi } = await import(
            pathToFileURL(process.cwd() + "/work/src/api/seasonApi.js").href
          );
          const { validateSeasonSavePayload } = await import(
            pathToFileURL(process.cwd() + "/work/src/services/seasonSerialization.js").href
          );

          const master = JSON.parse(
            zlib.gunzipSync(
              fs.readFileSync("work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz")
            ).toString("utf8")
          );
          const catalog = seasonApi.getCareerCreationCatalog({ masterSnapshot: master });
          assert.equal(catalog.organizations.length, 30);
          const orgId = String(catalog.organizations[0].id);

          const created = seasonApi.createCareerSeason({
            seed: "complete-edition-final-compat",
            input: {
              name: "Complete Edition QA",
              nationality: "대한민국",
              hometown: "구미",
              age: 18,
              heightCm: 180,
              weightKg: 78,
              bodyType: "ATHLETIC",
              bats: "R",
              throws: "R",
              primaryPosition: "SS",
              archetype: "BALANCED",
              visibleTraits: ["QUICK_BAT", "SOFT_HANDS"],
              organizationMode: "FAVORITE",
              favoriteOrganizationId: orgId
            },
            masterSnapshot: master
          });

          const seasonId = created.seasonId;
          const payload = seasonApi.serializeSeason(seasonId);
          validateSeasonSavePayload(payload, { mode: "FULL" });
          assert.equal(payload.gameVersion, "complete_edition_rc_v60");
          assert.equal(payload.fixture.worldMode, "PRODUCTION_REAL");

          const core = {
            seasonId,
            userPlayerId: payload.fixture.userPlayerId,
            organizationId: payload.fixture.organization.id,
            currentDate: payload.season.currentDate,
            status: payload.season.status,
            currentLevel: payload.season.currentLevel,
            levelCount: Object.keys(payload.levelSeasons ?? {}).length
          };

          fs.writeFileSync("/tmp/rc-save.json", JSON.stringify(payload));
          fs.writeFileSync("/tmp/rc-core.json", JSON.stringify(core));
          console.log(JSON.stringify(core, null, 2));
          JS
          node /tmp/create-rc-save.mjs

      - name: Promote RC labels to Complete Edition 1.0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_version = 'complete_edition_rc_v60'
          new_version = 'complete_edition_v1_0'

          for rel in [
              'work/src/api/seasonApi.js',
              'work/src/services/seasonSerialization.js'
          ]:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              assert s.count(old_version) == 1, (rel, s.count(old_version))
              p.write_text(s.replace(old_version, new_version), encoding='utf-8')

          p = Path('work/scripts/build-standalone.mjs')
          s = p.read_text(encoding='utf-8')
          assert 'Complete Edition RC v60' in s
          s = s.replace('Complete Edition RC v60', 'Complete Edition')
          s = s.replace('단일 HTML · Complete Edition RC', '단일 HTML · Complete Edition')
          p.write_text(s, encoding='utf-8')
          PY

          node --check work/src/api/seasonApi.js
          node --check work/src/services/seasonSerialization.js
          node --check work/scripts/build-standalone.mjs
          grep -q 'complete_edition_v1_0' work/src/api/seasonApi.js
          grep -q 'complete_edition_v1_0' work/src/services/seasonSerialization.js
          ! grep -q 'complete_edition_rc_v60' work/src/api/seasonApi.js
          ! grep -q 'complete_edition_rc_v60' work/src/services/seasonSerialization.js
          grep -q 'Complete Edition' work/scripts/build-standalone.mjs
          ! grep -q 'Complete Edition RC v60' work/scripts/build-standalone.mjs
          git diff --check

      - name: Prove RC save loads in Complete Edition
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify-final-save-compat.mjs <<'JS'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import { pathToFileURL } from "node:url";

          const { seasonApi } = await import(
            pathToFileURL(process.cwd() + "/work/src/api/seasonApi.js").href
          );
          const { validateSeasonSavePayload } = await import(
            pathToFileURL(process.cwd() + "/work/src/services/seasonSerialization.js").href
          );

          const payload = JSON.parse(fs.readFileSync("/tmp/rc-save.json", "utf8"));
          const before = JSON.parse(fs.readFileSync("/tmp/rc-core.json", "utf8"));

          validateSeasonSavePayload(payload, { mode: "FULL" });
          const restored = seasonApi.restoreSeason(structuredClone(payload));
          assert.equal(restored.seasonId, before.seasonId);

          const finalPayload = seasonApi.serializeSeason(before.seasonId);
          validateSeasonSavePayload(finalPayload, { mode: "FULL" });

          assert.equal(finalPayload.gameVersion, "complete_edition_v1_0");
          assert.equal(finalPayload.fixture.worldMode, "PRODUCTION_REAL");
          assert.equal(finalPayload.fixture.userPlayerId, before.userPlayerId);
          assert.equal(finalPayload.fixture.organization.id, before.organizationId);
          assert.equal(finalPayload.season.currentDate, before.currentDate);
          assert.equal(finalPayload.season.status, before.status);
          assert.equal(finalPayload.season.currentLevel, before.currentLevel);
          assert.equal(Object.keys(finalPayload.levelSeasons ?? {}).length, before.levelCount);

          const proof = {
            pass: true,
            fromGameVersion: payload.gameVersion,
            toGameVersion: finalPayload.gameVersion,
            fullValidation: true,
            productionWorld: true,
            seasonIdStable: true,
            userPlayerStable: true,
            organizationStable: true,
            currentDateStable: true,
            statusStable: true,
            levelStable: true
          };
          fs.writeFileSync("/tmp/final-save-compat.json", JSON.stringify(proof, null, 2) + "\n");
          console.log(JSON.stringify(proof, null, 2));
          JS
          node /tmp/verify-final-save-compat.mjs

      - name: Build final Complete Edition HTML
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs \
            --output=dist/THE_CALL_UP_COMPLETE_EDITION.html \
            --master-snapshot=/tmp/tcu-production-v2.json

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('dist/THE_CALL_UP_COMPLETE_EDITION.html')
          s = p.read_text(encoding='utf-8')
          assert p.stat().st_size > 60_000_000
          for needle in [
              'complete_edition_v1_0',
              'THE CALL-UP — Complete Edition',
              '단일 HTML · Complete Edition · Production 2026',
              'Hall of Fame',
              'ANNOUNCE_FINAL_SEASON',
              'SIM_7_DAYS',
              'SIM_IMPORTANT'
          ]:
              assert needle in s, needle
          assert 'Complete Edition RC v60' not in s

          print('FINAL_HTML_BYTES', p.stat().st_size)
          print('FINAL_HTML_SHA256', hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Prepare final mobile browser gate
        shell: bash
        run: |
          set -euo pipefail
          cat > work/scripts/browser-complete-edition-final.py <<'PY'
          import json,re,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          root=Path(__file__).resolve().parents[1]
          html_path=root/'dist'/'THE_CALL_UP_COMPLETE_EDITION.html'
          html=html_path.read_text(encoding='utf-8')

          legacy=(root/'scripts'/'browser-standalone-smoke-v39.py').read_text(encoding='utf-8')
          match=re.search(r"fake_idb = r'''(.*?)'''\\n\\nsmoke_html",legacy,re.S)
          if not match:
              raise RuntimeError('fake IndexedDB harness not found')
          smoke=html.replace('<body>\\n','<body>\\n'+match.group(1),1)

          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              for width,height in [(390,844),(412,915)]:
                  errors=[]
                  console_errors=[]
                  timings={}
                  checks={}
                  page=browser.new_page(viewport={'width':width,'height':height})
                  page.on('pageerror',lambda exc,arr=errors:arr.append(str(exc)))
                  page.on('console',lambda msg,arr=console_errors:arr.append(msg.text) if msg.type=='error' else None)
                  page.on('dialog',lambda d:d.accept())
                  page.set_content(smoke,wait_until='domcontentloaded',timeout=180000)
                  page.wait_for_selector('.save-select-hero',timeout=60000)

                  page.locator('[data-career-new]').click()
                  page.wait_for_selector('.new-career-screen',timeout=60000)
                  page.locator('[data-career-org-mode][value="FAVORITE"]').check(force=True)
                  page.wait_for_function(
                      "() => {const e=document.querySelector('[data-career-field=\"favoriteOrganizationId\"]');"
                      "return !!e&&[...e.options].filter(o=>o.value).length===30}",
                      timeout=180000
                  )
                  org=page.locator('[data-career-field="favoriteOrganizationId"]')
                  vals=org.locator('option').evaluate_all('(els)=>els.map(e=>e.value).filter(Boolean)')
                  org.select_option(vals[0])
                  page.locator('[data-career-field="name"]').fill('Complete Edition QA')
                  page.locator('[data-career-field="age"]').select_option('18')
                  page.locator('[data-career-field="primaryPosition"]').select_option('SS')
                  page.locator('[data-career-field="archetype"]').select_option('BALANCED')
                  page.locator('[data-career-create-submit]').click()
                  page.wait_for_function(
                      "() => document.querySelector('.season-title')?.textContent.includes('시즌 홈')",
                      timeout=180000
                  )

                  checks['home']=True
                  nav_heights=page.locator('[data-season-tab]').evaluate_all(
                      '(els)=>els.map(e=>e.getBoundingClientRect().height)'
                  )
                  checks['touchTargets44']=len(nav_heights)>=4 and min(nav_heights)>=44

                  t=time.perf_counter()
                  page.locator('[data-season-tab="PLAYER"]').click()
                  timings['homeToPlayer']=round((time.perf_counter()-t)*1000,3)
                  page.wait_for_function(
                      "() => document.querySelector('.season-title')?.textContent.includes('선수')",
                      timeout=30000
                  )
                  checks['playerTab']=True

                  t=time.perf_counter()
                  page.locator('[data-season-tab="LEAGUE"]').click()
                  timings['playerToLeague']=round((time.perf_counter()-t)*1000,3)
                  page.wait_for_function(
                      "() => document.querySelector('.season-title')?.textContent.includes('리그')",
                      timeout=30000
                  )
                  checks['leagueTab']=True

                  t=time.perf_counter()
                  page.locator('[data-season-tab="MORE"]').click()
                  timings['leagueToMore']=round((time.perf_counter()-t)*1000,3)
                  page.wait_for_selector('[data-more-section="HISTORY"]',timeout=30000)
                  page.locator('[data-more-section="HISTORY"]').click()
                  page.wait_for_selector('text=Hall of Fame',timeout=30000)
                  checks['hofUi']=page.locator('text=Hall of Fame').count()>0
                  checks['retirementUi']=page.locator('text=마지막 시즌 선언').count()>0

                  checks['noHorizontalOverflow']=page.evaluate(
                      '() => document.documentElement.scrollWidth <= window.innerWidth + 2'
                  )
                  checks['pageErrors']=len(errors)
                  checks['consoleErrors']=len(console_errors)
                  checks['handlersUnder1000ms']=all(v<1000 for v in timings.values())
                  checks['version']='complete_edition_v1_0' in html
                  checks['title']='THE CALL-UP — Complete Edition' in html

                  passed=(
                      checks['home']
                      and checks['touchTargets44']
                      and checks['playerTab']
                      and checks['leagueTab']
                      and checks['hofUi']
                      and checks['retirementUi']
                      and checks['noHorizontalOverflow']
                      and checks['pageErrors']==0
                      and checks['consoleErrors']==0
                      and checks['handlersUnder1000ms']
                      and checks['version']
                      and checks['title']
                  )
                  results.append({
                      'viewport':{'width':width,'height':height},
                      'pass':passed,
                      'timingsMs':timings,
                      'checks':checks,
                      'errors':errors,
                      'consoleErrors':console_errors
                  })
                  page.close()
              browser.close()

          passed=all(r['pass'] for r in results)
          report={
              'schema':'THE_CALL_UP_COMPLETE_EDITION_FINAL_BROWSER',
              'pass':passed,
              'results':results
          }
          (root/'reports'/'complete-edition-final-browser.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\\n',
              encoding='utf-8'
          )
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not passed:
              raise SystemExit(1)
          PY
          python3 -m py_compile work/scripts/browser-complete-edition-final.py

      - name: Install isolated Playwright
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-final-browser
          source /tmp/tcu-final-browser/bin/activate
          python -m pip install --upgrade pip
          pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Final portrait mobile browser gate
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tcu-final-browser/bin/activate
          cd work
          python scripts/browser-complete-edition-final.py
          cat reports/complete-edition-final-browser.json

      - name: Write Complete Edition final release checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path

          final_html = Path('dist/THE_CALL_UP_COMPLETE_EDITION.html')
          browser = json.loads(Path('reports/complete-edition-final-browser.json').read_text(encoding='utf-8'))
          rc = json.loads(Path('reports/v60-complete-edition-rc-checkpoint.json').read_text(encoding='utf-8'))
          v59 = json.loads(Path('reports/v59-long-run-stress-checkpoint.json').read_text(encoding='utf-8'))
          perf = json.loads(Path('reports/v55-1-performance-checkpoint.json').read_text(encoding='utf-8'))
          persistence = json.loads(Path('reports/v50-1f-save-transfer-regression.json').read_text(encoding='utf-8'))
          save_compat = json.loads(Path('/tmp/final-save-compat.json').read_text(encoding='utf-8'))

          assert browser['pass'] is True
          assert rc['pass'] is True
          assert v59['pass'] is True
          assert perf['pass'] is True
          assert persistence['pass'] is True
          assert save_compat['pass'] is True

          release = {
            'schema': 'THE_CALL_UP_COMPLETE_EDITION_RELEASE_GATE',
            'pass': True,
            'gameVersion': 'complete_edition_v1_0',
            'release': 'Complete Edition 1.0',
            'production': {
              'snapshotId': 'mlb-milb-2026-2026-09-20-v2-production',
              'contentHash': 'fnv1a32:21eb3434',
              'teams': 150,
              'players': 5429,
              'activePlayers': 4217,
              'statsRows': 80606,
              'scheduleGames': 10710
            },
            'inheritedGates': {
              'contractsServiceTime': True,
              'rosterOptionsDfaWaivers': True,
              'arbitrationFreeAgency': True,
              'tradeSystem': True,
              'fullOffseason': True,
              'performance': True,
              'postseasonAwardsHistory': True,
              'draftInternational': True,
              'retirementHallOfFame': True,
              'v59LongRun20Seasons': True,
              'v60CompleteEditionRC': True
            },
            'save': {
              'productionPersistenceRegression': True,
              'v60FullValidationEveryStage': rc['saveValidation']['fullValidationEveryStage'],
              'v60RepeatedRestoreStable': rc['saveValidation']['repeatedRestoreStable'],
              'v60MidseasonDeterministicContinuation': rc['saveValidation']['midseasonDeterministicContinuation'],
              'rcToFinalCompatibility': save_compat
            },
            'mobile': {
              'portrait390x844': True,
              'portrait412x915': True,
              'touchTargets44': True,
              'noHorizontalOverflow': True,
              'noPageErrors': True,
              'noConsoleErrors': True
            },
            'standalone': {
              'filename': final_html.name,
              'bytes': final_html.stat().st_size,
              'sha256': hashlib.sha256(final_html.read_bytes()).hexdigest()
            },
            'status': 'COMPLETE_EDITION_RELEASED'
          }

          Path('reports/complete-edition-release-gate.json').write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          Path('reports/complete-edition-release-checkpoint.json').write_text(
              json.dumps(release, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print(json.dumps(release, ensure_ascii=False, indent=2))
          PY

      - name: Update release status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          status_lines = [
              '# THE CALL-UP — Current Status',
              '',
              '- **Complete Edition 1.0 RELEASE PASS**',
              '- Game version: `complete_edition_v1_0`',
              '- Production world: 2026 MLB/MiLB snapshot v2, 150 teams, 5,429 canonical players.',
              '- Final release gate: contracts through HOF, save/restore, performance evidence, 20-season long-run stability, mobile portrait, Production data, and standalone HTML integrity PASS.',
              '- Final standalone: `work/dist/THE_CALL_UP_COMPLETE_EDITION.html`',
              '- Post-release policy: only 1.0.x bug fixes, balance/stat-realism tuning, and UI polish unless a critical missing system is discovered.',
              ''
          ]
          Path('work/CURRENT_STATUS.md').write_text('\n'.join(status_lines), encoding='utf-8')

          p = Path('work/README_KO.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('- 현재 개발: **v56 Postseason / Awards / History**', '- 현재 개발: **Complete Edition 1.0 RELEASE PASS**')
          s = s.replace('- Complete Edition: 아직 아님', '- Complete Edition: **출시 검증 완료**')
          marker = '## Complete Edition 1.0'
          if marker not in s:
              note = [
                  '',
                  '',
                  marker,
                  '',
                  '- 최종 게임 버전: `complete_edition_v1_0`',
                  '- 2026 Production MLB/MiLB 월드와 전체 커리어 시스템을 단일 HTML로 통합했습니다.',
                  '- 계약/서비스타임, 40인/옵션/DFA/웨이버, 연봉조정/FA, 트레이드, 오프시즌, 포스트시즌/수상/히스토리, 드래프트/국제계약, 은퇴/HOF를 포함합니다.',
                  '- v59 20시즌 장기 안정성, v60 RC 통합, FULL 저장 검증, RC→정식판 저장 호환, 모바일 세로 UI, 최종 HTML 무결성 검사를 통과했습니다.',
                  '- 실행 파일: `dist/THE_CALL_UP_COMPLETE_EDITION.html`',
                  ''
              ]
              s += '\n'.join(note)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit Complete Edition 1.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            work/src/api/seasonApi.js \
            work/src/services/seasonSerialization.js \
            work/scripts/build-standalone.mjs \
            work/scripts/browser-complete-edition-final.py \
            work/CURRENT_STATUS.md \
            work/README_KO.md \
            work/reports/complete-edition-final-browser.json \
            work/reports/complete-edition-release-gate.json \
            work/reports/complete-edition-release-checkpoint.json \
            work/dist/THE_CALL_UP_COMPLETE_EDITION.html

          git rm -f --ignore-unmatch work/dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html
          git rm -f --ignore-unmatch .github/workflows/tcu-complete-edition-final-release.yml
          git rm -f --ignore-unmatch .github/workflows/tcu-complete-edition-final-release-fix.yml

          git diff --cached --check
          git commit -m "release: THE CALL-UP Complete Edition 1.0 [skip ci]"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify released main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -f work/dist/THE_CALL_UP_COMPLETE_EDITION.html
          test ! -f work/dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html
          grep -q 'complete_edition_v1_0' work/src/api/seasonApi.js
          grep -q '"pass": true' work/reports/complete-edition-release-checkpoint.json
          git show --stat --oneline --summary HEAD
          echo "THE_CALL_UP_COMPLETE_EDITION_1_0_RELEASE_PASS"

      - name: Upload final Complete Edition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_COMPLETE_EDITION_1_0
          path: |
            work/dist/THE_CALL_UP_COMPLETE_EDITION.html
            work/reports/complete-edition-release-gate.json
            work/reports/complete-edition-release-checkpoint.json
            work/reports/complete-edition-final-browser.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
