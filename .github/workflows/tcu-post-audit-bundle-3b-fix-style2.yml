name: THE CALL-UP Post-Audit Bundle 3B Fix Style 2

on:
  push:
    paths:
      - '.github/workflows/tcu-post-audit-bundle-3b-fix-style2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle-3b-fix-style2:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm 3A and Production v3
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          parks = json.loads(
              Path('reports/production-real-parks-v1.json').read_text(encoding='utf-8')
          )
          identity = json.loads(
              Path('reports/final-runtime-identity-v1.json').read_text(encoding='utf-8')
          )

          assert parks['pass'] is True
          assert parks['snapshotHash'] == 'fnv1a32:f7b34713'
          assert identity['pass'] is True
          assert identity['snapshot']['contentHash'] == 'fnv1a32:f7b34713'
          print('BUNDLE_3A_AND_V3_OK')
          PY

      - name: Install Production pitch arsenal selector
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail

          cat > src/services/productionPitchArsenal.js <<'JS'
          const GENERATED_SOURCE_ID = "generated_random_fallback";

          const GENERATED_PITCH_POOL = Object.freeze([
            Object.freeze({ pitchType: "FF", minVelocity: 90, maxVelocity: 100 }),
            Object.freeze({ pitchType: "SI", minVelocity: 89, maxVelocity: 99 }),
            Object.freeze({ pitchType: "FC", minVelocity: 85, maxVelocity: 96 }),
            Object.freeze({ pitchType: "SL", minVelocity: 78, maxVelocity: 92 }),
            Object.freeze({ pitchType: "ST", minVelocity: 78, maxVelocity: 91 }),
            Object.freeze({ pitchType: "CU", minVelocity: 70, maxVelocity: 86 }),
            Object.freeze({ pitchType: "KC", minVelocity: 72, maxVelocity: 88 }),
            Object.freeze({ pitchType: "CH", minVelocity: 76, maxVelocity: 92 }),
            Object.freeze({ pitchType: "FS", minVelocity: 80, maxVelocity: 94 }),
            Object.freeze({ pitchType: "SV", minVelocity: 78, maxVelocity: 91 })
          ]);

          function freeze(value) {
            if (Array.isArray(value)) return Object.freeze(value.map(freeze));
            if (value && typeof value === "object") {
              return Object.freeze(
                Object.fromEntries(
                  Object.entries(value).map(([key, item]) => [key, freeze(item)])
                )
              );
            }
            return value;
          }

          function finite(value) {
            const n = Number(value);
            return Number.isFinite(n) ? n : null;
          }

          function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
          }

          function fnv1a32(text) {
            let hash = 0x811c9dc5;
            for (let i = 0; i < text.length; i += 1) {
              hash ^= text.charCodeAt(i);
              hash = Math.imul(hash, 0x01000193) >>> 0;
            }
            return hash >>> 0;
          }

          function fnv1aUnit(text) {
            return fnv1a32(text) / 0x100000000;
          }

          function mulberry32(seed) {
            let state = seed >>> 0;
            return () => {
              state = (state + 0x6d2b79f5) >>> 0;
              let t = state;
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 0x100000000;
            };
          }

          function normalizeUsage(row, totalPitches) {
            const explicit = finite(row?.usage);
            if (explicit != null && explicit >= 0) {
              return explicit > 1.000001 ? explicit / 100 : explicit;
            }
            const pitches = finite(row?.samples?.pitches);
            return pitches != null && pitches > 0 && totalPitches > 0
              ? pitches / totalPitches
              : 0;
          }

          function normalizePitchArsenalRows(rows, {
            playerId,
            level,
            season = 2026
          } = {}) {
            const id = String(playerId ?? "");
            const targetLevel = String(level ?? "");

            const matching = (rows ?? []).filter(
              (row) =>
                String(row?.playerId) === id &&
                String(row?.level) === targetLevel &&
                Number(row?.season) <= Number(season)
            );

            if (!matching.length) return Object.freeze([]);

            const latestSeason = Math.max(
              ...matching.map((row) => Number(row.season))
            );
            const latest = matching
              .filter((row) => Number(row.season) === latestSeason)
              .sort(
                (a, b) =>
                  String(a.pitchType).localeCompare(String(b.pitchType))
              );

            const totalPitches = latest.reduce(
              (sum, row) =>
                sum + Math.max(0, finite(row?.samples?.pitches) ?? 0),
              0
            );

            const staged = latest.map((row) => {
              const mean = finite(row?.velocity?.mean);
              const sd = finite(row?.velocity?.sd);
              return {
                pitchType: String(row.pitchType ?? "UNK").toUpperCase(),
                season: latestSeason,
                level: targetLevel,
                usage: Math.max(0, normalizeUsage(row, totalPitches)),
                velocityMph:
                  mean == null ? null : clamp(mean, 55, 110),
                velocitySdMph:
                  sd == null ? null : clamp(sd, 0, 12),
                movement: row?.movement ?? null,
                whiff: row?.whiff ?? null,
                location: row?.location ?? null,
                samples: row?.samples ?? null,
                sourceId: row?.sourceId ?? null,
                generated: false
              };
            });

            const positiveUsage = staged.reduce(
              (sum, row) => sum + row.usage,
              0
            );

            const normalized = staged.map((row) => ({
              ...row,
              usage:
                positiveUsage > 0
                  ? row.usage / positiveUsage
                  : 1 / Math.max(1, staged.length)
            }));

            return freeze(normalized);
          }

          function normalizeAnyLevelPitchArsenalRows(rows, {
            playerId,
            season = 2026
          } = {}) {
            const id = String(playerId ?? "");
            const matching = (rows ?? []).filter(
              (row) =>
                String(row?.playerId) === id &&
                Number(row?.season) <= Number(season)
            );
            if (!matching.length) return Object.freeze([]);

            const latestSeason = Math.max(
              ...matching.map((row) => Number(row.season))
            );
            const latest = matching.filter(
              (row) => Number(row.season) === latestSeason
            );

            const levelGroups = new Map();
            for (const row of latest) {
              const level = String(row?.level ?? "");
              if (!levelGroups.has(level)) levelGroups.set(level, []);
              levelGroups.get(level).push(row);
            }

            const selectedLevel = [...levelGroups.entries()]
              .map(([level, group]) => ({
                level,
                pitches: group.reduce(
                  (sum, row) =>
                    sum +
                    Math.max(
                      0,
                      finite(row?.samples?.pitches) ?? 0
                    ),
                  0
                )
              }))
              .sort(
                (a, b) =>
                  b.pitches - a.pitches ||
                  (a.level === "MLB" ? -1 : 0) ||
                  a.level.localeCompare(b.level)
              )[0]?.level ?? null;

            if (!selectedLevel) return Object.freeze([]);
            return normalizePitchArsenalRows(rows, {
              playerId: id,
              level: selectedLevel,
              season: latestSeason
            });
          }

          function buildProductionPitchArsenalIndex(rows, {
            season = 2026
          } = {}) {
            const exactKeys = new Map();
            const playerIds = new Set();

            for (const row of rows ?? []) {
              const playerId = String(row?.playerId ?? "");
              const level = String(row?.level ?? "");
              if (!playerId) continue;
              playerIds.add(playerId);
              const key = `${level}:${playerId}`;
              if (!exactKeys.has(key)) {
                exactKeys.set(key, { playerId, level });
              }
            }

            const index = new Map();

            for (const [key, meta] of exactKeys.entries()) {
              const arsenal = normalizePitchArsenalRows(rows, {
                ...meta,
                season
              });
              if (arsenal.length) index.set(key, arsenal);
            }

            for (const playerId of playerIds) {
              const arsenal = normalizeAnyLevelPitchArsenalRows(rows, {
                playerId,
                season
              });
              if (arsenal.length) {
                index.set(`*:${playerId}`, arsenal);
              }
            }

            return index;
          }

          function createGeneratedRandomArsenal({
            playerId,
            seed = "",
            level = "UNKNOWN",
            season = 2026
          } = {}) {
            const id = String(playerId ?? "");
            if (!id) throw new TypeError("generated arsenal에는 playerId가 필요합니다.");

            const rng = mulberry32(
              fnv1a32(`GENERATED_RANDOM_ARSENAL_V1:${seed}:${id}`)
            );
            const pool = [...GENERATED_PITCH_POOL];

            for (let i = pool.length - 1; i > 0; i -= 1) {
              const j = Math.floor(rng() * (i + 1));
              [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            const pitchCount = 3 + Math.floor(rng() * 3);
            const selected = pool.slice(0, pitchCount);
            const rawWeights = selected.map(() => 0.15 + rng());
            const weightTotal = rawWeights.reduce((sum, value) => sum + value, 0);

            return freeze(
              selected.map((pitch, index) => {
                const velocity =
                  pitch.minVelocity +
                  rng() * (pitch.maxVelocity - pitch.minVelocity);
                return {
                  pitchType: pitch.pitchType,
                  season: Number(season),
                  level: String(level),
                  usage: rawWeights[index] / weightTotal,
                  velocityMph: Number(velocity.toFixed(2)),
                  velocitySdMph: Number((0.6 + rng() * 2.2).toFixed(2)),
                  movement: null,
                  whiff: null,
                  location: null,
                  samples: null,
                  sourceId: GENERATED_SOURCE_ID,
                  generated: true
                };
              })
            );
          }

          function selectPitchFromArsenal({
            arsenal,
            seed = "",
            state,
            pitcherId,
            batterId
          } = {}) {
            const eligible = (arsenal ?? []).filter(
              (row) =>
                Number.isFinite(Number(row?.velocityMph)) &&
                Number(row.velocityMph) >= 55 &&
                Number(row.velocityMph) <= 110
            );
            if (!eligible.length) return null;

            const total = eligible.reduce(
              (sum, row) => sum + Math.max(0, Number(row.usage ?? 0)),
              0
            );
            const key = [
              seed,
              state?.gameId ?? "",
              state?.plateAppearances ?? 0,
              pitcherId ?? "",
              batterId ?? ""
            ].join(":");
            let roll = fnv1aUnit(key);

            for (let index = 0; index < eligible.length; index += 1) {
              const row = eligible[index];
              const probability =
                total > 0
                  ? Math.max(0, Number(row.usage ?? 0)) / total
                  : 1 / eligible.length;

              if (roll < probability || index === eligible.length - 1) {
                return freeze({
                  pitchType: row.pitchType,
                  velocityMph: Number(row.velocityMph),
                  usage: probability,
                  season: row.season,
                  level: row.level,
                  sourceId: row.sourceId,
                  generated: row.generated === true
                });
              }
              roll -= probability;
            }

            return null;
          }

          function createProductionPitchSelectionResolver({
            seed = ""
          } = {}) {
            return ({ state, pitcherId, batterId, pitcher }) =>
              selectPitchFromArsenal({
                arsenal: pitcher?.pitchArsenal ?? [],
                seed,
                state,
                pitcherId,
                batterId
              });
          }

          export {
            GENERATED_SOURCE_ID,
            normalizePitchArsenalRows,
            normalizeAnyLevelPitchArsenalRows,
            buildProductionPitchArsenalIndex,
            createGeneratedRandomArsenal,
            selectPitchFromArsenal,
            createProductionPitchSelectionResolver
          };
          JS

          node --check src/services/productionPitchArsenal.js

      - name: Install deterministic player style fallbacks
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail

          cat > src/services/productionStyleFallback.js <<'JS'
          function freeze(value) {
            if (Array.isArray(value)) return Object.freeze(value.map(freeze));
            if (value && typeof value === "object") {
              return Object.freeze(
                Object.fromEntries(
                  Object.entries(value).map(([key, item]) => [key, freeze(item)])
                )
              );
            }
            return value;
          }

          function fnv1a32(text) {
            let hash = 0x811c9dc5;
            for (let i = 0; i < text.length; i += 1) {
              hash ^= text.charCodeAt(i);
              hash = Math.imul(hash, 0x01000193) >>> 0;
            }
            return hash >>> 0;
          }

          function mulberry32(seed) {
            let state = seed >>> 0;
            return () => {
              state = (state + 0x6d2b79f5) >>> 0;
              let t = state;
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 0x100000000;
            };
          }

          function randomInt(rng, min, max) {
            return min + Math.floor(rng() * (max - min + 1));
          }

          function rngFor(seed, playerId, namespace) {
            return mulberry32(
              fnv1a32(
                `PRODUCTION_STYLE_FALLBACK_V1:${namespace}:${seed}:${playerId}`
              )
            );
          }

          function createGeneratedHitterStyle({
            seed = "",
            playerId
          } = {}) {
            const id = String(playerId ?? "");
            if (!id) {
              throw new TypeError(
                "generated hitter style에는 playerId가 필요합니다."
              );
            }
            const rng = rngFor(seed, id, "HITTER");
            return freeze({
              source: "GENERATED_RANDOM_FALLBACK",
              version: 1,
              launchTendency: randomInt(rng, 30, 70),
              sprayPull: randomInt(rng, 28, 72),
              sprayCenter: randomInt(rng, 32, 68),
              sprayOppo: randomInt(rng, 28, 72)
            });
          }

          function createGeneratedPitcherStyle({
            seed = "",
            playerId
          } = {}) {
            const id = String(playerId ?? "");
            if (!id) {
              throw new TypeError(
                "generated pitcher style에는 playerId가 필요합니다."
              );
            }
            const rng = rngFor(seed, id, "PITCHER");
            return freeze({
              source: "GENERATED_RANDOM_FALLBACK",
              version: 1,
              holdRunner: randomInt(rng, 30, 70),
              fielding: randomInt(rng, 32, 68),
              reaction: randomInt(rng, 32, 68),
              armStrength: randomInt(rng, 42, 78),
              armAccuracy: randomInt(rng, 32, 68)
            });
          }

          export {
            createGeneratedHitterStyle,
            createGeneratedPitcherStyle
          };
          JS

          node --check src/services/productionStyleFallback.js

      - name: Attach current-level arsenal to real pitchers
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/services/productionSeasonFactory.js')
          s = p.read_text(encoding='utf-8')

          import_line = (
              'import { buildProductionPitchArsenalIndex, '
              'createGeneratedRandomArsenal } '
              'from "./productionPitchArsenal.js";\n'
          )
          if import_line not in s:
              anchor = (
                  'import { inferRealPlayerPotentialProfile } '
                  'from "../data/realWorldPotential.js";\n'
              )
              assert anchor in s
              s = s.replace(anchor, anchor + import_line, 1)

          style_import = (
              'import { createGeneratedHitterStyle, '
              'createGeneratedPitcherStyle } '
              'from "./productionStyleFallback.js";\n'
          )
          if style_import not in s:
              assert import_line in s
              s = s.replace(import_line, import_line + style_import, 1)

          hitter_head = (
              'function engineHitter(player, inference, { seed = "" } = {}) {\n'
              '  const r = inference?.ratings ?? {};\n'
              '  const primaryPosition = normalizePosition(player.position);'
          )
          hitter_head_new = (
              'function engineHitter(player, inference, { seed = "" } = {}) {\n'
              '  const r = inference?.ratings ?? {};\n'
              '  const primaryPosition = normalizePosition(player.position);\n'
              '  const style = createGeneratedHitterStyle({ '
              'seed, playerId: String(player.id) });'
          )
          if 'const style = createGeneratedHitterStyle({' not in s:
              assert hitter_head in s
              s = s.replace(hitter_head, hitter_head_new, 1)

          hitter_tendencies = (
              '    launchTendency: 50, sprayPull: 50, '
              'sprayCenter: 50, sprayOppo: 50,'
          )
          hitter_tendencies_new = (
              '    launchTendency: style.launchTendency, '
              'sprayPull: style.sprayPull, '
              'sprayCenter: style.sprayCenter, '
              'sprayOppo: style.sprayOppo,'
          )
          if 'launchTendency: style.launchTendency' not in s:
              assert hitter_tendencies in s
              s = s.replace(
                  hitter_tendencies,
                  hitter_tendencies_new,
                  1
              )

          old_sig = (
              'function enginePitcher(player, inference, { seed = "" } = {}) {'
          )
          new_sig = (
              'function enginePitcher(player, inference, '
              '{ seed = "", pitchArsenal = [] } = {}) {'
          )
          if new_sig not in s:
              assert old_sig in s
              s = s.replace(old_sig, new_sig, 1)

          pitcher_head = (
              new_sig + '\n'
              '  const r = inference?.ratings ?? {};'
          )
          pitcher_head_new = (
              new_sig + '\n'
              '  const r = inference?.ratings ?? {};\n'
              '  const style = createGeneratedPitcherStyle({ '
              'seed, playerId: String(player.id) });'
          )
          if 'const style = createGeneratedPitcherStyle({' not in s:
              assert pitcher_head in s
              s = s.replace(pitcher_head, pitcher_head_new, 1)

          pitcher_defaults = (
              '    stamina: clampRating(r.stamina), '
              'role: inference?.role ?? "RP", '
              'fielding: 50, reaction: 50, '
              'armStrength: 55, armAccuracy: 50'
          )
          pitcher_defaults_new = (
              '    stamina: clampRating(r.stamina), '
              'role: inference?.role ?? "RP", '
              'holdRunner: style.holdRunner, '
              'fielding: style.fielding, '
              'reaction: style.reaction, '
              'armStrength: style.armStrength, '
              'armAccuracy: style.armAccuracy'
          )
          if 'holdRunner: style.holdRunner' not in s:
              assert pitcher_defaults in s
              s = s.replace(
                  pitcher_defaults,
                  pitcher_defaults_new,
                  1
              )

          old_return = (
              '  return freeze({ ...engine, ...productionFacts(player, hiddenDevelopmentPrior) });\n'
              '}\n\nfunction positionFit'
          )
          new_return = (
              '  return freeze({ ...engine, pitchArsenal, '
              '...productionFacts(player, hiddenDevelopmentPrior) });\n'
              '}\n\nfunction positionFit'
          )
          if 'return freeze({ ...engine, pitchArsenal,' not in s:
              assert old_return in s
              s = s.replace(old_return, new_return, 1)

          old_roster_sig = (
              'function createProductionRoster(team, snapshotPlayers, universe, '
              'inferenceById, { userPlayer = null, userPlayerName = null, '
              'seed = "" } = {}) {'
          )
          new_roster_sig = (
              'function createProductionRoster(team, snapshotPlayers, universe, '
              'inferenceById, { userPlayer = null, userPlayerName = null, '
              'seed = "", pitchArsenalIndex = new Map() } = {}) {'
          )
          if new_roster_sig not in s:
              assert old_roster_sig in s
              s = s.replace(old_roster_sig, new_roster_sig, 1)

          old_engine_pitcher = (
              '    enginePlayers[String(player.id)] = '
              'enginePitcher(player, inferenceById.get(String(player.id)), { seed });'
          )
          new_engine_pitcher = (
              '    const realPitchArsenal = pitchArsenalIndex.get('
              '`${String(team.level)}:${String(player.id)}`) '
              '?? pitchArsenalIndex.get(`*:${String(player.id)}`) '
              '?? [];\n'
              '    const pitchArsenal = realPitchArsenal.length '
              '? realPitchArsenal : createGeneratedRandomArsenal({ '
              'playerId: String(player.id), seed, level: String(team.level), '
              'season: universe.sourceSnapshot?.season ?? 2026 });\n'
              '    enginePlayers[String(player.id)] = '
              'enginePitcher(player, inferenceById.get(String(player.id)), '
              '{ seed, pitchArsenal });'
          )
          if 'const realPitchArsenal = pitchArsenalIndex.get(' not in s:
              assert old_engine_pitcher in s
              s = s.replace(old_engine_pitcher, new_engine_pitcher, 1)

          old_level_sig = (
              'function createLevelLeague({ universe, level, selectedOrgId, '
              'startDate, inferenceById, userPlayer = null, userPlayerName = null, '
              'userLevel = null, seed = "" }) {'
          )
          new_level_sig = (
              'function createLevelLeague({ universe, level, selectedOrgId, '
              'startDate, inferenceById, pitchArsenalIndex, userPlayer = null, '
              'userPlayerName = null, userLevel = null, seed = "" }) {'
          )
          if new_level_sig not in s:
              assert old_level_sig in s
              s = s.replace(old_level_sig, new_level_sig, 1)

          old_call = (
              '    return [String(team.id), createProductionRoster(team, '
              'universe.data.players, universe, inferenceById, '
              '{ userPlayer: insertUser ? userPlayer : null, userPlayerName, seed })];'
          )
          new_call = (
              '    return [String(team.id), createProductionRoster(team, '
              'universe.data.players, universe, inferenceById, '
              '{ userPlayer: insertUser ? userPlayer : null, userPlayerName, '
              'seed, pitchArsenalIndex })];'
          )
          if 'seed, pitchArsenalIndex })];' not in s:
              assert old_call in s
              s = s.replace(old_call, new_call, 1)

          inference_line = (
              '  const inferenceById = new Map((universe.inference?.players ?? [])'
              '.map((row) => [String(row.playerId), row]));\n'
          )
          arsenal_line = inference_line + (
              '  const pitchArsenalIndex = buildProductionPitchArsenalIndex(\n'
              '    universe.data.pitchArsenal ?? [],\n'
              '    { season: universe.sourceSnapshot?.season ?? 2026 }\n'
              '  );\n'
          )
          if 'const pitchArsenalIndex = buildProductionPitchArsenalIndex(' not in s:
              assert inference_line in s
              s = s.replace(inference_line, arsenal_line, 1)

          old_level_call = (
              '    levelLeagues[level] = createLevelLeague({ universe, level, '
              'selectedOrgId, startDate, inferenceById, userPlayer, '
              'userPlayerName: careerPlan.identity.name, userLevel, seed });'
          )
          new_level_call = (
              '    levelLeagues[level] = createLevelLeague({ universe, level, '
              'selectedOrgId, startDate, inferenceById, pitchArsenalIndex, '
              'userPlayer, userPlayerName: careerPlan.identity.name, userLevel, seed });'
          )
          if 'inferenceById, pitchArsenalIndex, userPlayer' not in s:
              assert old_level_call in s
              s = s.replace(old_level_call, new_level_call, 1)

          p.write_text(s, encoding='utf-8')
          PY

          node --check src/services/productionSeasonFactory.js

      - name: Carry selected pitch type and velocity through PA context
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/engine/player/playerContextResolver.js')
          s = p.read_text(encoding='utf-8')

          old = (
              '    const selectedPitchVelocityMph = '
              'resolvePitchVelocity({ ...args, pitcherProfile });\n\n'
              '    return buildPAContext({'
          )
          new = (
              '    const selectedPitch = '
              'resolvePitchVelocity({ ...args, pitcherProfile });\n'
              '    const selectedPitchVelocityMph = '
              'selectedPitch && typeof selectedPitch === "object" '
              '? selectedPitch.velocityMph ?? null : selectedPitch;\n'
              '    const selectedPitchType = '
              'selectedPitch && typeof selectedPitch === "object" '
              '? selectedPitch.pitchType ?? null : null;\n\n'
              '    return buildPAContext({'
          )
          if 'const selectedPitchType =' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old_pitcher = (
              '      pitcher: { ...pitcherProfile, '
              'pitchVelocityMph: selectedPitchVelocityMph },'
          )
          new_pitcher = (
