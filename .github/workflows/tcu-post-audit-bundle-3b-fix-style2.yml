      - name: Install Production arsenal runtime verifier
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail

          cat > scripts/verify-production-pitch-arsenal.mjs <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import zlib from "node:zlib";
          import assert from "node:assert/strict";
          import { fileURLToPath } from "node:url";
          import { seasonApi } from "../src/api/seasonApi.js";
          import { gameApi } from "../src/api/gameApi.js";
          import {
            createSeasonGameFixture
          } from "../src/services/demoSeasonFactory.js";
          import {
            createSeasonGameContextResolver,
            simulateSeasonFixtureGame
          } from "../src/services/seasonGameService.js";
          import {
            GENERATED_SOURCE_ID,
            createGeneratedRandomArsenal,
            normalizeAnyLevelPitchArsenalRows,
            selectPitchFromArsenal
          } from "../src/services/productionPitchArsenal.js";
          import {
            getCurrentBatterId,
            getCurrentPitcherId
          } from "../src/engine/game/gameState.js";

          const SCRIPT_DIR = path.dirname(fileURLToPath(import.meta.url));
          const WORK_ROOT = path.resolve(SCRIPT_DIR, "..");
          const SNAPSHOT_REL =
            "data/the_call_up_snapshot_v3/mlb-milb-2026-production-v3.json.gz";

          function readSnapshot() {
            return JSON.parse(
              zlib.gunzipSync(
                fs.readFileSync(path.resolve(WORK_ROOT, SNAPSHOT_REL))
              ).toString("utf8")
            );
          }

          function careerInput(organizationId) {
            return {
              name: "Pitch Arsenal QA",
              nationality: "대한민국",
              hometown: "구미",
              age: 18,
              heightCm: 180,
              weightKg: 78,
              bodyType: "ATHLETIC",
              bats: "R",
              throws: "R",
              primaryPosition: "SS",
              archetype: "BALANCED",
              visibleTraits: ["QUICK_BAT", "SOFT_HANDS"],
              organizationMode: "FAVORITE",
              favoriteOrganizationId: String(organizationId)
            };
          }

          function outputPath() {
            const hit = process.argv
              .slice(2)
              .find((arg) => arg.startsWith("--output="));
            return path.resolve(
              WORK_ROOT,
              hit
                ? hit.slice("--output=".length)
                : "reports/production-pitch-arsenal-v1.json"
            );
          }

          function allRosterPitchers(fixture, level) {
            const league = fixture.levelLeagues[level];
            const out = [];
            for (const roster of Object.values(league.rosters)) {
              for (const id of roster.pitchers ?? []) {
                const player = roster.players[id];
                if (player) out.push(player);
              }
            }
            return out;
          }

          function findGameWithArsenalPitcher(fixture) {
            const league = fixture.levelLeagues.MLB;
            for (const game of league.schedule.slice(0, 500)) {
              const gf = createSeasonGameFixture({
                seasonFixture: fixture,
                scheduleGame: game,
                level: "MLB"
              });
              const pitcherId =
                getCurrentPitcherId(gf.initialState);
              const pitcher = gf.players[pitcherId];
              if (
                Array.isArray(pitcher?.pitchArsenal) &&
                pitcher.pitchArsenal.some(
                  (row) => Number.isFinite(Number(row.velocityMph))
                )
              ) {
                return gf;
              }
            }
            return null;
          }

          function buildReport() {
            const snapshot = readSnapshot();
            const catalog = seasonApi.getCareerCreationCatalog({
              masterSnapshot: snapshot
            });
            const created = seasonApi.createCareerSeason({
              seed: "post-audit-pitch-arsenal-v1",
              input: careerInput(catalog.organizations[0].id),
              masterSnapshot: snapshot
            });
            const payload = seasonApi.serializeSeason(created.seasonId);

            const mlbPitchers = allRosterPitchers(payload.fixture, "MLB");
            const aaaPitchers = allRosterPitchers(payload.fixture, "AAA");

            const mlbWithArsenal = mlbPitchers.filter(
              (p) => p.pitchArsenal?.length
            );
            const aaaWithArsenal = aaaPitchers.filter(
              (p) => p.pitchArsenal?.length
            );

            assert.equal(mlbWithArsenal.length, mlbPitchers.length);
            assert.equal(aaaWithArsenal.length, aaaPitchers.length);

            const isGenerated = (player) =>
              player.pitchArsenal?.some(
                (row) => row.sourceId === GENERATED_SOURCE_ID
              );
            const mlbGenerated = mlbPitchers.filter(isGenerated);
            const aaaGenerated = aaaPitchers.filter(isGenerated);
            const mlbReal = mlbPitchers.filter(
              (p) => p.pitchArsenal?.length && !isGenerated(p)
            );
            const aaaReal = aaaPitchers.filter(
              (p) => p.pitchArsenal?.length && !isGenerated(p)
            );

            const realSourceIds = new Set(
              snapshot.pitchArsenal.map(
                (row) => String(row.playerId)
              )
            );
            const currentPitchers = [
              ...mlbPitchers,
              ...aaaPitchers
            ];
            const expectedRealCurrentIds = new Set(
              currentPitchers
                .map((player) => String(player.id))
                .filter((id) => realSourceIds.has(id))
            );
            const actualRealCurrentIds = new Set(
              currentPitchers
                .filter((player) => !isGenerated(player))
                .map((player) => String(player.id))
            );

            assert.deepEqual(
              [...actualRealCurrentIds].sort(),
              [...expectedRealCurrentIds].sort(),
              "Every current pitcher with REAL source arsenal must use REAL before generated fallback"
            );
            assert.ok(
              mlbGenerated.length > 0 || aaaGenerated.length > 0,
              "Current rosters should exercise generated arsenal fallback"
            );

            const sourceProbeId = [...realSourceIds].find((id) => {
              const arsenal = normalizeAnyLevelPitchArsenalRows(
                snapshot.pitchArsenal,
                { playerId: id, season: 2026 }
              );
              return arsenal.filter(
                (row) => Number.isFinite(Number(row.velocityMph))
              ).length >= 2;
            });
            assert.ok(
              sourceProbeId,
              "No multi-pitch REAL source arsenal found"
            );
            const sourceProbeArsenal =
              normalizeAnyLevelPitchArsenalRows(
                snapshot.pitchArsenal,
                { playerId: sourceProbeId, season: 2026 }
              );
            assert.ok(sourceProbeArsenal.length >= 2);
            assert.ok(
              sourceProbeArsenal.every(
                (row) =>
                  row.generated === false &&
                  row.sourceId !== GENERATED_SOURCE_ID
              )
            );

            const generatedA = createGeneratedRandomArsenal({
              playerId: "NO_REAL_DATA_TEST",
              seed: "generated-fallback-test",
              level: "AA",
              season: 2026
            });
            const generatedB = createGeneratedRandomArsenal({
              playerId: "NO_REAL_DATA_TEST",
              seed: "generated-fallback-test",
              level: "AA",
              season: 2026
            });
            assert.deepEqual(generatedA, generatedB);
            assert.ok(generatedA.length >= 3 && generatedA.length <= 5);
            assert.ok(
              Math.abs(
                generatedA.reduce((sum, row) => sum + row.usage, 0) - 1
              ) < 1e-9
            );
            assert.ok(
              generatedA.every(
                (row) =>
                  row.sourceId === GENERATED_SOURCE_ID &&
                  row.generated === true &&
                  Number.isFinite(row.velocityMph)
              )
            );

            const probe = {
              id: sourceProbeId,
              pitchArsenal: sourceProbeArsenal
            };

            const usageSum = probe.pitchArsenal.reduce(
              (sum, row) => sum + Number(row.usage ?? 0),
              0
            );
            assert.ok(Math.abs(usageSum - 1) < 1e-9);

            const selections = new Map();
            for (let pa = 0; pa < 1000; pa += 1) {
              const pick = selectPitchFromArsenal({
                arsenal: probe.pitchArsenal,
                seed: "arsenal-usage-qa",
                state: {
                  gameId: "ARSENAL_USAGE_QA",
                  plateAppearances: pa
                },
                pitcherId: probe.id,
                batterId: `B${pa % 9}`
              });
              assert.ok(pick);
              assert.ok(
                probe.pitchArsenal.some(
                  (row) =>
                    row.pitchType === pick.pitchType &&
                    Number(row.velocityMph) ===
                      Number(pick.velocityMph)
                )
              );
              selections.set(
                pick.pitchType,
                (selections.get(pick.pitchType) ?? 0) + 1
              );
            }

            const repeatedA = selectPitchFromArsenal({
              arsenal: probe.pitchArsenal,
              seed: "determinism",
              state: { gameId: "G1", plateAppearances: 17 },
              pitcherId: probe.id,
              batterId: "B1"
            });
            const repeatedB = selectPitchFromArsenal({
              arsenal: probe.pitchArsenal,
              seed: "determinism",
              state: { gameId: "G1", plateAppearances: 17 },
              pitcherId: probe.id,
              batterId: "B1"
            });
            assert.deepEqual(repeatedA, repeatedB);

            const gameFixture = findGameWithArsenalPitcher(
              payload.fixture
            );
            assert.ok(gameFixture);

            const pitcherId =
              getCurrentPitcherId(gameFixture.initialState);
            const pitcher = gameFixture.players[pitcherId];
            const resolver =
              createSeasonGameContextResolver(gameFixture);
            const context = resolver({
              state: gameFixture.initialState,
              batterId:
                getCurrentBatterId(gameFixture.initialState),
              pitcherId
            });

            assert.ok(context.pitcher.pitchType);
            assert.ok(
              Number.isFinite(context.pitcher.pitchVelocityMph)
            );
            assert.ok(
              pitcher.pitchArsenal.some(
                (row) =>
                  row.pitchType === context.pitcher.pitchType &&
                  Number(row.velocityMph) ===
                    Number(context.pitcher.pitchVelocityMph)
              )
            );

            const fast = simulateSeasonFixtureGame(gameFixture, {
              seed: "arsenal-fast",
              mode: "FAST"
            });
            const detailed = simulateSeasonFixtureGame(gameFixture, {
              seed: "arsenal-detailed",
              mode: "DETAILED"
            });
            assert.equal(fast.state.status, "FINAL");
            assert.equal(detailed.state.status, "FINAL");

            const probeFixture = Object.freeze({
              ...gameFixture,
              userPlayerId:
                gameFixture.initialState.lineups.away[0],
              userTeam: "away"
            });

            const view = gameApi.createGameFromFixture({
              fixture: probeFixture,
              seed: "arsenal-interactive"
            });
            const played = gameApi.playUserPA(
              view.gameId,
              "BALANCED"
            );
            const selectedType =
              played.lastUserPA?.paResult?.selectedPitchType ??
              null;
            const selectedVelocity =
              played.lastUserPA?.paResult
                ?.selectedPitchVelocityMph ?? null;
            gameApi.closeGame(view.gameId);

            assert.ok(selectedType);
            assert.ok(Number.isFinite(selectedVelocity));

            return {
              schema: "THE_CALL_UP_PRODUCTION_PITCH_ARSENAL_V1",
              pass: true,
              snapshotHash: snapshot.metadata.contentHash,
              sourceCoverage: {
                rows: snapshot.pitchArsenal.length,
                players: new Set(
                  snapshot.pitchArsenal.map(
                    (row) => String(row.playerId)
                  )
                ).size
              },
              runtimeCoverage: {
                mlbPitchers: mlbPitchers.length,
                aaaPitchers: aaaPitchers.length,
                mlbPitchersWithArsenal: mlbWithArsenal.length,
                aaaPitchersWithArsenal: aaaWithArsenal.length,
                mlbRealArsenal: mlbReal.length,
                aaaRealArsenal: aaaReal.length,
                expectedRealCurrentPitchers:
                  expectedRealCurrentIds.size,
                actualRealCurrentPitchers:
                  actualRealCurrentIds.size,
                mlbGeneratedRandomArsenal: mlbGenerated.length,
                aaaGeneratedRandomArsenal: aaaGenerated.length
              },
              generatedFallbackSample: generatedA.map((row) => ({
                pitchType: row.pitchType,
                usage: row.usage,
                velocityMph: row.velocityMph,
                sourceId: row.sourceId
              })),
              probePitcher: {
                id: probe.id,
                sourceMode: "REAL_SOURCE_ANY_LEVEL",
                pitchCount: probe.pitchArsenal.length,
                arsenal: probe.pitchArsenal.map((row) => ({
                  pitchType: row.pitchType,
                  usage: row.usage,
                  velocityMph: row.velocityMph
                })),
                selectionCounts1000: Object.fromEntries(
                  [...selections.entries()].sort()
                )
              },
              liveContext: {
                pitcherId,
                pitchType: context.pitcher.pitchType,
                velocityMph:
                  context.pitcher.pitchVelocityMph
              },
              interactive: {
                selectedPitchType: selectedType,
                selectedPitchVelocityMph: selectedVelocity
              },
              deterministicSelection: true,
              fastGamePass: true,
              detailedGamePass: true
            };
          }

          function main() {
            const report = buildReport();
            const out = outputPath();
            fs.mkdirSync(path.dirname(out), { recursive: true });
            fs.writeFileSync(
              out,
              JSON.stringify(report, null, 2) + "\n"
            );
            process.stdout.write(
              JSON.stringify(report, null, 2) + "\n"
            );
          }

          if (
            path.resolve(process.argv[1] ?? "") ===
            fileURLToPath(import.meta.url)
          ) {
            try {
              main();
            } catch (error) {
              console.error(error);
              process.exitCode = 1;
            }
          }

          export { buildReport };
          JS

          node --check scripts/verify-production-pitch-arsenal.mjs

      - name: Install player style fallback verifier
        shell: bash
