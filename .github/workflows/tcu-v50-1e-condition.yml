name: THE CALL-UP v50.1e Condition Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v50-1e-condition.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  condition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v50.1e baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/scripts/verify-season-condition.js)" = "fa1b2c93e8e93ba2f4bb5e39ec09120b7c3ea0d7"
          test "$(git hash-object work/src/engine/season/playerSeasonState.js)" = "0ded8626d5cc9605619a6b32990e65eb93bd5034"
          test "$(git hash-object work/src/engine/season/injuryState.js)" = "b2adddf0bd5fbd3dd85b0bd20682dd1f2ccd0d20"
          test "$(git hash-object work/src/api/seasonApi.js)" = "ae3f22620b054788e9d9fae8b5f0c6604445c2f4"
          test -f work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz

      - name: Modernize condition verifier
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/scripts/verify-season-condition.js
          node --check work/scripts/verify-season-condition.js

      - name: Focused injury fatigue form regression
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-season-condition.js --verify --output=reports/v50-1e-condition-regression.json
          cat reports/v50-1e-condition-regression.json

      - name: Commit verified v50.1e
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/scripts/verify-season-condition.js work/reports/v50-1e-condition-regression.json
          git rm .github/workflows/tcu-v50-1e-condition.yml
          git commit -m "v50.1e: modernize injury fatigue form regression [skip ci]"
          git push origin HEAD:main

      - name: Upload v50.1e report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: the-call-up-v50-1e-condition
          path: work/reports/v50-1e-condition-regression.json
          if-no-files-found: ignore
