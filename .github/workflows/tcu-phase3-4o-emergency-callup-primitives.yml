name: THE CALL-UP Phase 3 4O Emergency Call-up Foundation

on:
  push:
    paths:
      - '.github/workflows/tcu-phase3-4o-emergency-callup-primitives.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emergency-callup-primitives:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
