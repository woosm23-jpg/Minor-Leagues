name: THE CALL-UP v58 Retirement Hall of Fame Bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcu-v58-retirement-hof-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v58:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v57 baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/src/api/seasonApi.js)" = "be22179da6d67810717c37c7783cd16537d05884"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "147e7221961a44082c60a6fd4ea0b3cf1478151c"
          test "$(git hash-object work/src/services/productionOffseasonEcology.js)" = "80d38d60e126b4346af50a7f8aff618f77d7d502"
          test "$(git hash-object work/src/engine/career/retirementSystem.js)" = "e1a22018f8ef54300565d925eec12871830e7f98"
          test "$(git hash-object work/src/engine/career/postseasonHistory.js)" = "bdf280bd59f721bb8e5f2a8625fe4795e05e267f"
          test "$(git hash-object work/src/ui/seasonRender.js)" = "701370e0e79270953e9de524b0d1702b886c6dc5"
          test "$(git hash-object work/src/app/seasonApp.js)" = "70e086d721619cadd05186291c4cc9fa3aa797c4"
          test "$(git hash-object work/README_KO.md)" = "f79275f59ffe9f6d3ac9b69db66dcf335b0bdbe0"
          test "$(git hash-object work/reports/v57-draft-international-checkpoint.json)" = "0a864e54a3fea6c5454048197e27934c171631b7"

      - name: Apply v58 Retirement Hall implementation
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/src/engine/career work/scripts work/reports
          echo '' | base64 -d > work/src/engine/career/retirementHallOfFame.js
          echo '' | base64 -d > work/scripts/verify-v58-retirement-hof.mjs
          echo '' | base64 -d > work/scripts/browser-v58-retirement-hof.py
          echo '' | base64 -d > /tmp/patch-v58.py
          python3 -m py_compile /tmp/patch-v58.py
          python3 /tmp/patch-v58.py
          node --check work/src/engine/career/retirementHallOfFame.js
          node --check work/src/services/seasonSerialization.js
          node --check work/src/services/productionOffseasonEcology.js
          node --check work/src/api/seasonApi.js
          node --check work/src/ui/seasonRender.js
          node --check work/src/app/seasonApp.js
          node --check work/scripts/verify-v58-retirement-hof.mjs
          python3 -m py_compile work/scripts/browser-v58-retirement-hof.py
          grep -q 'full_career_retirement_hof_v58' work/src/api/seasonApi.js
          grep -q 'ruleset_2026_hall_of_fame' work/src/engine/career/retirementHallOfFame.js
          grep -q 'Hall of Fame' work/src/ui/seasonRender.js

      - name: v58 focused gate
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v58-retirement-hof.mjs
          cat reports/v58-retirement-hof-gate.json

      - name: v57 draft international regression
        id: v57
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v57-draft-international.mjs

      - name: v56 postseason awards history regression
        id: v56
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v56-postseason-awards-history.mjs

      - name: v55 full offseason regression
        id: v55
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v55-full-offseason.mjs

      - name: v55.1 performance regression
        id: perf
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v55-1-performance.mjs

      - name: Build v58 Production standalone
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs --output=dist/THE_CALL_UP_SEASON_STANDALONE_v58_PRODUCTION.html --master-snapshot=/tmp/tcu-production-v2.json
          python3 - <<'PY2'
          from pathlib import Path
          p=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v58_PRODUCTION.html")
          s=p.read_text(encoding="utf-8")
          for old in ["Season v57","Season v56","Season v55.1 PERFORMANCE","Season v55","Season v49"]:
              s=s.replace(old,"Season v58")
          p.write_text(s,encoding="utf-8")
          assert p.stat().st_size > 1_000_000
          for needle in ["full_career_retirement_hof_v58","ruleset_2026_hall_of_fame","Hall of Fame","ANNOUNCE_FINAL_SEASON"]:
              assert needle in s, needle
          PY2

      - name: Install isolated Playwright
        id: playwright
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-v58-browser
          source /tmp/tcu-v58-browser/bin/activate
          python -m pip install --upgrade pip
          pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: v58 mobile browser and interaction performance
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tcu-v58-browser/bin/activate
          cd work
          python scripts/browser-v58-retirement-hof.py
          cat reports/v58-browser-smoke.json

      - name: v58 checkpoint report
        id: checkpoint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY2'
          import hashlib,json
          from pathlib import Path
          focused=json.loads(Path("reports/v58-retirement-hof-gate.json").read_text())
          browser=json.loads(Path("reports/v58-browser-smoke.json").read_text())
          perf=json.loads(Path("reports/v55-1-performance-gate.json").read_text())
          assert focused["pass"] and browser["pass"] and perf["pass"]
          html=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v58_PRODUCTION.html")
          data=html.read_bytes()
          report={
            "schema":"THE_CALL_UP_V58_RETIREMENT_HOF_CHECKPOINT",
            "pass":True,
            "rules":focused["rules"],
            "features":{
              "aiRetirementPressure":True,
              "userNeverForcedByRng":True,
              "finalSeasonAnnouncement":True,
              "careerLedger":True,
              "retiredPlayerArchive":True,
              "retirementReportNoGrade":True,
              "bbwAAElection":True,
              "contemporaryEraPlayers":True,
              "bestSevenPeak":True,
              "ballotCompetition":True,
              "saveRestore":True,
              "mobileHistoryUi":True
            },
            "knownLimits":{
              "pre2026RealCareerTotals":"SOURCE_SNAPSHOT_HAS_NO_FULL_PRE2026_CAREER_LEDGER",
              "careerEarningsAndMinorLeagueHistoricalRanks":"DEFERRED_UNTIL_PERSISTENT_ALL_LEVEL_RECORD_LEDGER",
              "eraCommitteeHistoricalCandidateSet":"SAVE_WORLD_ONLY"
            },
            "performance":{
              "getSeasonWarmAverageMs":perf["timingsMs"]["getSeasonWarmAverage"],
              "browserInteractionMs":browser["timingsMs"]
            },
            "regression":{"v57DraftInternational":True,"v56PostseasonAwardsHistory":True,"v55FullOffseason":True,"v55_1Performance":True},
            "standalone":{"filename":html.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()},
            "next":"v59 Long-run Stress"
          }
          Path("reports/v58-retirement-hof-checkpoint.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY2

      - name: Aggregate v58 validation outcomes
        id: aggregate
        if: always()
        shell: bash
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          V57: ${{ steps.v57.outcome }}
          V56: ${{ steps.v56.outcome }}
          V55: ${{ steps.v55.outcome }}
          PERF: ${{ steps.perf.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          CHECKPOINT: ${{ steps.checkpoint.outcome }}
        run: |
          set -euo pipefail
          printf '%-14s %s\n' BASELINE "$BASELINE" PATCH "$PATCH" FOCUSED "$FOCUSED" V57 "$V57" V56 "$V56" V55 "$V55" PERF "$PERF" BUILD "$BUILD" PLAYWRIGHT "$PLAYWRIGHT" BROWSER "$BROWSER" CHECKPOINT "$CHECKPOINT"
          for value in "$BASELINE" "$PATCH" "$FOCUSED" "$V57" "$V56" "$V55" "$PERF" "$BUILD" "$PLAYWRIGHT" "$BROWSER" "$CHECKPOINT"; do
            test "$value" = "success"
          done

      - name: Commit verified v58
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            work/src/engine/career/retirementHallOfFame.js \
            work/src/services/seasonSerialization.js \
            work/src/services/productionOffseasonEcology.js \
            work/src/api/seasonApi.js \
            work/src/ui/seasonRender.js \
            work/src/app/seasonApp.js \
            work/scripts/verify-v58-retirement-hof.mjs \
            work/scripts/browser-v58-retirement-hof.py \
            work/README_KO.md \
            work/reports/v58-retirement-hof-gate.json \
            work/reports/v58-browser-smoke.json \
            work/reports/v58-retirement-hof-checkpoint.json
          git rm -f .github/workflows/tcu-v58-retirement-hof-bundle.yml
          git commit -m "v58: add retirement archive and Hall of Fame voting [skip ci]"
          git push origin HEAD:main

      - name: Upload v58 checkpoint artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v58_RETIREMENT_HOF
          path: |
            work/dist/THE_CALL_UP_SEASON_STANDALONE_v58_PRODUCTION.html
            work/reports/v58-retirement-hof-gate.json
            work/reports/v58-browser-smoke.json
            work/reports/v58-retirement-hof-checkpoint.json
            work/reports/v55-1-performance-gate.json
            work/README_KO.md
          if-no-files-found: ignore
          compression-level: 0
