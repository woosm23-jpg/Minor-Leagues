name: THE CALL-UP Statcast Phase C

on:
  workflow_dispatch:
  push:
    paths:
      - 'fetch_the_call_up_statcast_phase_c.py'
      - '.github/workflows/the-call-up-statcast-phase-c.yml'

concurrency:
  group: the-call-up-statcast-phase-c
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SEASON: '2026'
      TCU_HISTORY_SEASONS: '2024,2025,2026'
      TCU_BASE_SNAPSHOT_GZ: data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz
      TCU_PHASE_C_OUT: data/the_call_up_phase_c
      TCU_FETCH_AAA: '1'
      TCU_MINORS_CHUNK_DAYS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline self-test
        run: python fetch_the_call_up_statcast_phase_c.py --self-test
      - name: Fetch MLB and AAA Statcast Phase C
        run: python fetch_the_call_up_statcast_phase_c.py
      - name: Compress staged patch
        run: gzip -9 -f data/the_call_up_phase_c/statcast-phase-c-2026.json
      - name: Upload staged artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-call-up-statcast-phase-c-2026
          path: |
            data/the_call_up_phase_c/statcast-phase-c-2026.json.gz
            data/the_call_up_phase_c/phase_c_manifest.json
          retention-days: 14
      - name: Commit staged Phase C data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/the_call_up_phase_c/statcast-phase-c-2026.json.gz
          git add data/the_call_up_phase_c/phase_c_manifest.json
          git diff --cached --quiet || git commit -m 'Add staged THE CALL-UP Statcast Phase C data'
          git pull --rebase origin main
          git push origin main
