          from pathlib import Path
          source = Path("src/api/seasonApi.js")
          text = source.read_text(encoding="utf-8")
          old_import = 'import { POSTSEASON_RULESET_2026, POSTSEASON_ROUND_ORDER, createPostseasonState, normalizePostseasonState, getPostseasonPublicView, createHistoryState, normalizeHistoryState, appendSeasonHistory, getHistoryPublicView } from "../engine/career/postseasonHistory.js";'
          new_import = 'import { selectPostseasonRosterPlayerIds } from "../engine/career/postseasonRosterSelection.js";'
          assert text.count(old_import) == 1, "postseasonHistory import has changed; stop without writing"
          if new_import not in text:
              text = text.replace(old_import, old_import + "\n" + new_import, 1)
          start_marker = "function rosterPlayerIdsInOrder(roster,{excludeId=null,forceIncludeId=null}={}){"
          end_marker = "function userPostseasonSelection(session,field){"
          assert text.count(start_marker) == 1 and text.count(end_marker) == 1, "roster selector boundaries changed; stop"
          start, end = text.index(start_marker), text.index(end_marker)
          assert end > start, "roster selector boundaries are reversed"
          old = text[start:end]
          replacement = """function rosterPlayerIdsInOrder(roster,{excludeId=null,forceIncludeId=null}={}){
            return selectPostseasonRosterPlayerIds(roster,{
              excludeId,forceIncludeId,
              rosterSize:POSTSEASON_RULESET_2026.rosterSize,
              maxPitchers:POSTSEASON_RULESET_2026.maxPitchers
            });
          }
          """ + "\n"
          if old != replacement:
              assert "const hitters=[],pitchers=[];" in old and "const ids=[...chosenHitters,...chosenPitchers];" in old, "unexpected selector implementation; stop without writing"
              text = text[:start] + replacement + text[end:]
              source.write_text(text, encoding="utf-8")
              print("Replaced duplicate-prone selector with two-way-safe selection")
          else:
              print("Roster selector already repaired")
          TCU_4H_PATCH_PY
          node --check src/engine/career/postseasonRosterSelection.js
          node --check src/api/seasonApi.js
          node --test tests/postseasonRoster4H.test.js
          node --input-type=module <<'TCU_4H_REAL_ROSTER_SMOKE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import zlib from "node:zlib";
          import { seasonApi } from "./src/api/seasonApi.js";
          import { selectPostseasonRosterPlayerIds } from "./src/engine/career/postseasonRosterSelection.js";
          const path = "data/the_call_up_snapshot_v3/mlb-milb-2026-production-v3.json.gz";
          const snapshot = JSON.parse(zlib.gunzipSync(fs.readFileSync(path)).toString("utf8"));
          assert.equal(snapshot.metadata.contentHash, "fnv1a32:f7b34713");
          const options = seasonApi.getCareerCreationCatalog({ masterSnapshot:snapshot }).organizations;
          const input = { name:"Roster Repair QA", nationality:"대한민국", hometown:"구미", age:18, heightCm:180, weightKg:78, bodyType:"ATHLETIC", bats:"R", throws:"R", primaryPosition:"SS", archetype:"BALANCED", visibleTraits:["QUICK_BAT","SOFT_HANDS"], organizationMode:"FAVORITE", favoriteOrganizationId:String(options[0].id) };
          const season = seasonApi.createCareerSeason({seed:"phase3-4h-roster-smoke",input,masterSnapshot:snapshot});
          const r = seasonApi.serializeSeason(season.seasonId).fixture.levelLeagues.MLB.rosters["121"];
          assert.ok(r, "MLB team 121 roster is required for the failing-case smoke");
          const ids = selectPostseasonRosterPlayerIds(r);
          assert.equal(new Set(ids).size, ids.length);
          assert.ok(ids.length >= 20 && ids.length <= 26);
          assert.ok(ids.filter(id => (r.pitchers ?? []).includes(id)).length <= 13);
