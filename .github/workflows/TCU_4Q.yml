name: THE CALL-UP Phase 3 4Q Scouting and Position Audit

on:
  push:
    paths:
      - '.github/workflows/TCU_4Q.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scouting-position-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 4M and 4P production baselines
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const f=require("node:fs");const m=JSON.parse(f.readFileSync("reports/phase3-development-promotion-audit-4m-v1.json"));const p=JSON.parse(f.readFileSync("reports/phase3-automatic-injury-callup-4p-v1.json"));if(!m.pass||!p.pass||!p.gates.automaticInjuryTrigger||!p.gates.automaticReturn||m.snapshotHash!==p.snapshotHash)process.exit(1);console.log("4M/4P baselines PASS");'
