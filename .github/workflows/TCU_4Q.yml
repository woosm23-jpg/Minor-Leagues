      - name: Test scouting privacy, promotion inputs and positional adaptation
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-phase3-scouting-position-4q.mjs
          node -e 'const r=JSON.parse(require("node:fs").readFileSync("reports/phase3-scouting-position-audit-4q-v1.json"));if(!r.pass||r.promotion.hiddenPotentialInvariancePolicies.length!==6||!r.promotion.realReviewHiddenCeilingInvariant||!r.position.saveRestoreSame||!r.scouting.publicDetailNoHiddenInternalFields)process.exit(1);console.log("4Q targeted audit PASS");'
          git diff --exit-code -- src
          git diff --check
      - name: Preserve existing postseason and production-position coverage
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/postseasonRotation4I.test.js tests/postseasonRoster4H.test.js
          node scripts/verify-production-position-familiarity.mjs --output=/tmp/tcu-4q-production-position.json > /tmp/tcu-4q-production-position.log
          node -e 'const f=require("node:fs");const r=JSON.parse(f.readFileSync("/tmp/tcu-4q-production-position.json"));if(r.pass!==true)process.exit(1);console.log("Production positional source evidence PASS");'
          git diff --exit-code -- src
      - name: Commit verified 4Q audit script and report only
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/verify-phase3-scouting-position-4q.mjs reports/phase3-scouting-position-audit-4q-v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '4Q already committed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'phase3: audit scouting and dynamic position adaptation (4Q)'
            git push origin HEAD:main
          fi
