      - name: Regression check 4O legal policy, normal promotions and postseason units
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-phase3-emergency-callup-primitives-4o.mjs
          node scripts/verify-season-promotion-ai-v22.js --verify --output=/tmp/tcu-4p-prior-promotion.json
          node --test tests/postseasonRotation4I.test.js tests/postseasonRoster4H.test.js
          git diff --exit-code -- reports/phase3-emergency-callup-primitives-4o-v1.json
          git diff --check
      - name: Commit only verified 4P source, isolated test and report
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git add src/api/seasonApi.js src/engine/career/rosterControlState.js scripts/verify-phase3-automatic-injury-callup-4p.mjs reports/phase3-automatic-injury-callup-4p-v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '4P integration already committed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'phase3: integrate automatic MLB injury callups, IL returns and service (4P)'
            git push origin HEAD:main
          fi
