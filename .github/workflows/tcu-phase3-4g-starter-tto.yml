name: THE CALL-UP Phase 3 Bundle 4G Starter TTO

on:
  push:
    paths:
      - '.github/workflows/tcu-phase3-4g-starter-tto.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase3-4g:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and verify Phase 3 Bundle 4G
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/tcu_phase3_4g.py
          python3 -m py_compile /tmp/tcu_phase3_4g.py
          python3 /tmp/tcu_phase3_4g.py
