            work/src/engine/player/playerContextResolver.js \
            work/src/engine/pa/context.js \
            work/src/engine/pa/paEngine.js \
            work/src/services/seasonGameService.js \
            work/src/api/gameApi.js \
            work/scripts/verify-production-pitch-arsenal.mjs \
            work/reports/production-pitch-arsenal-v1.json

          if git diff --cached --quiet; then
            echo "Bundle 3B already installed; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "post-audit: wire real pitch arsenal and velocity into PA runtime"
