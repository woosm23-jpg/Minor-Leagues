      - name: Measure original game start and exact save bytes
        shell: bash
        working-directory: work
        timeout-minutes: 18
        run: |
          set -euo pipefail
          node --expose-gc --max-old-space-size=4096 scripts/perf02-fixture-index.mjs --out=reports/perf02-before.json
      - name: Patch only repeated player lookup for immutable fixture identity
        shell: bash
        working-directory: work
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 scripts/perf02-patch-player-lookup.py
          node --check src/api/seasonApi.js
          git diff --check
      - name: Verify unchanged gameplay, save and regression suite
        shell: bash
        working-directory: work
        timeout-minutes: 12
        run: |
          set -euo pipefail
          npm test
          node scripts/verify-phase8-save-integrity.mjs
      - name: Re-measure and require identical full saves and a faster game start
        shell: bash
        working-directory: work
        timeout-minutes: 18
        run: |
          set -euo pipefail
          node --expose-gc --max-old-space-size=4096 scripts/perf02-fixture-index.mjs --out=reports/perf02-after.json
          node scripts/perf02-compare.mjs
      - name: Verify full 2026 Production v3 10710 games and postseason
        shell: bash
        working-directory: work
        timeout-minutes: 32
        run: |
          set -euo pipefail
          node scripts/verify-phase3-integration-4r.mjs
          node --input-type=module <<'TCU_PERF02_WORLD'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/phase3-integrated-regression-4r-v1.json','utf8'));
          assert.equal(r.pass,true);assert.equal(r.regularSeason.worldGames,10710);assert.ok(r.postseason.championTeamId);assert.ok(Object.values(r.gates).every(Boolean));
          console.log('PERF02 production full-world 2026 and postseason PASS');
          TCU_PERF02_WORLD
      - name: Commit only measured source and reports after all gates pass
        shell: bash
        working-directory: work
        timeout-minutes: 4
        run: |
          set -euo pipefail
          git add src/api/seasonApi.js scripts/perf02-fixture-index.mjs scripts/perf02-compare.mjs reports/perf02-before.json reports/perf02-after.json reports/perf02-player-lookup.json reports/phase3-integrated-regression-4r-v1.json
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No optimized source to commit' >&2; exit 1; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf: cache fixture player lookup and verify exact Production v3 saves'
          git push origin HEAD:main
      - name: Preserve performance measurements if a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_PERF02_LOOKUP_RESULTS
          path: |
            work/reports/perf02-before.json
            work/reports/perf02-after.json
            work/reports/perf02-player-lookup.json
            work/scripts/perf02-fixture-index.mjs
          if-no-files-found: warn
          retention-days: 30
