name: THE CALL-UP 3B Recovery 4

on:
  push:
    paths:
      - '.github/workflows/tcu-3b-recovery4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover 3B
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/recover_3b.py
          python3 -m py_compile /tmp/recover_3b.py
          python3 /tmp/recover_3b.py
