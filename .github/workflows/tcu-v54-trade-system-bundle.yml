name: THE CALL-UP v54 Trade System Bundle
on:
  push:
    branches: [main]
    paths: [".github/workflows/tcu-v54-trade-system-bundle.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  v54-trade-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verify v53 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object work/reports/v53-arbitration-free-agency-checkpoint.json)" = "4074d9d664eb76543f92fa6a5d9ce0b44a606d11"
          test "$(git hash-object work/src/engine/career/contractRules.js)" = "1bc9cb11d5cfa69d499e561dc1bf40326e81aa26"
          test "$(git hash-object work/src/engine/career/contractState.js)" = "08173dabc00443ce1a2460c53c5b7199dfa93b4e"
          test "$(git hash-object work/src/engine/career/contractMarket.js)" = "9d4a795ceefa53fa3f3392bf0258b65c02a5202d"
          test "$(git hash-object work/src/engine/career/rosterControlState.js)" = "c4d7793627b5b05b353f0fa2ed8bba386a6e0434"
          test "$(git hash-object work/src/engine/career/careerEvents.js)" = "b58fb077d3399bfe8cb2913421ed8c576a75d835"
          test "$(git hash-object work/src/services/productionSeasonFactory.js)" = "cff0d41155a7836363756e47e253bdfed3ccec11"
          test "$(git hash-object work/src/api/seasonApi.js)" = "1c4fdb8be05580f480827e6e2b19cf34c91bff74"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "47511a7d2f97e803082f3bb3702bff5e58680602"
          test "$(git hash-object work/src/ui/seasonRender.js)" = "8954527c5bf52e9433ea8c9523bb498506501f78"
      - name: Install v54 trade system
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > work/src/engine/career/tradeAI.js
          echo '' | base64 -d > work/src/engine/career/tradeState.js
          echo '' | base64 -d > work/src/services/tradeService.js
          echo '' | base64 -d > work/scripts/verify-v54-trade-system.mjs
          echo '' | base64 -d > work/scripts/verify-v54-trade-rollover.mjs
          echo '' | base64 -d > work/scripts/browser-trade-v54.py
          echo '' | base64 -d > work/README_KO.md
          echo '' | base64 -d > /tmp/patch-v54.py
          python3 /tmp/patch-v54.py
          node --check work/src/engine/career/tradeAI.js
          node --check work/src/engine/career/tradeState.js
          node --check work/src/services/tradeService.js
          node --check work/src/services/productionSeasonFactory.js
          node --check work/src/engine/career/careerEvents.js
          node --check work/src/api/seasonApi.js
          node --check work/src/services/seasonSerialization.js
          node --check work/src/ui/seasonRender.js
          node --check work/scripts/verify-v54-trade-system.mjs
          node --check work/scripts/verify-v54-trade-rollover.mjs
          python3 -m py_compile work/scripts/browser-trade-v54.py
      - name: v54 focused Trade System gate
        run: cd work && node scripts/verify-v54-trade-system.mjs
      - name: Re-run v53 gate
        run: cd work && node scripts/verify-v53-arbitration-free-agency.mjs
      - name: Re-run v52 gate
        run: cd work && node scripts/verify-v52-roster-rules.mjs
      - name: Re-run v51 gate
        run: cd work && node scripts/verify-v51-contract-service.mjs
      - name: Re-run current MVP regression
        run: cd work && node scripts/verify-v50-1g-current-mvp.mjs --verify --output=reports/v54-current-mvp-regression.json
      - name: Re-run Production runtime
        run: cd work && node scripts/verify-v50-2a-production-data-runtime.mjs --verify --output=reports/v54-production-data-runtime-regression.json
      - name: Full 2026 to 2027 trade rollover
        run: cd work && node scripts/verify-v54-trade-rollover.mjs
      - name: Build v54 Production standalone
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs --output=dist/THE_CALL_UP_SEASON_STANDALONE_v54_PRODUCTION.html --master-snapshot=/tmp/tcu-production-v2.json
          python3 - <<'PY2'
          from pathlib import Path
          p=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v54_PRODUCTION.html")
          s=p.read_text(encoding="utf-8").replace("Season v49","Season v54").replace("Season v53","Season v54")
          p.write_text(s,encoding="utf-8")
          assert p.stat().st_size>1_000_000
          assert "Trade Market" in s and "full_career_trade_system_v54" in s and "사용자는 GM이 아닙니다" in s
          PY2
      - name: Install Playwright
        shell: bash
        run: |
          python3 -m venv /tmp/tcu-v54-browser
          source /tmp/tcu-v54-browser/bin/activate
          pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: v54 mobile trade smoke
        shell: bash
        run: |
          source /tmp/tcu-v54-browser/bin/activate
          cd work
          python scripts/browser-trade-v54.py
      - name: v54 checkpoint report
        shell: bash
        run: |
          cd work
          python3 - <<'PY2'
          import hashlib,json
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text())
          for p in ["reports/v54-trade-system-gate.json","reports/v54-trade-rollover-gate.json","reports/v54-trade-browser-smoke.json","reports/v54-current-mvp-regression.json","reports/v54-production-data-runtime-regression.json"]: assert load(p)["pass"]
          h=Path("dist/THE_CALL_UP_SEASON_STANDALONE_v54_PRODUCTION.html");d=h.read_bytes()
          r={"schema":"THE_CALL_UP_V54_TRADE_SYSTEM_CHECKPOINT","pass":True,"version":"v54","features":{"tradeValueNotOvr":True,"buyerSeller":True,"rentals":True,"packages":True,"rumors":True,"agentRequest":True,"atomicTradeService":True,"organizationRehome":True,"careerEvent":True,"saveRestore":True,"seasonRollover":True,"playerUi":True},"standalone":{"filename":h.name,"bytes":len(d),"sha256":hashlib.sha256(d).hexdigest()},"next":"v55 Full Offseason"}
          Path("reports/v54-trade-system-checkpoint.json").write_text(json.dumps(r,ensure_ascii=False,indent=2)+"\n")
          PY2
      - name: Commit verified v54
        if: ${{ success() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/src/engine/career/tradeAI.js work/src/engine/career/tradeState.js work/src/services/tradeService.js work/src/engine/career/rosterControlState.js work/src/engine/career/careerEvents.js work/src/services/productionSeasonFactory.js work/src/api/seasonApi.js work/src/services/seasonSerialization.js work/src/ui/seasonRender.js work/scripts/verify-v54-trade-system.mjs work/scripts/verify-v54-trade-rollover.mjs work/scripts/browser-trade-v54.py work/README_KO.md work/reports/v54-*.json
          git rm .github/workflows/tcu-v54-trade-system-bundle.yml
          git commit -m "v54: add trade AI and atomic TradeService foundation [skip ci]"
          git push origin HEAD:main
      - name: Upload v54 checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v54_TRADE_SYSTEM
          path: |
            work/dist/THE_CALL_UP_SEASON_STANDALONE_v54_PRODUCTION.html
            work/reports/v54-trade-system-gate.json
            work/reports/v54-trade-rollover-gate.json
            work/reports/v54-trade-browser-smoke.json
            work/reports/v54-trade-system-checkpoint.json
            work/README_KO.md
          if-no-files-found: ignore
          compression-level: 0
