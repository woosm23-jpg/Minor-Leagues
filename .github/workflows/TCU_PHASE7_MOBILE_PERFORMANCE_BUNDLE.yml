name: THE CALL-UP Phase 7 Mobile Save and Simulation Responsiveness Bundle

on:
  push:
    paths:
      - '.github/workflows/TCU_PHASE7_MOBILE_PERFORMANCE_BUNDLE.yml'
  workflow_dispatch:

permissions:
  contents: write

