      - name: Run full unit suite and coalescing milestone safety tests
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          npm test
          git diff --check
      - name: Verify actual redundant save avoidance and existing snapshot speed gate
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-v55-1-performance.mjs
          node scripts/verify-phase7-mobile-performance.mjs
          node --input-type=module <<'TCU_PHASE7_SAVES'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const x=JSON.parse(readFileSync("reports/phase7-mobile-performance-bundle.json","utf8"));
          assert.equal(x.pass,true);
          assert.equal(x.burstRequestedAutoSaves,81);
          assert.equal(x.burstActualSaveSerializations,2);
          assert.equal(x.latestProgressedSavePreserved,true);
          console.log("Phase 7 save burst gate PASS");
          TCU_PHASE7_SAVES
      - name: Verify production v3 2026 whole world and postseason without gameplay changes
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-phase3-integration-4r.mjs
          node --input-type=module <<'TCU_PHASE7_WORLD'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const w=JSON.parse(readFileSync("reports/phase3-integrated-regression-4r-v1.json","utf8"));
          assert.equal(w.pass,true);
          assert.equal(w.regularSeason.worldGames,10710);
          assert.ok(w.postseason.championTeamId);
          assert.ok(Object.values(w.gates).every(Boolean));
          console.log("Phase 7 production v3 world and postseason gate PASS");
          TCU_PHASE7_WORLD
          git diff --check
      - name: Commit only after all mobile and world gates pass
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git add src/services/coalescedSaveQueue.js src/app/seasonApp.js src/ui/seasonRender.js styles/app.css tests/phase7MobilePerformance.test.js scripts/verify-phase7-mobile-performance.mjs reports/phase7-mobile-performance-bundle.json reports/v55-1-performance-gate.json reports/phase3-integrated-regression-4r-v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No verified Phase 7 changes; refusing empty commit.' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'phase7: coalesce autosave bursts and show mobile simulation progress'
          git push origin HEAD:main
