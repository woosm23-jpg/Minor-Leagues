          from pathlib import Path
          
          def once(path, before, after):
              f=Path(path)
              source=f.read_text(encoding="utf-8")
              n=source.count(before)
              if n!=1: raise RuntimeError(f"Phase 7 exact anchor failure: {path}, matches={n}, prefix={before[:88]!r}")
              f.write_text(source.replace(before, after, 1),encoding="utf-8")
          
          p="src/app/seasonApp.js"
          needle='import { seasonApi } from "../api/seasonApi.js";'
          once(p,needle,needle+'\nimport { createCoalescedSaveQueue } from "../services/coalescedSaveQueue.js";')
          needle='function startSeasonApp(root) {'
          helper='''function waitForProgressPaint() {
            return new Promise(resolve => {
              let done = false;
              let timeout = null;
              const finish = () => {
                if (done) return;
                done = true;
                if (timeout !== null) globalThis.clearTimeout?.(timeout);
                resolve();
              };
              if (typeof globalThis.requestAnimationFrame === "function" && globalThis.document?.visibilityState !== "hidden") {
                if (typeof globalThis.setTimeout === "function") timeout = globalThis.setTimeout(finish, 700);
                globalThis.requestAnimationFrame(() => globalThis.requestAnimationFrame(finish));
              } else if (typeof globalThis.setTimeout === "function") {
                globalThis.setTimeout(finish, 0);
              } else finish();
            });
          }
          
          '''
          once(p,needle,helper+needle)
          needle='  let saveMessage = "";'
          once(p,needle,needle+'\n  let simBusy = false;')
          needle='  const saveUi = () => ({ saveMessage, currentSaveId, backups, playerSection, leagueSection, moreSection, leaderCategory, orgPosition, playerDetail, majorEvent });'
