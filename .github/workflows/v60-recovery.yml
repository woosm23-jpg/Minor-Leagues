name: THE CALL-UP v60 RC Recovery V2

on:
  push:
    paths:
      - '.github/workflows/tcu-v60-rc-recovery-v2-clear.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify v59 baseline and prior v60 PASS evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object work/src/api/seasonApi.js)" = "b9ae11065c047f28363bc34ec73649bdf279cd98"
          test "$(git hash-object work/src/services/seasonSerialization.js)" = "b0bd644fa0c7b344bc067eb121c5affee1d98c6a"
          test "$(git hash-object work/reports/v59-long-run-stress-checkpoint.json)" = "7782f038c455c0e445990c9db32c97719827a45e"
          grep -q '"pass": true' work/reports/v59-long-run-stress-checkpoint.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/actions/runs/35816238393" > /tmp/prior-run.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/actions/runs/35816238393/jobs?per_page=100" > /tmp/prior-jobs.json
          python3 - <<'PY2'
          import json
          r=json.load(open('/tmp/prior-run.json'))
          assert r['head_sha']=='c69f57a07cf87ff3276178d6c55638e677b85951'
          assert r['conclusion']=='failure'
          d=json.load(open('/tmp/prior-jobs.json'))
          jobs=d.get('jobs',[]); assert jobs
          steps={s['name']:s.get('conclusion') for s in jobs[0].get('steps',[])}
          required=[
            'Verify v59 baseline','Apply v60 RC harness and release labels',
            'v60 Production data and ratings gates','v60 core simulation sanity',
            'v60 persistence regression','v60 career systems regression A','v60 career systems regression B'
          ]
          for name in required:
            assert steps.get(name)=='success',(name,steps.get(name))
          # The lifecycle step used continue-on-error in the prior RC run.
          # GitHub may expose its conclusion as success even though the command failed.
          assert steps.get('v60 Production lifecycle and FULL save round-trip') in ('success','failure')
          assert steps.get('Aggregate v60 RC outcomes')=='failure'
          print('PRIOR_V60_GATES_VERIFIED',required)
          PY2

      - name: Apply v60 RC labels and recovery harness
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/v60-patch.py
          python3 /tmp/v60-patch.py
          printf '%s' '' | base64 -d > work/scripts/verify-v60-complete-edition-rc.mjs
          printf '%s' '' | base64 -d > work/scripts/browser-v60-complete-edition-rc.py
          node --check work/scripts/verify-v60-complete-edition-rc.mjs
          python3 -m py_compile work/scripts/browser-v60-complete-edition-rc.py
          node --check work/src/api/seasonApi.js
          node --check work/src/services/seasonSerialization.js
          node --check work/scripts/build-standalone.mjs
          grep -q 'complete_edition_rc_v60' work/src/api/seasonApi.js
          grep -q 'complete_edition_rc_v60' work/src/services/seasonSerialization.js
          grep -q 'Complete Edition RC v60' work/scripts/build-standalone.mjs

      - name: Recover v60 Production lifecycle and save stability
        id: lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cd work
          node scripts/verify-v60-complete-edition-rc.mjs
          cat reports/v60-complete-edition-rc-gate.json

      - name: Build v60 Complete Edition RC HTML
        id: build
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz > /tmp/tcu-production-v2.json
          cd work
          node scripts/build-standalone.mjs --output=dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html --master-snapshot=/tmp/tcu-production-v2.json
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html')
          s=p.read_text(encoding='utf-8')
          assert p.stat().st_size > 1_000_000
          for needle in ['complete_edition_rc_v60','Complete Edition RC v60','Hall of Fame','ANNOUNCE_FINAL_SEASON','SIM_7_DAYS','SIM_IMPORTANT']:
              assert needle in s, needle
          print('HTML_BYTES',p.stat().st_size)
          PY2

      - name: Install isolated Playwright
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tcu-v60-browser
          source /tmp/tcu-v60-browser/bin/activate
          python -m pip install --upgrade pip
          pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: v60 portrait mobile browser gate
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/tcu-v60-browser/bin/activate
          cd work
          python scripts/browser-v60-complete-edition-rc.py
          cat reports/v60-complete-edition-rc-browser.json

      - name: Write v60 RC recovery checkpoint
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY2'
          import hashlib,json
          from pathlib import Path
          lifecycle=json.loads(Path('reports/v60-complete-edition-rc-gate.json').read_text())
          browser=json.loads(Path('reports/v60-complete-edition-rc-browser.json').read_text())
          v59=json.loads(Path('reports/v59-long-run-stress-checkpoint.json').read_text())
          assert lifecycle['pass'] and browser['pass'] and v59['pass']
          html=Path('dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html')
          checkpoint={
            'schema':'THE_CALL_UP_V60_COMPLETE_EDITION_RC_CHECKPOINT',
            'pass':True,
            'gameVersion':'complete_edition_rc_v60',
            'evidence':{
              'priorIntegrationRun':35816238393,
              'priorGates':[
                'Production data and ratings','core simulation','persistence',
                'career systems A','career systems B'
              ],
              'lifecycleRecovery':True,
              'v59LongRun20Seasons':True,
              'mobilePortrait':True
            },
            'saveValidation':lifecycle['saveValidation'],
            'lifecycle':{'finalState':lifecycle['finalState'],'stages':lifecycle['lifecycle']['stages']},
            'standalone':{
              'filename':html.name,'bytes':html.stat().st_size,
              'sha256':hashlib.sha256(html.read_bytes()).hexdigest()
            },
            'next':'v60 final release gate / Complete Edition'
          }
          Path('reports/v60-complete-edition-rc-checkpoint.json').write_text(json.dumps(checkpoint,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(checkpoint,ensure_ascii=False,indent=2))
          PY2

      - name: Commit verified v60 RC
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/src/api/seasonApi.js work/src/services/seasonSerialization.js work/scripts/build-standalone.mjs             work/scripts/verify-v60-complete-edition-rc.mjs work/scripts/browser-v60-complete-edition-rc.py             work/CURRENT_STATUS.md work/README_KO.md             work/reports/v60-complete-edition-rc-gate.json work/reports/v60-complete-edition-rc-browser.json             work/reports/v60-complete-edition-rc-checkpoint.json work/dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html
          git rm -f .github/workflows/tcu-v60-complete-edition-rc.yml .github/workflows/tcu-v60-rc-lifecycle-recovery.yml .github/workflows/tcu-v60-rc-lifecycle-recovery-v2.yml || true
          git commit -m "v60: complete edition release candidate integration [skip ci]"
          git push origin HEAD:main

      - name: Upload v60 RC artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: THE_CALL_UP_v60_COMPLETE_EDITION_RC_RECOVERY
          path: |
            work/reports/v60-complete-edition-rc-gate.json
            work/reports/v60-complete-edition-rc-browser.json
            work/reports/v60-complete-edition-rc-checkpoint.json
            work/dist/THE_CALL_UP_COMPLETE_EDITION_RC_v60.html
          if-no-files-found: warn
          retention-days: 90
