name: THE CALL-UP Phase 3 Player Rest Request

on:
  push:
    paths:
      - '.github/workflows/TCU_PHASE3_PLAYER_REST_REQUEST.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  player-rest-request:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Implement player request and manager coverage decision
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path

          def replace_once(path, before, after):
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(before)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one main-branch anchor, found {count}. Do not overwrite newer code.")
              file.write_text(source.replace(before, after, 1), encoding="utf-8")

          def new_file(path, source):
              file = Path(path)
              if file.exists():
                  raise RuntimeError(f"{path} already exists; inspect main first")
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(source, encoding="utf-8")

          new_file('src/engine/season/playerRestRequest.js', 'const REST_STATUSES = new Set(["PENDING", "APPROVED", "DECLINED", "CANCELLED"]);\nconst REST_REASONS = new Set([\n  "COVER_AVAILABLE", "NO_AVAILABLE_COVER", "NOT_STARTER",\n  "NOT_ON_ROSTER", "INJURED_OR_REPLACED", "USER_CANCELLED"\n]);\n\nfunction createPlayerRestRequest({ gameId, level, date, requestedDate }) {\n  for (const [key, value] of Object.entries({ gameId, level, date, requestedDate })) {\n    if (typeof value !== "string" || !value) throw new TypeError(`휴식 요청 ${key}가 필요합니다.`);\n  }\n  return Object.freeze({ version: 1, gameId, level, date, requestedDate,\n    status: "PENDING", reasonCode: null, resolvedDate: null });\n}\n\nfunction validatePlayerRestRequest(value, label = "restRequest") {\n  if (value == null) return true;\n  if (!value || typeof value !== "object" || Array.isArray(value) || value.version !== 1) {\n    throw new RangeError(`${label} 버전이 호환되지 않습니다.`);\n  }\n  if (!REST_STATUSES.has(value.status)) throw new RangeError(`${label} 상태가 잘못되었습니다.`);\n  for (const key of ["gameId", "level", "date", "requestedDate"]) {\n    if (typeof value[key] !== "string" || !value[key]) throw new TypeError(`${label}.${key}가 필요합니다.`);\n  }\n  for (const key of ["date", "requestedDate"]) {\n    if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(value[key])) throw new RangeError(`${label}.${key}가 날짜가 아닙니다.`);\n  }\n  if (value.status === "PENDING") {\n    if (value.reasonCode !== null || value.resolvedDate !== null) throw new RangeError(`${label} 미처리 상태가 잘못되었습니다.`);\n  } else {\n    if (!REST_REASONS.has(value.reasonCode) ||\n      typeof value.resolvedDate !== "string" || !/^\\d{4}-\\d{2}-\\d{2}$/.test(value.resolvedDate)) {\n      throw new RangeError(`${label} 결과가 잘못되었습니다.`);\n    }\n  }\n  return true;\n}\n\nfunction settlePlayerRestRequest(request, { approved = false, reasonCode, date }) {\n  validatePlayerRestRequest(request);\n  if (request.status !== "PENDING") return request;\n  if (!REST_REASONS.has(reasonCode) || !/^\\d{4}-\\d{2}-\\d{2}$/.test(date)) throw new RangeError("휴식 요청 결과가 잘못되었습니다.");\n  return Object.freeze({ ...request,\n    status: reasonCode === "USER_CANCELLED" ? "CANCELLED" : approved ? "APPROVED" : "DECLINED",\n    reasonCode, resolvedDate: date });\n}\n\nfunction getPlayerRestRequestPublicView(request) {\n  if (!request) return Object.freeze({ status: "NONE", gameId: null, level: null, date: null, reasonCode: null });\n  validatePlayerRestRequest(request);\n  return Object.freeze({ status: request.status, gameId: request.gameId, level: request.level,\n    date: request.date, reasonCode: request.reasonCode });\n}\n\nexport { createPlayerRestRequest, validatePlayerRestRequest, settlePlayerRestRequest, getPlayerRestRequestPublicView };\n')
          replace_once('src/engine/season/lineupRestAI.js', '    opposingPitcher = null,\n    scheduleContext = null\n  } = {}\n) {', '    opposingPitcher = null,\n    scheduleContext = null,\n    voluntaryRestPlayerId = null\n  } = {}\n) {')
          replace_once('src/engine/season/lineupRestAI.js', '  for (\n    const bench of\n    roster.bench\n  ) {', '  // A player\'s request is considered only after injury coverage, and only if\n  // a healthy reserve can cover the position. There is no synthetic injury,\n  // performance boost, or automatic override of the manager\'s roster.\n  let voluntaryRest = null;\n  if (voluntaryRestPlayerId) {\n    const requestedSlot = slots.find((slot) => slot.starterId === voluntaryRestPlayerId);\n    if (!requestedSlot) {\n      voluntaryRest = { approved: false, reasonCode: "NOT_STARTER" };\n    } else if (!available(playerStates, voluntaryRestPlayerId) || requestedSlot.playerId !== voluntaryRestPlayerId) {\n      voluntaryRest = { approved: false, reasonCode: "INJURED_OR_REPLACED" };\n    } else {\n      const cover = roster.bench.find((bench) =>\n        !usedBenchIds.has(bench.playerId)\n        && available(playerStates, bench.playerId)\n        && directBenchCoverage(roster, playerStates, roleStates, bench.playerId, requestedSlot.position)\n      );\n      if (!cover) {\n        voluntaryRest = { approved: false, reasonCode: "NO_AVAILABLE_COVER" };\n      } else {\n        requestedSlot.playerId = cover.playerId;\n        usedBenchIds.add(cover.playerId);\n        usedBenchIds.add(voluntaryRestPlayerId);\n        rested.push(voluntaryRestPlayerId);\n        replacements.push({ kind: "PLAYER_REST_REQUEST", playerId: cover.playerId,\n          forPlayerId: voluntaryRestPlayerId, position: requestedSlot.position });\n        voluntaryRest = { approved: true, reasonCode: "COVER_AVAILABLE" };\n      }\n    }\n  }\n\n  for (\n    const bench of\n    roster.bench\n  ) {')
          replace_once('src/engine/season/lineupRestAI.js', '  const bench =\n    dailyBenchRows(\n      roster,\n      lineup,\n      playerStates,\n      roleStates\n    );', '  const bench =\n    dailyBenchRows(\n      roster,\n      lineup,\n      playerStates,\n      roleStates\n    ).filter((row) => !voluntaryRest?.approved || row.playerId !== voluntaryRestPlayerId);')
          replace_once('src/engine/season/lineupRestAI.js', '    bench,\n    rested,\n    unavailable,\n    replacements,\n    utilityAssignments,\n    competitionDecisions,\n    positionAssignments:\n      optimized.changes,', '    bench,\n    rested,\n    unavailable,\n    replacements,\n    utilityAssignments,\n    competitionDecisions,\n    ...(voluntaryRestPlayerId ? { voluntaryRest } : {}),\n    positionAssignments:\n      optimized.changes,')
          replace_once('src/services/demoSeasonFactory.js', 'function createSeasonGameFixture({ seasonFixture, scheduleGame, playerStates = null, pitcherStates = null, roleStates = null, level = "AAA" }) {', 'function createSeasonGameFixture({ seasonFixture, scheduleGame, playerStates = null, pitcherStates = null, roleStates = null, level = "AAA", voluntaryRestPlayerId = null }) {')
          replace_once('src/services/demoSeasonFactory.js', '      scheduleContext: buildTeamScheduleContext(\n        league,\n        scheduleGame,\n        scheduleGame.awayTeamId\n      )', '      scheduleContext: buildTeamScheduleContext(\n        league,\n        scheduleGame,\n        scheduleGame.awayTeamId\n      ),\n      voluntaryRestPlayerId: awayRoster.players?.[voluntaryRestPlayerId] ? voluntaryRestPlayerId : null')
          replace_once('src/services/demoSeasonFactory.js', '      scheduleContext: buildTeamScheduleContext(\n        league,\n        scheduleGame,\n        scheduleGame.homeTeamId\n      )', '      scheduleContext: buildTeamScheduleContext(\n        league,\n        scheduleGame,\n        scheduleGame.homeTeamId\n      ),\n      voluntaryRestPlayerId: homeRoster.players?.[voluntaryRestPlayerId] ? voluntaryRestPlayerId : null')
          replace_once('src/services/demoSeasonFactory.js', '    dailyLineups: Object.freeze({ away: awayDaily, home: homeDaily }),\n    benchPlans: Object.freeze({', '    dailyLineups: Object.freeze({ away: awayDaily, home: homeDaily }),\n    ...(voluntaryRestPlayerId ? { voluntaryRest: awayRoster.players?.[voluntaryRestPlayerId]\n      ? awayDaily.voluntaryRest : homeRoster.players?.[voluntaryRestPlayerId]\n        ? homeDaily.voluntaryRest : { approved: false, reasonCode: "NOT_ON_ROSTER" } } : {}),\n    benchPlans: Object.freeze({')
          replace_once('src/api/seasonApi.js', 'import { getTrainingCoachFeedback } from "../engine/season/coachingFeedback.js";', 'import { getTrainingCoachFeedback } from "../engine/season/coachingFeedback.js";\nimport { createPlayerRestRequest, settlePlayerRestRequest, getPlayerRestRequestPublicView } from "../engine/season/playerRestRequest.js";')
          replace_once('src/api/seasonApi.js', 'function simulateScheduledGame(session, level, game, { skipRecovery = false } = {}) {', 'function canRequestNextGameRest(session, level, game) {\n  if (!game || session.activeGameId) return false;\n  const userId = session.fixture.userPlayerId;\n  const roster = levelLeague(session, level)?.rosters?.[userTeamIdForLevel(session, level)];\n  return Boolean(roster?.lineupSlots?.some((slot) => slot.starterId === userId))\n    && healthAvailability(session.playerStates?.[userId]?.health) === "AVAILABLE";\n}\n\nfunction prepareRequestedGameFixture(session, level, game) {\n  const playerId = session.fixture.userPlayerId;\n  const request = session.playerStates?.[playerId]?.restRequest ?? null;\n  const pending = request?.status === "PENDING" && request.gameId === game.gameId && request.level === level;\n  const fixture = createSeasonGameFixture({ seasonFixture: session.fixture, scheduleGame: game,\n    playerStates: session.playerStates, pitcherStates: session.pitcherStates,\n    roleStates: session.roleStates, level, voluntaryRestPlayerId: pending ? playerId : null });\n  if (pending) {\n    const verdict = fixture.voluntaryRest ?? { approved: false, reasonCode: "NOT_ON_ROSTER" };\n    session.playerStates = { ...session.playerStates, [playerId]: Object.freeze({\n      ...session.playerStates[playerId], restRequest: settlePlayerRestRequest(request, {\n        approved: verdict.approved, reasonCode: verdict.reasonCode, date: game.date\n      })\n    }) };\n  }\n  return fixture;\n}\n\nfunction simulateScheduledGame(session, level, game, { skipRecovery = false } = {}) {')
          replace_once('src/api/seasonApi.js', '  if (!skipRecovery) recoverAllPlayersToDate(session, game.date);\n  const fixture = createSeasonGameFixture({ seasonFixture: session.fixture, scheduleGame: game, playerStates: session.playerStates, pitcherStates: session.pitcherStates, roleStates: session.roleStates, level });', '  if (!skipRecovery) recoverAllPlayersToDate(session, game.date);\n  const fixture = prepareRequestedGameFixture(session, level, game);')
          replace_once('src/api/seasonApi.js', '    const fixture = createSeasonGameFixture({ seasonFixture: session.fixture, scheduleGame: game, playerStates: session.playerStates, pitcherStates: session.pitcherStates, roleStates: session.roleStates, level });', '    const fixture = prepareRequestedGameFixture(session, level, game);')
          replace_once('src/api/seasonApi.js', '    nextGame: scheduleGameView(session, nextGame, level), currentSeries: currentSeriesView(session, nextGame, level), standings, leaders,', '    userRestRequest: Object.freeze({\n      ...getPlayerRestRequestPublicView(session.playerStates?.[session.fixture.userPlayerId]?.restRequest ?? null),\n      canRequest: canRequestNextGameRest(session, level, nextGame)\n    }),\n    nextGame: scheduleGameView(session, nextGame, level), currentSeries: currentSeriesView(session, nextGame, level), standings, leaders,')
          replace_once('src/api/seasonApi.js', '  serializeSeason(seasonId) {', '  requestNextGameRest(seasonId) {\n    const session = assertSession(seasonId);\n    const level = currentUserLevel(session);\n    const game = nextUserGame(session);\n    if (!canRequestNextGameRest(session, level, game)) throw new RangeError("현재 다음 경기 휴식을 신청할 수 없습니다.");\n    const playerId = session.fixture.userPlayerId;\n    const current = session.playerStates[playerId];\n    const requested = current.restRequest;\n    if (requested?.status === "PENDING" && requested.gameId === game.gameId && requested.level === level) return snapshot(session);\n    const restRequest = createPlayerRestRequest({ gameId: game.gameId, level, date: game.date,\n      requestedDate: session.state.currentDate });\n    session.playerStates = { ...session.playerStates, [playerId]: Object.freeze({ ...current, restRequest }) };\n    return snapshot(session);\n  },\n  cancelNextGameRest(seasonId) {\n    const session = assertSession(seasonId);\n    const playerId = session.fixture.userPlayerId;\n    const current = session.playerStates[playerId];\n    const request = current?.restRequest;\n    if (!request || request.status !== "PENDING") throw new RangeError("취소할 휴식 요청이 없습니다.");\n    session.playerStates = { ...session.playerStates, [playerId]: Object.freeze({ ...current,\n      restRequest: settlePlayerRestRequest(request, { reasonCode: "USER_CANCELLED", date: session.state.currentDate })\n    }) };\n    return snapshot(session);\n  },\n  serializeSeason(seasonId) {')
          replace_once('src/services/seasonSerialization.js', 'import { CAREER_EVENT_TYPES } from "../engine/career/careerEvents.js";', 'import { CAREER_EVENT_TYPES } from "../engine/career/careerEvents.js";\nimport { validatePlayerRestRequest } from "../engine/season/playerRestRequest.js";')
          replace_once('src/services/seasonSerialization.js', '    validateHealthState(playerState.health, `payload.playerStates.${playerId}.health`);\n    validateAgingState(playerState.aging', '    validateHealthState(playerState.health, `payload.playerStates.${playerId}.health`);\n    validatePlayerRestRequest(playerState.restRequest ?? null, `payload.playerStates.${playerId}.restRequest`);\n    validateAgingState(playerState.aging')
          replace_once('src/ui/seasonRender.js', 'function nextGameCard(snapshot) {', 'function restRequestCard(snapshot) {\n  const next = snapshot.nextGame;\n  const request = snapshot.userRestRequest ?? { status: "NONE" };\n  if (!next && request.status === "NONE") return "";\n  const pending = request.status === "PENDING";\n  const results = {\n    COVER_AVAILABLE: "대체 선수가 있어 감독이 휴식을 승인했습니다.",\n    NO_AVAILABLE_COVER: "해당 포지션을 맡을 건강한 대체 선수가 없어 감독이 거절했습니다.",\n    NOT_STARTER: "현재 선발 예정이 아니어서 휴식 요청이 적용되지 않았습니다.",\n    NOT_ON_ROSTER: "로스터 이동으로 휴식 요청이 적용되지 않았습니다.",\n    INJURED_OR_REPLACED: "부상 또는 기존 라인업 변경으로 휴식 요청이 적용되지 않았습니다.",\n    USER_CANCELLED: "휴식 요청을 취소했습니다."\n  };\n  const message = pending ? "감독 판단 대기 중 · 다음 경기 라인업을 구성할 때 결정됩니다."\n    : request.status === "NONE" ? "다음 경기 선발 휴식을 요청할 수 있습니다. 감독은 대체 선수와 수비 커버를 확인합니다."\n    : results[request.reasonCode] ?? "다음 경기 휴식 신청을 확인할 수 있습니다.";\n  const canCancel = pending;\n  const canRequest = Boolean(next && request.canRequest && !pending);\n  return `<section class="card next-game-card player-rest-request-card">\n    <div class="section-head"><strong>선수·감독 상담 · 다음 경기 휴식</strong><span>${dateLabel(next?.date ?? request.date)}</span></div>\n    <p class="condition-note">${esc(message)} 휴식 신청은 부상이 아니며, 성적·성장·승격 보너스를 주지 않습니다.</p>\n    <div class="progress-actions">\n      ${canCancel ? `<button type="button" class="secondary" data-season-action="CANCEL_REST">휴식 요청 취소</button>` : ""}\n      ${canRequest ? `<button type="button" class="secondary" data-season-action="REQUEST_REST">다음 경기 휴식 요청</button>` : ""}\n    </div>\n  </section>`;\n}\n\nfunction nextGameCard(snapshot) {')
          replace_once('src/ui/seasonRender.js', '${recordCard(snapshot)}${conditionCard(snapshot)}${roleStatusCard(snapshot)}${pitchingStaffCard(snapshot)}', '${recordCard(snapshot)}${conditionCard(snapshot)}${roleStatusCard(snapshot)}${restRequestCard(snapshot)}${pitchingStaffCard(snapshot)}')
          replace_once('src/app/seasonApp.js', '        if (action === "PLAY") {', '        if (action === "REQUEST_REST" || action === "CANCEL_REST") {\n          try {\n            snapshot = action === "REQUEST_REST"\n              ? seasonApi.requestNextGameRest(snapshot.seasonId)\n              : seasonApi.cancelNextGameRest(snapshot.seasonId);\n            saveMessage = action === "REQUEST_REST" ? "휴식 요청을 전달했습니다." : "휴식 요청을 취소했습니다.";\n            renderHome();\n            void queueAutosave();\n          } catch (error) {\n            saveMessage = `휴식 요청 처리 실패: ${error?.message ?? error}`;\n            renderHome();\n          }\n          return;\n        }\n        if (action === "PLAY") {')
          new_file('tests/playerRestRequest.test.js', "import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport { writeFileSync } from 'node:fs';\nimport { seasonApi } from '../src/api/seasonApi.js';\nimport { createPlayerRestRequest, settlePlayerRestRequest, validatePlayerRestRequest } from '../src/engine/season/playerRestRequest.js';\nimport { renderSeason } from '../src/ui/seasonRender.js';\n\nconst root = () => ({ innerHTML: '', querySelectorAll: () => [], querySelector: () => null });\n\ntest('rest request is save-safe, and a qualified reserve covers a full rest day', () => {\n  const original = seasonApi.createDemoSeason({ seed: 'phase3-player-rest-approved', startDate: '2026-04-01' });\n  const id = original.seasonId;\n  assert.equal(original.userRestRequest.canRequest, true);\n  const requested = seasonApi.requestNextGameRest(id);\n  assert.equal(requested.userRestRequest.status, 'PENDING');\n  assert.equal(requested.userRestRequest.gameId, original.nextGame.gameId);\n  const ui = root();\n  renderSeason(ui, requested, {}, 'HOME', {});\n  assert.match(ui.innerHTML, /휴식 요청 취소/);\n  const pendingPayload = seasonApi.serializeSeason(id);\n  const restoredPending = seasonApi.restoreSeason(pendingPayload);\n  assert.equal(restoredPending.userRestRequest.status, 'PENDING');\n  const advanced = seasonApi.simulateOneDay(id);\n  assert.equal(advanced.userRestRequest.status, 'APPROVED');\n  assert.equal(advanced.userRestRequest.reasonCode, 'COVER_AVAILABLE');\n  assert.equal(advanced.userSeasonLine.G, 0, 'a full rest day must exclude the player from the lineup and bench');\n  assert.ok(advanced.progress.gamesPlayed >= 1);\n  const checkpoint = seasonApi.serializeSeason(id);\n  const reloaded = seasonApi.restoreSeason(checkpoint);\n  assert.deepEqual(reloaded.userRestRequest, advanced.userRestRequest);\n  assert.equal(reloaded.userSeasonLine.G, 0);\n  const once = seasonApi.simulateOneDay(id);\n  const replay = seasonApi.restoreSeason(checkpoint);\n  const twice = seasonApi.simulateOneDay(id);\n  assert.equal(once.currentDate, twice.currentDate);\n  assert.deepEqual(once.userSeasonLine, twice.userSeasonLine);\n\n  writeFileSync('reports/phase3-player-rest-request.json', JSON.stringify({\n    schema: 'THE_CALL_UP_PHASE3_PLAYER_REST_REQUEST_V1', pass: true,\n    playerRequestedAndManagerApprovedWithCoverage: true,\n    noForcedPlayerAppearance: true, requestSaveRestore: true,\n    deterministicDayReplay: true, cancellation: true,\n    noCoverageDeclinedWithoutInjuryMutation: true,\n    historicalSaveCompatibility: true\n  }, null, 2) + '\\n', 'utf8');\n});\n\ntest('cancelled requests do not remove the player from the game', () => {\n  const original = seasonApi.createDemoSeason({ seed: 'phase3-player-rest-cancelled', startDate: '2026-04-01' });\n  const id = original.seasonId;\n  seasonApi.requestNextGameRest(id);\n  const cancelled = seasonApi.cancelNextGameRest(id);\n  assert.equal(cancelled.userRestRequest.status, 'CANCELLED');\n  assert.equal(cancelled.userRestRequest.reasonCode, 'USER_CANCELLED');\n  const after = seasonApi.simulateOneDay(id);\n  assert.equal(after.userRestRequest.status, 'CANCELLED');\n  assert.equal(after.userSeasonLine.G, 1, 'cancellation must retain ordinary lineup selection');\n});\n\ntest('manager declines when no healthy direct cover exists without faking an injury', () => {\n  const original = seasonApi.createDemoSeason({ seed: 'phase3-player-rest-declined', startDate: '2026-04-01' });\n  const id = original.seasonId;\n  const payload = seasonApi.serializeSeason(id);\n  const userId = payload.fixture.userPlayerId;\n  const beforeHealth = structuredClone(payload.playerStates[userId].health);\n  const roster = payload.fixture.organization.levels.AAA.roster;\n  const backup = roster.bench.find(row => row.coverage.includes('CF'));\n  assert.ok(backup, 'demo CF needs one direct reserve');\n  payload.playerStates[backup.playerId].health.activeInjury = {\n    injuryId: 'qa_rest_backup_unavailable', family: 'LOWER_BODY', severity: 'MAJOR',\n    startDate: '2026-04-01', expectedReturnDate: '2026-05-01', daysRemaining: 30\n  };\n  seasonApi.restoreSeason(payload);\n  const requested = seasonApi.requestNextGameRest(id);\n  assert.equal(requested.userRestRequest.status, 'PENDING');\n  assert.deepEqual(seasonApi.serializeSeason(id).playerStates[userId].health, beforeHealth,\n    'a request must never create an injury or alter health');\n  const after = seasonApi.simulateOneDay(id);\n  assert.equal(after.userRestRequest.status, 'DECLINED');\n  assert.equal(after.userRestRequest.reasonCode, 'NO_AVAILABLE_COVER');\n  assert.equal(after.userSeasonLine.G, 1);\n});\n\ntest('old saves without a request remain valid and malformed request states are rejected', () => {\n  const original = seasonApi.createDemoSeason({ seed: 'phase3-player-rest-legacy', startDate: '2026-04-01' });\n  const id = original.seasonId;\n  const old = seasonApi.serializeSeason(id);\n  delete old.playerStates[old.fixture.userPlayerId].restRequest;\n  assert.equal(seasonApi.restoreSeason(old).userRestRequest.status, 'NONE');\n  const request = createPlayerRestRequest({ gameId: 'g1', level: 'AAA', date: '2026-04-02', requestedDate: '2026-04-01' });\n  const result = settlePlayerRestRequest(request, { approved: true, reasonCode: 'COVER_AVAILABLE', date: '2026-04-02' });\n  assert.equal(validatePlayerRestRequest(result), true);\n  assert.throws(() => validatePlayerRestRequest({ ...request, status: 'APPROVED' }), /결과/);\n});\n")
          PY_PATCH
          node --check src/engine/season/playerRestRequest.js
          node --check src/engine/season/lineupRestAI.js
          node --check src/services/demoSeasonFactory.js
          node --check src/api/seasonApi.js
          node --check src/services/seasonSerialization.js
          node --check src/ui/seasonRender.js
          node --check src/app/seasonApp.js
          node --check tests/playerRestRequest.test.js
          git diff --check

      - name: Test approved declined cancelled and restored requests
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          npm test
          node --input-type=module <<'JS_ASSERT'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('reports/phase3-player-rest-request.json', 'utf8'));
          assert.equal(report.pass, true);
          for (const [key, value] of Object.entries(report)) {
            if (key !== 'schema') assert.equal(value, true, key);
          }
          console.log('Phase 3 player rest request gate PASS');
          JS_ASSERT

      - name: Commit verified source tests and report
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git add src/engine/season/playerRestRequest.js src/engine/season/lineupRestAI.js src/services/demoSeasonFactory.js src/api/seasonApi.js src/services/seasonSerialization.js src/ui/seasonRender.js src/app/seasonApp.js tests/playerRestRequest.test.js reports/phase3-player-rest-request.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No verified source change; refusing empty commit.'
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'phase3: player rest requests with manager lineup coverage and save replay'
          git push origin HEAD:main
