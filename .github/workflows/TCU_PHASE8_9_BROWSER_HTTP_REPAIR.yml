              raise RuntimeError(f'2027 active-roster normalization anchor mismatch: {s.count(before)}')
          p.write_text(s.replace(before,after,1),encoding='utf8')
          print('2027 rollover: active roster and save/restore state normalization synchronized')
          TCU_ROLLOVER_SYNC
          python3 - <<'TCU_OPENING_MARKET_CLOCK'
          from pathlib import Path
          p=Path('src/api/seasonApi.js')
          s=p.read_text(encoding='utf8')
          before='''  session.playerStateDate = nextStartDate;
            reconcileCurrentMlbServiceDate(session, nextStartDate);
            session.lastProgress = null;'''
          after='''  session.playerStateDate = nextStartDate;
            reconcileCurrentMlbServiceDate(session, nextStartDate);
            // The 2028 opening-day service credit can change a known player's
            // free-agency eligibility. Re-evaluate the market against the same
            // authoritative contract data before save, rather than mutating it
            // only when a saved career is restored later.
            session.contractMarketStates = normalizeContractMarketStatesForFixture(
              session.fixture, session.contractStates, session.contractMarketStates,
              { currentDate: nextStartDate }
            );
            session.lastProgress = null;'''
          if s.count(before)!=1:
              raise RuntimeError(f'opening-day contract-market sync anchor mismatch: {s.count(before)}')
          p.write_text(s.replace(before,after,1),encoding='utf8')
          print('Opening-day contract and agent market service days synchronized before save')
          TCU_OPENING_MARKET_CLOCK
          node --check src/api/seasonApi.js
          node --check scripts/verify-phase8-fresh-v3-two-year.mjs
          python3 -m py_compile scripts/browser-phase9-rc-smoke.py
          git diff --check
      - name: Full unit suite and previously repaired Phase 8 integrity gate
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          npm test
          node scripts/verify-phase8-save-integrity.mjs
          node --input-type=module <<'TCU_PHASE8_PRIOR'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('reports/phase8-save-integrity-bundle.json','utf8'));
          assert.equal(p.pass,true);
          assert.equal(p.fullSaveRestoreDeterministic,true);
          console.log('Latest Phase 8 integrity gate PASS');
          TCU_PHASE8_PRIOR
      - name: Build the latest single-file Korean Production v3 HTML release candidate
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          node scripts/build-standalone.mjs --output=dist/THE_CALL_UP_COMPLETE_EDITION_RC.html --master-snapshot=data/the_call_up_snapshot_v3/mlb-milb-2026-production-v3.json.gz
          node --input-type=module <<'TCU_RC_HTML'
          import assert from 'node:assert/strict';
          import {readFileSync,statSync} from 'node:fs';
          const p='dist/THE_CALL_UP_COMPLETE_EDITION_RC.html';
          const html=readFileSync(p,'utf8');
          assert.ok(statSync(p).size>1_000_000,'Unexpectedly small standalone HTML');
          assert.match(html,/<html lang="ko">/);
          assert.match(html,/__THE_CALL_UP_MASTER_SNAPSHOT__/);
          assert.match(html,/THE CALL-UP/);
          assert.match(html,/phase8-current-v3-two-year|complete_edition_v1_0/);
          console.log('Latest production standalone RC bundle structural checks PASS');
          TCU_RC_HTML
      - name: Run Chromium via real local HTTP and IndexedDB at three phone widths
        shell: bash
        working-directory: work
        timeout-minutes: 20
        run: |
          set -euo pipefail
