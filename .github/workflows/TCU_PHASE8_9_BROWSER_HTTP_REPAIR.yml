name: THE CALL-UP Phase 8-9 Real-Browser Bootstrap Repair and Release Candidate

on:
  push:
    paths:
      - '.github/workflows/TCU_PHASE8_9_BROWSER_HTTP_REPAIR.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase8-long-save-and-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fresh current-code regression and mobile smoke scripts
