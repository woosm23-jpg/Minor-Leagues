name: "THE CALL-UP v50 Phase E Bootstrap + Gates (Phone)"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/THE_CALL_UP_v50_PHASE_E_PHONE_INSTALLER.yml'
      - 'work/src/engine/career/**'
      - 'work/src/services/**'
      - 'work/src/api/seasonApi.js'
      - 'work/scripts/*ecology*v50.mjs'
      - 'work/scripts/verify-generated-pipeline-v50.mjs'
concurrency:
  group: the-call-up-v50-phase-e-bootstrap
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  bootstrap-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source data
        shell: bash
        run: |
          set -euo pipefail
          test -f data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz
          test -f data/the_call_up_snapshot_v2/production_manifest_v2.json
          test -f data/the_call_up_snapshot_v2/roster_canonicalization_v2.json
          test -f data/the_call_up_phase_c/statcast-phase-c-2026.json.gz
          test -f data/the_call_up_phase_d/public-scouting-2026.json.gz
      - name: Bootstrap full work code
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f work/src/services/productionSeasonFactory.js || ! -f work/scripts/verify-production-live-ecology-v50.mjs || ! -f work/styles/app.css ]]; then
            rm -rf work
            mkdir -p work /tmp/tcu-v50-bootstrap
            cat > /tmp/tcu-v50-bootstrap/work-code.b64 <<'TCU_WORK_CODE_B64'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          TCU_WORK_CODE_B64
            base64 --decode /tmp/tcu-v50-bootstrap/work-code.b64 > /tmp/tcu-v50-bootstrap/work-code.tar.xz
            echo "09bedb9bd22e857fc71da8fb0ec5cf68674ffc2499d4e9c253203975618474aa  /tmp/tcu-v50-bootstrap/work-code.tar.xz" | sha256sum -c -
            tar -xJf /tmp/tcu-v50-bootstrap/work-code.tar.xz -C work
          fi
          mkdir -p work/data
          for d in the_call_up_snapshot_v2 the_call_up_phase_c the_call_up_phase_d; do
            rm -rf "work/data/$d"
            cp -a "data/$d" "work/data/$d"
          done
          test -f work/src/services/productionSeasonFactory.js
          test -f work/src/services/productionOffseasonEcology.js
          test -f work/src/api/seasonApi.js
          test -f work/src/engine/career/generatedCareerPathway.js
          test -f work/scripts/verify-generated-pipeline-v50.mjs
          test -f work/scripts/verify-production-live-ecology-v50.mjs
          test -f work/scripts/audit-production-live-ecology-10y-v50.mjs
          test -f work/styles/app.css
          test -f work/data/the_call_up_snapshot_v2/mlb-milb-2026-production-v2.json.gz
      - name: Generated pipeline 20Y gate
        working-directory: work
        run: node scripts/verify-generated-pipeline-v50.mjs
      - name: Production live ecology focused gate
        working-directory: work
        run: node scripts/verify-production-live-ecology-v50.mjs
      - name: Production live ecology 10Y gate
        working-directory: work
        run: node scripts/audit-production-live-ecology-10y-v50.mjs
      - name: Commit work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work
          if ! git diff --cached --quiet; then
            git commit -m "Bootstrap THE CALL-UP v50 Phase E work code [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: the-call-up-v50-phase-e-reports
          path: |
            work/reports/v50-generated-pipeline-20y.json
            work/reports/v50-production-live-ecology-integration.json
            work/reports/v50-production-live-ecology-10y.json
          retention-days: 14
